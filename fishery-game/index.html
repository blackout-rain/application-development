<title>今日も大漁ですか？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=DM+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/game.css">

<header>
  <h1><span data-i18n>今日も大漁ですか？</span><small data-i18n>〜すきま時間の釣り経営〜</small></h1><span class="hb"><button class="ghost" id="help" data-i18n>遊び方</button></span>
  <div class="hud"><span class="dayw"><b id="day" class="num">1</b><i data-i18n>日目</i></span><span id="clock" class="num">6:00</span><span id="money" class="num">¥500</span></div>
  <div class="rank" id="rankbox" role="button" tabindex="0" aria-label="ランクと特典を見る" data-i18n-aria="ランクと特典を見る"><span id="rank">見習い漁師</span><div class="bar"><i id="goal"></i></div><span class="nx" id="goalv"></span></div>
  <div class="perkline" id="perk"></div>
  <div class="lvrow" id="lvrow" role="button" tabindex="0" aria-label="ステータスを見る" data-i18n-aria="ステータスを見る"><span>Lv.<b id="lv" class="num">1</b></span><div class="bar"><i id="xp"></i></div><span class="nx" id="xpv"></span></div>
  <div class="perkline" id="mealline"></div>
  <div class="perkline" id="evline"></div>
</header>

<nav role="tablist">
  <button role="tab" data-tab="fish" aria-selected="true" data-i18n>釣り</button>
  <button role="tab" data-tab="sell" aria-selected="false">市場</button>
  <button role="tab" data-tab="town" aria-selected="false">街</button>
  <button role="tab" data-tab="home" aria-selected="false" data-i18n>自宅・設備</button>
  <button role="tab" data-tab="stat" aria-selected="false">ステータス</button>
  <button role="tab" data-tab="dex" aria-selected="false" data-i18n>図鑑</button>
  <button role="tab" data-tab="set" aria-selected="false">設定</button>
</nav>
<div id="tut" hidden></div>

<section id="p-fish">
  <div class="stage"><canvas id="cv" width="480" height="250"></canvas><div id="banner"><b></b><span></span></div></div>
  <div id="msg" aria-live="polite"></div>
  <div class="meters">
    <div class="meter"><span data-i18n>テンション</span><div class="bar"><i id="tens"></i></div></div>
    <div class="meter"><span data-i18n>寄せ具合</span><div class="bar"><i id="prog"></i></div></div>
  </div>
  <button id="act" data-i18n>投げる</button>
  <div id="nextgoals" class="goals"></div>
  <div class="row" id="areas"></div>
  <p class="hint" id="hint"></p>
  <div class="row"><span class="chip"><i data-i18n>魚箱</i> <b id="cap" class="num"></b></span><button class="ghost" id="home" data-i18n>今日は帰港する</button></div>
  <div class="row"><button class="ghost" id="auto1" data-i18n>おまかせ釣り 5回</button><button class="ghost" id="autoAll" data-i18n>残りぜんぶおまかせ</button><span class="chip"><i data-i18n>切符</i> <b id="tkn" class="num">0</b><i data-i18n>枚</i></span></div>
</section>

<section id="p-sell" hidden></section>
<section id="p-town" hidden></section>
<section id="p-home" hidden><canvas id="hv" width="480" height="340"></canvas><div id="homeUi"></div><div id="p-shop"></div></section>
<section id="p-stat" class="stat" hidden></section>
<section id="p-dex" hidden></section>
<section id="p-set" hidden></section>

<div id="toast" hidden></div>
<div id="veil" hidden><div class="box" id="box"></div></div>
