<link rel="preconnect" href="https://fonts.googleapis.com">

:root{

  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--fs,1))}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-weight:500;font-size:calc(15px*var(--fs,1));line-height:1.5;
  max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
#help{padding:4px 12px;font-size:.85rem}
h1{font-size:1.25rem;font-weight:900;margin:0;letter-spacing:.04em}
h1 small{display:block;font-size:.62rem;font-weight:500;color:var(--sub);letter-spacing:.02em;margin-top:1px}
.hud{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:.9rem}
.hud b{color:var(--fg)}
#money{color:var(--accent);font-size:1.1rem}
.rank{width:100%;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;color:var(--sub);font-size:.8rem}#rank{white-space:nowrap}
.bar{flex:1 1 60px;height:8px;background:var(--panel);border-radius:6px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.9em,1fr));gap:6px;margin:12px 0}
nav button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 0;font-weight:700}
nav button[aria-selected=true]{background:var(--accent);color:#2b1a00;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas{display:block;width:100%;height:auto;border-radius:12px;background:#14506f}
#msg{min-height:3em;margin:10px 0;font-weight:700}
.meters{display:grid;gap:8px;margin-bottom:10px}
.meter{display:grid;grid-template-columns:4.5rem 1fr;gap:10px;align-items:center;font-size:.8rem;color:var(--sub)}
.meter .bar{height:14px}
#tens{background:var(--good);transition:background .1s}
#tens.hot{background:var(--bad)}
#prog{background:var(--accent)}
#act{width:100%;padding:18px;border-radius:14px;border:0;background:var(--accent);color:#2b1a00;font-weight:900;font-size:1.25rem;touch-action:none;user-select:none;-webkit-user-select:none}
#act:active,#act.down{filter:brightness(.9);transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:34px}
.chip[aria-pressed=true]{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--sub)}
h2{font-size:1rem;margin:18px 0 8px;font-weight:900}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border-radius:10px;padding:10px 12px}
.item .t{font-weight:700;min-width:0}.item .s{color:var(--sub);font-size:.8rem;min-width:0}
.buy{background:var(--accent);color:#2b1a00;border:0;border-radius:8px;padding:8px 12px;font-weight:900;grid-row:span 2;font-family:var(--mono)}
.buy:disabled{background:var(--line);color:var(--sub);cursor:default}
.goals{display:grid;gap:6px;margin-top:10px}.goals:empty{display:none}.goals h4{margin:0;font-size:.74rem;color:var(--sub);font-weight:700;letter-spacing:.06em}
.goal{display:grid;grid-template-columns:1.6rem 1fr;gap:0 6px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;width:100%;color:var(--fg)}.goal.now{border-color:var(--accent)}.goal .gi{font-size:1.1rem;grid-row:span 2}.goal .gp{grid-column:2;height:4px;margin-top:5px;background:var(--panel2);border-radius:3px;overflow:hidden}.goal .gp i{display:block;height:100%;background:var(--accent)}
.up{color:var(--good)}.down{color:var(--bad)}
.rbs{display:flex;gap:6px;align-items:flex-end;height:84px}.rb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;font-size:.68rem;color:var(--sub)}
.rbi{width:100%;background:var(--good);border-radius:4px 4px 0 0;position:relative;overflow:hidden;opacity:.9}.rbx{position:absolute;left:0;right:0;bottom:0;background:var(--bad)}
.big{background:var(--accent);color:#2b1a00;border:0;border-radius:10px;padding:10px 14px;font-weight:900;width:100%}
.big:disabled{background:var(--line);color:var(--sub)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.dex .item{grid-template-columns:auto 1fr;text-align:left}
.dex .off{filter:grayscale(1) brightness(.5)}
#veil{position:fixed;inset:0;background:rgba(5,14,22,.82);display:grid;place-items:center;padding:16px;z-index:5}
#veil[hidden]{display:none}
#veil .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
#veil h3{margin:0 0 10px;font-size:1.2rem}
.ln{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
#veil .box{max-height:88vh;overflow:auto}
.stage{position:relative;overflow:hidden;border-radius:12px}
#banner{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0;overflow:hidden}#banner b,#banner span{overflow-wrap:anywhere;padding:0 8px}
#banner.show{animation:pop 2.6s ease-out forwards}
#banner b{display:block;font-size:2.1rem;font-weight:900;letter-spacing:.08em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#banner span{display:block;font-size:1.05rem;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.8)}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.tag{font-size:.68rem;font-weight:900;border-radius:5px;padding:1px 6px;margin-left:6px;color:#1b1030;vertical-align:middle;white-space:nowrap}
.perkline{width:100%;font-size:.78rem;color:var(--sub)}
.rank{cursor:pointer}
.hb{display:flex;gap:6px}
img.ic{width:48px;height:27px;object-fit:contain;vertical-align:middle;margin-right:6px}
.dex img.ic{width:56px;height:32px;margin:0;grid-row:span 2}
.dex .off{filter:brightness(0) opacity(.35)}
.hint{background:var(--panel);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:12px 0 0;font-size:.85rem;color:var(--sub)}
.hint b{color:var(--fg)}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#2b1a00;font-weight:900;padding:12px 18px;border-radius:12px;z-index:9;max-width:min(92vw,420px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast[hidden]{display:none}
.help p{margin:0 0 10px}
.help ol{margin:0 0 10px;padding-left:1.3em}
.help li{margin-bottom:4px}
.help .k{background:var(--panel2);border-radius:6px;padding:1px 7px;font-weight:900;white-space:nowrap}
.dots{color:var(--sub);text-align:center;margin:10px 0 0;font-size:.8rem}
.rank .nx{font-size:.78rem}
nav button{position:relative;font-size:.82rem;padding-inline:2px}
nav .dot{position:absolute;top:-6px;right:-3px;background:var(--bad);color:#fff;font-style:normal;font-size:.65rem;font-weight:900;border-radius:999px;min-width:18px;padding:1px 4px;line-height:1.3}
.lvrow{width:100%;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;color:var(--sub);font-size:.8rem;cursor:pointer}
.lvrow b{color:var(--fg)}
.lvrow .bar>i{background:var(--good)}
.lvrow .nx{font-size:.78rem}
#hv{margin-bottom:10px}
.stars{color:var(--accent);letter-spacing:.05em}
.stat .item{grid-template-columns:1fr auto}
.plus{background:var(--accent);color:#2b1a00;border:0;border-radius:8px;width:44px;height:44px;font-weight:900;font-size:1.3rem;grid-row:span 3}
.plus:disabled{background:var(--line);color:var(--sub);cursor:default}
.item .chip{grid-row:span 2}
textarea{width:100%;min-height:76px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:var(--mono);font-size:.75rem;resize:vertical}
.card{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px}
.card .big{margin-top:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.9rem}
.kv span:nth-child(odd){color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}#banner.show{animation:none;opacity:1}}
</style>

/* ---------- price ---------- */
const sizeRatio=(sp,sz)=>clamp((sz-sp.min)/(sp.max-sp.min),0,1);
const sizeMul=(sp,sz)=>{const r=sizeRatio(sp,sz);return .7+.8*r+(r>=.9?.2:0)};
function price(fi,sat){
  const sp=SP.find(s=>s.n===fi.n);
  const big=sizeMul(sp,fi.size),sv=sat===undefined?(G.sat[fi.n]||0):sat;
  return Math.round(fi.size*sp.p*G.mult[fi.n]*(1-sv)*(fi.fresh/100)*(inSeason(sp)?SEA_PRICE:1)*(1+.06*brLv(sp.a))*(1+.05*Math.min(8,G.lv.mkt)+.025*Math.max(0,G.lv.mkt-8)+perks().sell/100+salesBonus()+.03*techLv('dist')+Math.min(.3,.003*sx('biz'))+(G.comp[sp.a]?.05:0)+mealFx('sell')+evSell()+(petFx().sell||0))*big);
}
// 経営：需給（同じ魚を売るほど値崩れ）と、出荷先（卸売市場／直売所）、収支の記録
const SAT_STEP=.03,SAT_MAX=.4,STALL_MUL=1.12;
const stallCap=()=>G.lv.mkt>0?3+2*G.lv.mkt:0;
const stallLeft=()=>Math.max(0,stallCap()-G.stall);
function led(k,n){if(n)G.led[k]=(G.led[k]||0)+n}
// 売ったときの内訳を、実際に売らずに試算する。高い魚から順に、直売所の枠→卸売市場へ回す
function quote(idx){
  const sat=Object.assign({},G.sat);let left=stallLeft(),sum=0,stall=0;const rows=[];
  idx.map(i=>({i,f:G.fish[i]})).sort((a,b)=>price(b.f)-price(a.f)).forEach(({i,f})=>{
    const sv=sat[f.n]||0,st=left>0,p=Math.round(price(f,sv)*(st?STALL_MUL:1));
    if(st){left--;stall++}
    sat[f.n]=Math.min(SAT_MAX,sv+SAT_STEP*(st?.5:1));sum+=p;rows.push({i,n:f.n,p,st});
  });
  return{sum,sat,stall,rows};
}

/* ---------- fishing core ---------- */
function pickSpecies(area=G.area,bk=null){
  const list=SP.filter(s=>s.a===area&&!s.boss);
  const bt=G.lv.bait+perks().rare+mealFx('rare')+wxRare()+tideRare()+(petFx().rare||0)+.4*sx('luk');
  const ws=list.map(s=>s.w*(s.w<=12?1+.25*bt:1)*(inSeason(s)?SEA_WEIGHT:1)*(bk&&baitOf(s).k===bk?BAIT_MUL:1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}
  return list[0];
}
function say(t){$('#msg').textContent=t}
function press(){

      S.st='wait';S.t=rnd(1.2,3.5)/(1+.2*G.lv.bait+.03*sx('agi'))*wxWait()*tideWait();say('浮きを見守ろう…');break;
    case'wait':

function release(){S.holding=false}
const bossChance=()=>Math.min(.08,.03*(1+.04*sx('luk')+.1*perks().rare));
function rollFish(){
  const bs=bossOf(G.area);
  const sp=(bs&&G.comp[G.area]&&Math.random()<bossChance())?bs:pickSpecies(G.area,S.bk);
  S.sp=sp;S.size=Math.round(sp.min+(sp.max-sp.min)*Math.pow(Math.random(),Math.max(1.1,1.8-.015*sx('luk'))));S.tier=tier(sp);
}
const newFight=(sp,size)=>({pw:sp.s*(.8+.4*(size-sp.min)/(sp.max-sp.min))*(1+.2*sp.a),prog:sp.boss?25:35,tens:0,struggle:false,flip:1,timer:rnd(.6,1.2)});
function hook(){
  const sp=S.sp;
  S.f=newFight(sp,S.size);
  S.st='fight';S.holding=false;
  say(S.sp.boss?'主がかかった！！ 全力で耐えろ！':S.tier>=1?'ヒット！ これは大物だ…！ 慎重に巻け！':'ヒット！ 巻いて寄せよう。暴れたら離してテンションを逃がす。');

// 釣りの計算本体。ゲームの進行と、診断用の試算の両方から使う。o で装備・ステータスを仮に変えられる。
function fightEnv(o){o=o||{};return{rod:o.rod??G.lv.rod,line:o.line??G.lv.line,pk:perkWithMeal(),eas:G.catches<10?.5:G.catches<30?.75:1,str:o.str??sx('str'),vit:o.vit??sx('vit'),dex:o.dex??sx('dex'),foc:o.foc??sx('foc'),diff:DIFF[G.diff]*evDiff()*wxDiff()*(petFx().diff||1)}}
// 戻り値 0:継続 1:釣れた 2:糸が切れた 3:逃げられた
function stepFight(f,holding,dt,sp,E){
  const pe=f.pw<=3?f.pw:3+(f.pw-3)*.6,bs=sp.boss?sp.a:0,eas=E.eas,pk=E.pk;
  f.timer-=dt;f.flip+=((f.struggle?-1:1)-f.flip)*Math.min(1,dt*9);
  if(f.timer<=0){f.struggle=!f.struggle;f.timer=f.struggle?rnd(.6,1.4)*(1+.08*bs)*(1-Math.min(.35,.012*(E.foc||0))):rnd(.8,1.8)*(sp.boss?Math.max(.4,1-.08*bs):1)}
  if(holding){
    f.prog+=16*(1+.3*E.rod+pk.reel/100)*(1+.04*E.str)*(eas<1?1.25:1)/(.5+.5*pe)*(f.struggle?.3:1)*dt;
    f.tens+=(f.struggle?60:20)*(.6+.4*pe)*eas*(1-pk.tens/100)*(1-Math.min(.6,.025*E.vit))*E.diff/(1+.25*E.line)*dt;
  }else{
    f.tens-=45*(1+.03*E.dex)*dt;
    f.prog-=(f.struggle?10*pe*eas:2*eas)*Math.max(.3,1-.04*E.dex)*dt;
  }
  f.tens=clamp(f.tens,0,100);f.prog=Math.min(f.prog,100);
  return f.tens>=100?2:f.prog<=0?3:f.prog>=100?1:0;
}
function fightStep(dt){
  const f=S.f,r=stepFight(f,S.holding,dt,S.sp,fightEnv());
  if(r===2){S.ok=false;say('糸が切れた…！');end(false);if(S.sp.boss)showBossAdvice(S.sp.a,2)}
  else if(r===3){S.ok=false;say(`${S.sp.n}に逃げられた…`);end(false);if(S.sp.boss)showBossAdvice(S.sp.a,3)}
  else if(r===1){landed()}
  else if(f.struggle)say(S.holding?'暴れてる！ 離して！':'暴れてる…耐えろ');
  else say(S.holding?'今だ、巻け！':'落ち着いた。巻こう！');
}
// 「平均的な操作（反応が少し遅く、ときどきミスする）」で何割釣れるかを試算する
function botFight(f,sp,E){
  const hist=[];let t=0,lapse=0,res=0;
  while(!res&&t<90){
    hist.push(f.struggle);const seen=hist.length>27?hist[hist.length-28]:false;
    let hold=!seen&&f.tens<58;
    if(lapse>0){lapse--;hold=!hold}else if(Math.random()<.012)lapse=14;
    res=stepFight(f,hold,1/60,sp,E);t+=1/60;
  }
  return res;
}
function simBoss(sp,E,n){
  let ok=0;
  for(let i=0;i<n;i++){
    const size=Math.round(sp.min+(sp.max-sp.min)*Math.pow(Math.random(),Math.max(1.1,1.8-.015*sx('luk'))));
    if(botFight(newFight(sp,size),sp,E)===1)ok++;
  }
  return ok/n;
}

const trophyBonus=()=>[0,.1,.2,.35,.45,.55][G.fac.trophy];
function expGain(sp,size,newSp){
  const r=sizeRatio(sp,size),tb=1+trophyBonus()+mealFx('exp')+evExp()+(petFx().exp||0);
  let e=Math.round(((8+sp.s*7+tier(sp)*20+(newSp?25:0))*(.6+.9*r)+(r>=.9?10:0))*tb);
  if(sp.boss)e+=Math.round((expNeed(Math.min(G.level,BAL.bossLvCap))*(1+.3*sp.a)+e*4)*tb);
  return Math.max(1,Math.round(e*BAL.expMul*(1+BAL.expEarly*Math.max(0,1-G.level/15))));   // 序盤（Lv15まで）は経験値を多めに
}
function growRoll(){const r=Math.random();return r<.4?0:r<.85?1:r<.98?2:3}   // 8つのステータスで、1レベルあたり合計6前後
function addExp(n){
  G.exp+=n;let up=0;const tot={};ST.forEach(s=>tot[s.k]=0);
  while(G.exp>=expNeed(G.level)&&G.level<99){
    G.exp-=expNeed(G.level);G.level++;up++;
    const g={};let sum=0;ST.forEach(s=>{g[s.k]=growRoll();sum+=g[s.k]});
    while(sum<3){g[ST[Math.random()*ST.length|0].k]++;sum++}
    ST.forEach(s=>{G.stat[s.k]+=g[s.k];tot[s.k]+=g[s.k]});G.bp+=3;
  }
  if(G.level>=99)G.exp=0;   // レベル上限では、経験値をためない
  if(up){
    const txt=ST.filter(s=>tot[s.k]).map(s=>`${s.n}+${tot[s.k]}`).join(' ');
    G.lastUp=`Lv.${G.level}　${txt}`;

function syncCrew(init){while(CREW.length<G.crew)CREW.push({i:CREW.length,pop:init?1:0,q:[],ev:null});CREW.length=G.crew}
function crewVal(sp,m){return Math.round(AREAS[G.boat].base/9*(avgP(sp)/AVG[G.boat])*rnd(.7,1.3)*fishMul(m)*evCrew())}
// 演出は1人あたり「いま1匹＋次の1匹」まで。それを超える分は、演出なしで水揚げだけ入れる（釣りをやめた後も、ポップが出続けないように）
function crewRound(){CREW.forEach((cr,i)=>{const m=CR()[i];if(m&&m.r===0&&Math.random()<.5){const sp=pickSpecies(G.boat),e={delay:rnd(.1,2.2),t:0,sp,val:crewVal(sp,m)};
  if(cr.q.length>=1){e.paid=1;G.money+=e.val;G.crewToday+=e.val;led('crew',e.val);earn(e.val)}else cr.q.push(e)}})}
function payCrew(e){if(e.paid)return;e.paid=1;G.money+=e.val;G.crewToday+=e.val;led('crew',e.val);earn(e.val);save();hud();renderAll()}
function flushCrew(){CREW.forEach(cr=>{if(cr.ev)payCrew(cr.ev);cr.q.forEach(payCrew);cr.ev=null;cr.q=[]})}
function crewSim(n){let sum=0;for(let k=0;k<n;k++)CR().forEach(m=>{if(m.r===0&&Math.random()<.5)sum+=crewVal(pickSpecies(G.boat),m)});if(sum){G.money+=sum;G.crewToday+=sum;led('crew',sum);earn(sum)}}
function crewStep(dt){
  CREW.forEach(cr=>{
    if(cr.pop<1)cr.pop=Math.min(1,cr.pop+dt/.6);
    if(!cr.ev&&cr.q.length)cr.ev=cr.q.shift();
    const e=cr.ev;if(!e)return;
    if(e.delay>0){e.delay-=dt;return}
    e.t+=dt;if(!e.paid&&e.t>=1.2)payCrew(e);if(e.t>=2.4)cr.ev=null;
  });
}

  const area=AREAS[G.boat];
  flushCrew();
  const haul=G.crewToday;G.crewToday=0;G.home=1;

  SP.forEach(s=>{G.prev[s.n]=G.mult[s.n];G.mult[s.n]=clamp(G.mult[s.n]+rnd(-.15,.15)+(1-G.mult[s.n])*.2,.6,1.6)});
  const hot=NORM.slice().sort((a,b)=>(G.mult[b.n]/G.prev[b.n])-(G.mult[a.n]/G.prev[a.n]))[0];
  if(feat('tour'))rvStep();const tr=tourSettle(),rs=isTourDay()?rvSettle():null;
  $('#box').innerHTML=`<h3>${G.day}日目 終了</h3>
    ${pnlHtml(G.led,`従業員の水揚げ（${G.crew}人）`)}${rs?`<div class="card" style="margin:0 0 8px;padding:8px 10px"><b style="font-size:.85rem">📊 週間売上ランキング：${rs.place+1}位／6人</b><div style="font-size:.8rem;margin:2px 0">${rs.bp?`BP+${rs.bp}・評判+${rs.rp}${rs.place===0?'・おまかせ釣り券×2':''}`:'入賞ならず'}</div><div class="kv" style="font-size:.78rem">${rs.all.map((x,i)=>`<span style="${x.me?'color:var(--accent);font-weight:700':''}">${i+1}. ${x.n}</span><b class="num">${yen(x.s)}</b>`).join('')}</div></div>`:''}${tr?`<div class="card" style="margin:0 0 8px;padding:8px 10px"><b style="font-size:.85rem">🏆 釣り大会の結果：${tr.place+1}位／6人</b><div style="font-size:.8rem;margin:2px 0">${tr.best?`あなたのベスト：${tr.bn}（${yen(tr.best)}）`:'魚を釣れませんでした…'}　${tr.prize?`賞金 +${yen(tr.prize)}`:'賞金なし'}${tr.place===0?'・おまかせ釣り券×2':''}</div><div class="kv" style="font-size:.78rem">${tr.all.map((x,i)=>`<span style="${x.me?'color:var(--accent);font-weight:700':''}">${i+1}. ${x.n}</span><b class="num">${yen(x.s)}</b>`).join('')}</div></div>`:''}${ups.map(u=>`<div class="ln"><span>🎉 ${u}</span></div>`).join('')}${fixNote?`<div class="ln"><span>${fixNote}</span></div>`:''}${G.debt?`<div class="ln"><span>借入残高</span><b class="num down">${yen(G.debt)}</b></div>`:''}${ev()?`<div class="ln"><span>今日のできごと</span><b>${ev().e} ${ev().n}</b></div>`:''}
    <div class="ln"><span>傷んで捨てた魚</span><b class="num">${spoiled}匹</b></div>${keep.size?`<div class="ln"><span>生け簀で守った魚</span><b class="num">${keep.size}匹</b></div>`:''}

  $('#veil').hidden=false;
  $('#nextday').onclick=()=>{S.st='idle';$('#veil').hidden=true;say('夜です。自宅で休もう。');save();hud();renderAll();label();openTab('home')};
  save();hud();
}
function sleep(){
  if(!G.home)return;   // 夜でないときは、日付を進めない
  G.cr.forEach(m=>{if(m.nr!==undefined){m.r=m.nr;delete m.nr}});   // 役割の変更は、朝から有効
  G.hist.push(Object.assign({d:G.day},G.led));if(G.hist.length>30)G.hist.shift();G.led={};
  G.day++;G.min=360;G.home=0;S.st='idle';rollEvent();finishProc();growFarm();if(isTourDay())setTimeout(()=>toast(`🏆 今日は釣り大会！ 街タブから参加できます（参加費${yen(tourFee())}）`),3600);const no=G.ord.length;if(feat('orders'))refreshOrders();if(G.ord.length>no)setTimeout(()=>toast('新しい注文が届いています（市場タブ）'),1800);save();hud();renderAll();label();
  say('新しい朝。今日も釣りに出よう。');openTab('fish');toast(`${G.day}日目の朝`);
  if(Cloud.kind==='app'&&Cloud.status==='signedout'&&G.day>=2&&!G.nudged){G.nudged=1;save();setTimeout(showNudge,1500)}
}

/* ---------- fish art ---------- */
function drawFish(c,x,y,L,d){
  const [body,belly,shape,pat,pc,ex]=d,rx=L/2,ry=L/2*{a:.26,b:.34,r:.5,f:.55,l:.13,t:.3}[shape];
  c.save();c.translate(x,y);
  c.fillStyle=body;
  c.beginPath();c.moveTo(rx*.8,0);c.lineTo(rx*1.3,-ry*1.2-1);c.lineTo(rx*1.1,0);c.lineTo(rx*1.3,ry*1.2+1);c.closePath();c.fill();
  if(ex==='ribbon'){c.fillStyle=pc;c.fillRect(-rx*.7,-ry*2.6,rx*1.7,ry*1.8)}
  else{c.beginPath();c.moveTo(-rx*.25,-ry*.85);c.quadraticCurveTo(rx*.1,-ry*1.8,rx*.5,-ry*.8);c.closePath();c.fill()}
  if(ex==='bill'){c.beginPath();c.moveTo(-rx*.85,-ry*.2);c.lineTo(-rx*1.55,0);c.lineTo(-rx*.85,ry*.2);c.closePath();c.fill()}
  const g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,body);g.addColorStop(.55,body);g.addColorStop(1,belly);
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);c.fill();
  c.save();c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);c.clip();c.fillStyle=c.strokeStyle=pc||body;
  if(pat==='s')for(let i=-1;i<=3;i++)c.fillRect(rx*(-.25+i*.22),-ry,rx*.08,ry*2);
  else if(pat==='h')c.fillRect(-rx,-ry*.12,rx*2,Math.max(1.5,ry*.2));
  else if(pat==='w'){c.lineWidth=Math.max(1,ry*.14);for(let i=0;i<6;i++){c.beginPath();c.moveTo(-rx*.4+i*rx*.18,-ry);c.lineTo(-rx*.32+i*rx*.18,-ry*.2);c.lineTo(-rx*.4+i*rx*.18,ry*.1);c.stroke()}}
  else if(pat==='p')for(let i=0;i<10;i++){c.beginPath();c.arc(Math.sin(i*2.3)*rx*.65,Math.cos(i*3.1)*ry*.6,Math.max(1,ry*.11),0,7);c.fill()}
  c.restore();
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(-rx*.1,ry*.25,rx*.18,ry*.14,.5,0,7);c.fill();
  const er=Math.max(2,ry*(ex==='bigeye'?.36:.22));
  c.fillStyle='#fff';c.beginPath();c.arc(-rx*.6,-ry*.15,er,0,7);c.fill();
  c.fillStyle='#111';c.beginPath();c.arc(-rx*.62,-ry*.15,er*.55,0,7);c.fill();
  c.restore();
}
function drawSp(c,sp,x,y,L){
  if(sp.d){drawFish(c,x,y,L,sp.d);return}
  c.save();c.font=`${L*.85}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(sp.e,x,y);c.restore();
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 同期の目印：進み具合が変わると変わる文字列。「前回の同期から、この端末が変わったか」を調べるのに使う
const sig=o=>[o.earned,o.catches,o.day,o.min,o.level,o.exp,o.money].join('|');
const docHas=d=>!!d&&((d.day||1)>1||(d.lv||1)>1||(d.earned||0)>0);
// クラウドのデータ a と、この端末のデータ b の、進み具合を比べる（a が進んでいれば正、遅れていれば負）
function cmpProg(a,b){
  if(a.earned!==undefined&&a.earned!==b.earned)return a.earned>b.earned?1:-1;
  const al=a.lv||1,bl=b.level||1;if(al!==bl)return al>bl?1:-1;
  const ad=a.day||1,bd=b.day||1;if(ad!==bd)return ad>bd?1:-1;
  return 0;
}
// 上書きされるデータを、1つだけ端末の中に控える（何も進んでいないデータは控えない）
const BKEY='umikaze-fishery-backup';
const hasProgressOf=o=>(o.catches||0)>0||(o.day||1)>1||(o.earned||0)>0;
function makeBackup(o,from,reason){
  try{if(!o||!hasProgressOf(o))return;localStorage.setItem(BKEY,JSON.stringify({at:Date.now(),from,reason,json:JSON.stringify(o),lv:o.level,day:o.day,money:o.money}))}catch(e){}
}
function getBackup(){try{return JSON.parse(localStorage.getItem(BKEY))}catch(e){return null}}
async function cloudPush(force){
  if(!Cloud.db||Cloud.busy)return false;
  if(!force&&!Cloud.dirty)return true;
  Cloud.busy=true;let ok=false,redo=false;
  try{
    // 自動の保存では、書き込む前に「他の端末が先に進めていないか」を確かめる（上書きで進み具合を失わないため）
    if(!force){
      const d=await Remote.get();
      if(d&&docHas(d)&&d.savedAt!==G.syncAt&&d.sig!==sig(G)&&!(d.dev===Cloud.dev&&!G.syncAt))redo=true;
    }
    if(!redo){
      const s=sig(G),at=Date.now();
      await Remote.put({json:JSON.stringify(G),savedAt:at,dev:Cloud.dev,v:1,lv:G.level,day:G.day,money:G.money,earned:G.earned,sig:s});
      G.syncAt=at;G.syncSig=s;try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}
      Cloud.dirty=false;Cloud.lastPush=at;Cloud.status='ready';Cloud.err='';ok=true;
    }
  }catch(e){Cloud.status='error';Cloud.err=(e&&e.code)||''}
  Cloud.busy=false;renderCloudCard();
  if(redo){try{await cloudDecide()}catch(e){}}
  return ok;
}
// ゲームを保存するたびに呼ばれる。15秒に1回までまとめて送る
function cloudDirty(){

    if(!Cloud.db||!hasProgress()||G.syncSig===sig(G))return;
    Cloud.dirty=true;
    if(!Cloud.timer)Cloud.timer=setTimeout(()=>{Cloud.timer=0;cloudPush(false)},15000);
  }catch(e){}
}

function settleNight(){if(!G.home&&G.min>=DAY_END){S.st='result';dayEnd()}}
function applySave(o,reason,syncAt){

  G=o;if(syncAt){G.syncAt=syncAt;G.syncSig=sig(G)}
  S.st='idle';CREW.length=0;syncCrew(true);applyUi();save();label();say('');renderAll();
  settleNight();

// クラウドと端末を比べて、読み込む・保存する・聞く、のどれかを行う（起動時・ログイン直後・画面に戻ったとき）
// 戻り値: 'none'(クラウドにデータなし) 'synced'(同じ) 'loaded'(読み込んだ) 'pushed'(保存した) 'asked'(確認を出した) 'error'
async function cloudDecide(){
  const d=await Remote.get();
  Cloud.status='ready';
  if(!docHas(d)){if(hasProgress()){await cloudPush(true);return 'pushed'}return 'none'}
  Cloud.lastPush=d.savedAt;
  const mine=sig(G);
  if(!G.syncAt&&d.dev===Cloud.dev)G.syncAt=d.savedAt;   // 前の版で、この端末が保存したもの
  if(d.sig===mine){G.syncAt=d.savedAt;G.syncSig=mine;return 'synced'}
  if(!hasProgress())return autoLoad(d)?'loaded':'error';  // 新しい端末：確認なしで読み込む
  const changed=d.savedAt!==G.syncAt,dirty=G.syncSig!==mine,c=cmpProg(d,G);
  if(!changed){if(dirty){await cloudPush(true);return 'pushed'}return 'synced'}
  if(!dirty&&c>=0)return autoLoad(d)?'loaded':'error';  // この端末は変えていない＋クラウドが進んでいる：確認なしで読み込む
  if(dirty&&c<0){await cloudPush(true);return 'pushed'}  // この端末のほうが進んでいる：保存する
  askRestore(d,'conflict');return 'asked';                // 進みが逆転している・両方が進んでいる：聞く
}

// Googleログイン（ストア版）。戻り値: 'asked'=引き継ぎ確認を出した / 'none'=クラウドにデータなし / 'cancel' / 'error'
async function loginGoogle(){

const CODE_CH='23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function newCode(){const a=new Uint32Array(8);crypto.getRandomValues(a);let c='';a.forEach(v=>c+=CODE_CH[v%CODE_CH.length]);return c.slice(0,4)+'-'+c.slice(4)}
async function issueCode(){

  const r=dailyReward();G.dailyNo=dayNo();G.streak=r.streak;G.tk.auto+=r.auto;G.tk.meal+=r.meal;
  save();hud();renderAll();toast(`デイリーボーナス！ おまかせ釣り券×${r.auto}・食事券×${r.meal}`);sfx(2);
}
function buyTk(kind,n){
  const c=(kind==='auto'?autoCost():mealTkCost())*n;
  if(G.money<c){toast('お金が足りません');return}
  G.money-=c;led('tk',c);G.tk[kind]+=n;save();hud();renderAll();
}
// おまかせ釣り：券1枚で5回ぶん、釣りを自動で進める。釣れるかどうかは自分のステータスで決まる（主は出ない）
function autoFish(maxTickets){
  if(veilOpen())return;
  if(G.home){toast('夜です。自宅で休もう');return}
  if(S.st!=='idle'){toast('釣りの合間に使ってね');return}
  const left=Math.floor((DAY_END-G.min)/ATTEMPT_MIN);
  if(left<=0){toast('今日はもう釣りに出られません');return}
  if(G.tk.auto<1){toast('おまかせ釣り券がありません。街で買うか、デイリーボーナスで受け取ろう');openTab('town');return}
  if(G.fish.length>=cap()&&!G.autoSell){toast('魚箱がいっぱい。市場で売るか、設定で自動売却をONにしよう');return}
  const n=Math.min(left,Math.min(maxTickets,G.tk.auto,Math.ceil(left/5))*5);
  const got=[],cr0=G.crewToday,m0=G.min,lv0=G.level;
  let lost=0,exp=0,casts=0,sold=0,stop='';
  for(let i=0;i<n;i++){
    if(G.fish.length>=cap()){
      if(G.autoSell&&G.fish.length)sold+=sellCore(G.fish.map((_,i)=>i))
      else{stop='魚箱がいっぱいになったので中断しました。';break}
    }
    const sp=pickSpecies(),size=Math.round(sp.min+(sp.max-sp.min)*Math.pow(Math.random(),Math.max(1.1,1.8-.015*sx('luk'))));
    const res=botFight(newFight(sp,size),sp,fightEnv());   // 食事効果が切れたら、その回から反映する
    casts++;G.min+=ATTEMPT_MIN;
    if(res===1){
      const isNew=!G.dex[sp.n];exp+=expGain(sp,size,isNew);
      const d=G.dex[sp.n]||(G.dex[sp.n]={c:0,best:0,min:9999});d.c++;d.best=Math.max(d.best,size);d.min=Math.min(d.min,size);
      G.fish.push({n:sp.n,size,fresh:100});G.catches++;dcAdd('catch',1);if(tier(sp)>=1)dcAdd('rare',1);got.push({sp,size,isNew});
    }else lost++;
    useMeal();
  }
  const used=Math.ceil(casts/5);G.tk.auto-=used;
  if(casts)crewSim(casts);
  const crewGain=G.crewToday-cr0;
  if(exp)addExp(exp);
  new Set(got.map(g=>g.sp.a)).forEach(a=>checkComplete(a));
  save();hud();renderAll();
  const agg={};got.forEach(g=>{const o=agg[g.sp.n]||(agg[g.sp.n]={sp:g.sp,c:0,best:0,isNew:false});o.c++;o.best=Math.max(o.best,g.size);if(g.isNew)o.isNew=true});
  const total=got.reduce((s,g)=>s+price({n:g.sp.n,size:g.size,fresh:100}),0);
  const rows=Object.values(agg).sort((a,b)=>tier(b.sp)-tier(a.sp)||b.c-a.c).map(o=>`<div class="ln"><span>${ico(o.sp)}${o.sp.n}${tag(o.sp)}${o.isNew?' <span class="tag" style="background:var(--good)">新種</span>':''}</span><b class="num">×${o.c}　<span class="stars">${stars(o.sp,o.best)}</span></b></div>`).join('');
  const night=G.min>=DAY_END;
  $('#box').innerHTML=`<h3>おまかせ釣り 結果</h3>
    <div class="card" style="margin:0 0 10px"><div class="kv"><span>釣りに出た回数</span><b class="num">${casts}回（${Math.round(casts*ATTEMPT_MIN/60*10)/10}時間）</b><span>釣れた／逃げられた</span><b class="num">${got.length}匹／${lost}回</b><span>魚の価値の合計</span><b class="num">${yen(total)}</b>${sold?`<span>自動売却</span><b class="num up">+${yen(sold)}</b>`:''}${crewGain?`<span>従業員の水揚げ</span><b class="num up">+${yen(crewGain)}</b>`:''}<span>経験値</span><b class="num">+${exp}${G.level>lv0?`（Lv.${lv0}→${G.level}）`:''}</b><span>使った切符</span><b class="num">${used}枚（残り${G.tk.auto}枚）</b></div></div>
    ${stop?`<p style="color:var(--bad);margin:0 0 8px">${stop}</p>`:''}${rows||'<p style="color:var(--sub)">今回は1匹も釣れませんでした。</p>'}
    <button class="big" id="autoOk" style="margin-top:12px">${night?'夕方になった。一日を終える':'閉じる'}</button>`;
  $('#veil').hidden=false;
  $('#autoOk').onclick=()=>{$('#veil').hidden=true;if(night)dayEnd()};
}
// アプリを閉じている間も、漁師が働いて稼ぐ（最大8時間ぶん）
function offlineGain(){
  const el=Date.now()-(G.lastSeen||Date.now());
  if(!G.crew||el<15*60000)return;
  const hrs=Math.min(8,el/3600000),A=AREAS[G.boat];
  const gain=Math.round(CR().reduce((a,m)=>a+A.base*fishMul(m),0)*hrs/8),wage=Math.round(CR().reduce((a,m)=>a+wageOf(m),0)*hrs/8),pay=Math.min(wage,G.money+gain);
  G.money+=gain-pay;led('crew',gain);led('wage',pay);earn(gain);save();hud();renderAll();
  if(veilOpen()){toast(`留守の間に、従業員が${yen(gain)}を水揚げしました`);return}
  $('#box').innerHTML=`<h3>おかえりなさい</h3><p style="margin:0 0 8px;color:var(--sub)">留守の間も、漁師たちが働いてくれました。</p>
    <div class="card" style="margin:0 0 10px"><div class="kv"><span>留守にしていた時間</span><b class="num">${Math.floor(Math.round(hrs*60)/60)}時間${Math.round(hrs*60)%60}分${el>8*3600000?'（上限8時間）':''}</b><span>水揚げ（${G.crew}人）</span><b class="num up">+${yen(gain)}</b><span>給料</span><b class="num down">-${yen(pay)}</b></div></div>
    <button class="big" id="offOk">受け取る</button>`;
  $('#veil').hidden=false;$('#offOk').onclick=()=>$('#veil').hidden=true;
}

function renderStat(){
  const need=expNeed(G.level);
  const rows=ST.map(s=>{
    const v=G.stat[s.k],a=G.alloc[s.k];
    return `<div class="item"><div class="t">${s.n} <span class="num" style="color:var(--accent)">${v}</span> <span class="num" style="color:var(--sub);font-size:.75rem">（自動${v-1-a}＋振り分け${a}）</span></div>
      <button class="plus" data-st="${s.k}" ${G.bp<1?'disabled':''} aria-label="${s.n}を上げる">＋</button>
      <div class="s">${s.d}</div><div class="s" style="color:var(--good)">いまの効果：${s.fx(v-1)}</div></div>`}).join('');
  $('#p-stat').innerHTML=`<div class="card"><div class="kv"><span>レベル</span><b class="num">Lv.${G.level}</b><span>経験値</span><b class="num">${G.exp} / ${need}</b><span>ボーナスポイント（BP）</span><b class="num" style="color:var(--accent)">${G.bp}</b></div>
    <div class="bar" style="margin-top:8px"><i style="background:var(--good);width:${Math.min(100,G.exp/need*100)}%"></i></div>
    <p style="color:var(--sub);font-size:.8rem;margin:8px 0 0">魚を釣ると経験値がもらえます。レベルが上がると、各ステータスが<b>ランダムに0〜3</b>上がり、<b>BPが3</b>もらえます。BPは好きなステータスに振り分けられます。</p>${G.lastUp?`<p style="color:var(--good);font-size:.8rem;margin:6px 0 0">前回のレベルアップ：${G.lastUp}</p>`:''}</div>
    <div class="list">${rows}</div>
    <div class="row"><button class="ghost" id="stReset" ${Object.values(G.alloc).some(v=>v)?'':'disabled'}>BPを振り直す（無料）</button></div>
    <h2>主への挑戦目安</h2><p style="color:var(--sub);font-size:.8rem;margin:0 0 8px">強い主に、どのステータスがどのくらい必要かを診断します。主に逃げられたときも自動で表示されます。</p>
    <div class="list">${AREAS.map((a,i)=>i<=G.boat?`<div class="item"><div class="t">${bossOf(i).n}</div><button class="buy" data-adv="${i}" style="font-family:inherit">診断</button><div class="s">${a.name}・${G.bossGot[i]?'討伐済み':G.comp[i]?'出現中':'エリアをコンプすると出現'}</div></div>`:'').join('')}</div>`;
  $('#p-stat').querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>showBossAdvice(+b.dataset.adv,0));
  $('#p-stat').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{if(G.bp>0){G.bp--;G.stat[b.dataset.st]++;G.alloc[b.dataset.st]++;save();hud();renderStat()}});
  $('#stReset').onclick=()=>{let n=0;for(const k in G.alloc){G.stat[k]-=G.alloc[k];n+=G.alloc[k];G.alloc[k]=0}G.bp+=n;save();hud();renderStat();toast(`BPを${n}ポイント戻しました`)};

function bindCloud(){

  on('cloudLoad',async()=>{if(!Cloud.db){toast('クラウド保存を使えません');return}try{const d=await Remote.get();if(!d){toast('クラウドにデータがありません');return}askRestore(d,'manual')}catch(e){toast('読み込めませんでした')}});

 {t:'実績',k:'ach',b:'<p><span class="k">図鑑</span>タブの下に<b>実績</b>の一覧があります。条件を満たすと自動で解除され、<b>BP・おまかせ釣り券・食事券</b>がもらえます。</p>'},
 {t:'注文',k:'orders',b:'<p><span class="k">市場</span>タブに、常連さんからの<b>注文</b>が毎朝届きます（最大3件・期限は2日）。</p><ol><li>「アジ×3匹・25cm以上・鮮度70%以上」のように条件があります</li><li>魚箱に条件に合う魚がそろったら<b>納品</b>。<b>売値の1.3倍〜</b>で買い取ってもらえます（評判が上がると倍率が増える）</li><li>納品・大会の入賞・主の討伐で<b>評判</b>が上がります。評判が高いと、注文の報酬・注文の件数・融資の上限が増えます</li><li>注文に使える魚は、「すべて売る」では売らずに残します</li><li>鮮度は一晩で落ちます。生け簀があると守れます</li></ol>'},
 {t:'保険と故障',k:'bank',b:'<p>朝に、ときどき<b>船が故障</b>します（約20日に1回）。夜に<b>修理費</b>（船の値段の3%）がかかります。</p><p><span class="k">街</span>タブの<b>船の保険</b>に入ると、修理費が無料になります。保険料は毎晩、船の値段の0.2%です。</p>'},
 {t:'銀行と船の維持費',k:'bank',b:'<p><span class="k">街</span>タブの<b>銀行</b>でお金を借りられます。船や設備を早く買って稼ぎを増やす近道ですが、<b>利息</b>が毎晩かかります（残高の0.8%）。返せるときに返しましょう。借りられる額は、これまでの売上に応じて増えます。</p><p>船には毎晩<b>維持費</b>がかかります（船の値段の0.4%）。</p>'},
 {t:'毎朝のできごと',k:'events',b:'<p>朝、ときどき<b>できごと</b>が起きます：豊漁（水揚げ増）・不漁・荒天（釣りは難しいが売値が上がる）・観光フェア（売値アップ）・大量入荷（売値ダウン）。画面の上に今日のできごとが出ます。</p>'},
 {t:'従業員を育てる',k:'roles',b:'<p><span class="k">自宅・設備</span>タブで従業員を雇えます。1人ずつ名前と役割があります。</p><ol><li><b>釣り師</b>：いっしょに釣りに出て、毎日お金を水揚げする</li><li><b>営業</b>：水揚げはしないが、魚の売値を底上げする（全員で+15%まで）</li><li>役割は、名前の横のボタンで切り替えられる（変更は<b>あしたの朝</b>から）</li><li>働いた日数でレベルが上がる。水揚げも売値ボーナスも増えるが、<b>給料も上がる</b></li><li>一人ひとりに<b>特性</b>があります。気に入らなければ「辞めてもらう」で入れ替えられます</li></ol><p>序盤は釣り師が得、お金がたまってきたら営業を混ぜると売上が伸びます。夜の収支や、市場タブの経営レポートで、人件費の重さを確認しよう。</p>'},
 {t:'設備を強化する',b:'<p><span class="k">自宅・設備</span>タブでお金を使って強化できます。</p><ol><li><b>釣り竿</b>：巻き上げが速くなる</li><li><b>釣り糸</b>：テンションが上がりにくい</li><li><b>エサ</b>：アタリが早く、珍しい魚が寄る</li><li><b>クーラーボックス</b>：魚箱が広がり、鮮度も保てる</li><li><b>漁師を雇う</b>：釣り場でいっしょに釣って稼いでくれる（給料もかかる）</li></ol>'},
 {t:'新しい海域へ',b:'<ol><li><span class="k">自宅・設備</span>タブの「船」で次の船を買うと、新しい海域に出られます</li><li>小型ボート（'+yen(BOATS[0].c)+'）で沖合、大型漁船（'+yen(BOATS[1].c)+'）で深海</li><li>さらにクルーザーでサンゴ礁の島、砕氷船で氷海、ムーンクラフトで幻の海域、そのさき（海底火山・沈没船の海域・極夜のオーロラ海・竜宮の海）にも、新しい船で行けます</li><li>買ったら<span class="k">釣り</span>タブの海域ボタンで行き先を選ぶ</li></ol><p>先の海域ほど、高く売れる大きな魚がいます。</p>'},
 {t:'レアな魚',b:'<p>海域ごとに、めったに釣れないレアな魚がいます。<span class="tag" style="background:#6cc4ff">レア</span><span class="tag" style="background:#c08cff">超レア</span><span class="tag" style="background:#ffd24a">伝説</span></p><p>レアな魚がかかると、アタリの時点で気配が違います。釣り上げると派手な演出が出ます。図鑑でまだ釣っていない魚を探しましょう。エサの強化やランクの特典で、珍しい魚が寄りやすくなります。</p>'},
 {t:'エリアコンプと主',b:'<p>海域にいる魚を<b>全種類</b>釣ると<b>コンプボーナス</b>がもらえます（祝い金・BP・その海域の魚の売値+5%）。</p><p>コンプすると、その海域に低確率で<b>主</b>が現れます。主はとても強く、先の海域の主ほど手強くなります。アタリの気配が違うので、準備を整えて挑もう。初めて釣り上げると、討伐ボーナスがもらえます。主は売値も経験値も桁違いです。</p><p>主に逃げられると、<b>どのステータスがどのくらい必要か</b>の目安が表示されます（ステータスタブからも診断できます）。</p>'},
 {t:'レベルとステータス',b:'<p>魚を釣ると<b>経験値</b>がもらえ、たまると<b>レベル</b>が上がります（ランクとは別です）。</p><ol><li>レベルが上がると、8つのステータスがランダムに上がる（0〜3ずつ）</li><li>同時に<b>BP</b>が3もらえる</li><li><span class="k">ステータス</span>タブで、BPを好きなステータスに振り分ける</li></ol><p><b>力</b>は巻き上げ、<b>体力</b>はテンション、<b>素早さ</b>はアタリ、<b>器用さ</b>は寄せ戻され、<b>運</b>はレア魚に効きます。</p><p>さらに、<b>集中力</b>は魚の暴れる時間を短くし、<b>商才</b>は売値と給料に、<b>統率力</b>は従業員の水揚げと成長に効きます（8つのステータス）。</p>'},
 {t:'自宅と施設',b:'<p>1日が終わると<b>自宅</b>に帰ります。<span class="k">自宅・設備</span>タブでは、道具・船・漁師・施設が並んでいる様子が見られます。施設や設備もここで買えます。</p><ol><li><b>自宅</b>：大きくすると雇える漁師が増える</li><li><b>生け簀</b>：売れ残りの魚を鮮度そのまま保管</li><li><b>魚拓棚</b>：釣った魚を飾り、経験値ボーナス</li></ol><p>眠ると朝になり、次の日の釣りが始まります。</p>'},
 {t:'忙しい人のための機能',b:'<ol><li><span class="k">街</span>タブの<b>デイリーボーナス</b>で、おまかせ釣り券と食事券が毎日もらえる</li><li><b>おまかせ釣り</b>：券1枚で、5回ぶんの釣りを自動で進める（釣れるかどうかは自分のステータスで決まる）</li><li><b>外食</b>：食堂で食事すると、経験値アップなどの効果が次の12回の釣りの間続く。図鑑に載った魚の種類が増えるほど、<b>メニューが増えて</b>豪華になる</li><li><b>留守中の水揚げ</b>：漁師がいると、アプリを閉じている間もお金を稼いでくれる（最大8時間ぶん）</li><li>設定で<b>自動売却</b>をONにすると、魚箱がいっぱいのときに自動で売る</li></ol>'},
 {t:'1日とランク',b:'<p>釣り1回ごとに40分進み、18時になると1日が終わります。夜は給料を払って自宅に帰り、施設を整えて眠ると朝になります。相場も毎日変わります。</p><p>売上が増えるとランクが上がり、<b>祝い金と特典</b>（売値アップ、魚箱拡大など）がもらえます。画面上部のランクをタップすると一覧が見られます。それでは、いってらっしゃい！</p>'}];
function showHelp(i=0){
  const L=HELP.filter(x=>!x.k||feat(x.k)),h=L[i]||L[0],last=i>=L.length-1;
  $('#box').innerHTML=`<div class="help"><h3>${h.t}</h3>${h.b}<div class="row"><button class="ghost" id="hp" ${i?'':'disabled'}>戻る</button><button class="big" id="hn" style="flex:1;width:auto">${last?'はじめる':'次へ'}</button>${last?'':'<button class="ghost" id="hs">スキップ</button>'}</div><p class="dots">${i+1} / ${L.length}</p></div>`;
  $('#veil').hidden=false;
  $('#hp').onclick=()=>showHelp(i-1);
  const finish=skipped=>{G.seen=1;save();$('#veil').hidden=true;openTab(G.home?'home':'fish');say('「投げる」を押して釣りを始めよう。');if(skipped)toast('遊び方は、右上の「遊び方」か、設定タブで、いつでも見られます')};
  $('#hn').onclick=()=>{if(!last){showHelp(i+1);return}finish(false)};
  const hs=$('#hs');if(hs)hs.onclick=()=>finish(true);
}
$('#help').onclick=()=>{if(S.st==='idle'||S.st==='result')showHelp(0);else toast('釣りの合間に開いてね')};
$('#rankbox').onclick=()=>{if(!veilOpen())showRanks()};
$('#rankbox').onkeydown=e=>{if(e.key==='Enter'&&!veilOpen())showRanks()};
$('#lvrow').onclick=()=>{if(!veilOpen())openTab('stat')};
$('#auto1').onclick=()=>autoFish(1);$('#autoAll').onclick=()=>autoFish(99);
$('#lvrow').onkeydown=e=>{if(e.key==='Enter'&&!veilOpen())openTab('stat')};

act.addEventListener('pointerdown',e=>{e.preventDefault();press()});

addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.tagName!=='BUTTON'&&e.target.id!=='rankbox'&&e.target.id!=='lvrow'&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();press()}});

$('#home').onclick=()=>{if(G.home)return;if(S.st==='idle'||S.st==='result'){if(G.min<DAY_END)crewSim(Math.ceil((DAY_END-G.min)/ATTEMPT_MIN));G.min=DAY_END;S.st='result';S.t=1;dayEnd()}else toast('釣りの合間に帰港できます')};

/* ---------- scene ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');
function person(c,x,y,col,hat,s){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='#2b3a4a';c.fillRect(-3.5,-9,3,9);c.fillRect(.5,-9,3,9);
  c.fillStyle=col;c.fillRect(-5,-24,10,15);
  c.fillStyle='#f1c9a0';c.beginPath();c.arc(0,-29,5,0,7);c.fill();
  c.fillStyle=hat;c.fillRect(-6.5,-33,13,2.5);c.beginPath();c.arc(0,-33,5,Math.PI,0);c.fill();
  c.restore();
}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,col);g.addColorStop(1,col+'00');c.save();c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore()}
function drawCrew(cr,ts){
  const x=crewX(cr.i),e=cr.ev&&cr.ev.delay<=0?cr.ev:null;
  cx.save();cx.globalAlpha=cr.pop;cx.translate(0,-(1-cr.pop)*24);
  person(cx,x,120,COLS[cr.i%10],HATS[cr.i%5],.8);
  const rx=x+24,ry=86,bx=x+30;let by=148+Math.sin(ts/600+cr.i*1.7)*2;
  if(e&&e.t<.5)by+=5;
  cx.strokeStyle='#d9c7a8';cx.lineWidth=2;cx.beginPath();cx.moveTo(x+4,104);cx.lineTo(rx,ry);cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1;cx.beginPath();cx.moveTo(rx,ry);cx.lineTo(bx,by);cx.stroke();
  if(!e||e.t<.3){cx.fillStyle=cr.i%2?'#ff5a4e':'#ffd24a';cx.beginPath();cx.arc(bx,by,3.2,0,7);cx.fill()}
  if(e&&e.t>=.3&&e.t<1.3){const u=(e.t-.3)/1,fx=bx+(x+8-bx)*u,fy=by+(ry-by)*u-Math.sin(u*Math.PI)*22;drawSp(cx,e.sp,fx,fy,24)}
  if(e&&e.t>=1.2){cx.globalAlpha=cr.pop*clamp(1-(e.t-1.2)/1.2,0,1);cx.fillStyle='#ffd24a';cx.font='900 13px sans-serif';cx.textAlign='center';cx.fillText('+'+yen(e.val),x+6,78-(e.t-1.2)*14)}
  cx.restore();
}
const HULLC=['','#3a6f8f','#2b4a63','#2d8f8a','#a33a3a','#5a3f9a','#7a2a1a','#4a4a3a','#2a4a7a','#b04a6a'],TOPC=['','#c9d3d9','#e4e9ec','#f4f4f4','#e8e8ee','#d9c8ff','#ffd0b0','#d8d0b8','#d0e4ff','#fff0c8'],STRIPEC=['','#d9503f','#d9503f','#ffd24a','#ffffff','#ffd0ff','#ff5a2a','#c8a04a','#6ab0ff','#ffd24a'];
function areaDeco(a,ts){
  if(a===2){cx.fillStyle='rgba(0,10,30,.25)';cx.fillRect(0,130,480,120)}
  else if(a===3){
    cx.fillStyle='#2d6a4f';cx.beginPath();cx.ellipse(410,134,70,12,0,Math.PI,0);cx.fill();
    [[392,100,1],[432,106,-1]].forEach(([x,y,d])=>{cx.strokeStyle='#5a4028';cx.lineWidth=3;cx.beginPath();cx.moveTo(x,130);cx.quadraticCurveTo(x+4*d,y+16,x+2*d,y);cx.stroke();
      cx.fillStyle='#3fae6a';for(let k=0;k<5;k++){cx.beginPath();cx.ellipse(x+2*d,y,15,3.5,-1.3+k*.65,0,7);cx.fill()}});
  }else if(a===4){
    [[300,50,34],[390,72,48],[452,40,24]].forEach(([x,w,hh],i)=>{const dx=Math.sin(ts/4000+i)*3;
      cx.fillStyle='rgba(230,243,252,.95)';cx.beginPath();cx.moveTo(x+dx,134);cx.lineTo(x+dx+w*.35,134-hh);cx.lineTo(x+dx+w*.6,134-hh*.55);cx.lineTo(x+dx+w*.78,134-hh*.8);cx.lineTo(x+dx+w,134);cx.closePath();cx.fill();
      cx.fillStyle='rgba(190,220,240,.3)';cx.beginPath();cx.moveTo(x+dx,134);cx.lineTo(x+dx+w,134);cx.lineTo(x+dx+w*.5,134+hh*.5);cx.closePath();cx.fill()});
  }else if(a===5){
    for(let k=0;k<3;k++){cx.strokeStyle=`hsla(${160+k*60},80%,65%,.28)`;cx.lineWidth=10;cx.beginPath();for(let x=0;x<=480;x+=10){const y=30+k*18+Math.sin(x/70+ts/1200+k*2)*10;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
    for(let i=0;i<16;i++){const x=(i*71+ts/40)%480,y=50+(i*37)%70+Math.sin(ts/700+i)*6;cx.fillStyle=`hsla(${260+i*10},80%,78%,${.35+.3*Math.sin(ts/400+i)})`;cx.beginPath();cx.arc(x,y,2+(i%3),0,7);cx.fill()}
  }
}
function areaDeco2(a,ts){
  if(a===6){   // 海底火山：赤い空と、噴煙
    cx.fillStyle='rgba(255,90,30,.22)';cx.fillRect(0,0,480,130);
    cx.fillStyle='#2a1a16';cx.beginPath();cx.moveTo(300,134);cx.lineTo(380,60);cx.lineTo(410,60);cx.lineTo(480,134);cx.closePath();cx.fill();
    cx.fillStyle='#ff6a2a';cx.beginPath();cx.moveTo(380,62);cx.lineTo(410,62);cx.lineTo(396,72);cx.closePath();cx.fill();
    for(let i=0;i<5;i++){const t=(ts/1400+i*.2)%1;cx.fillStyle='rgba(90,70,70,'+(.5*(1-t))+')';cx.beginPath();cx.arc(395+Math.sin(i+t*3)*10,60-t*50,6+t*14,0,7);cx.fill()}
  }else if(a===7){   // 沈没船：海面から突き出た船体とマスト
    cx.fillStyle='#3a2a20';cx.beginPath();cx.moveTo(300,134);cx.lineTo(330,112);cx.lineTo(440,118);cx.lineTo(460,134);cx.closePath();cx.fill();
    cx.strokeStyle='#4a3a2a';cx.lineWidth=3;cx.beginPath();cx.moveTo(372,116);cx.lineTo(366,60);cx.moveTo(366,70);cx.lineTo(400,100);cx.stroke();
    cx.fillStyle='rgba(220,220,230,.35)';cx.beginPath();cx.moveTo(366,70);cx.lineTo(392,92);cx.lineTo(366,96);cx.fill();
  }else if(a===8){   // 極夜：オーロラと星
    for(let k=0;k<3;k++){cx.strokeStyle='hsla('+(130+k*40)+',85%,62%,.3)';cx.lineWidth=12;cx.beginPath();for(let x=0;x<=480;x+=10){const y=26+k*20+Math.sin(x/60+ts/1500+k*2)*12;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
    cx.fillStyle='#fff';for(let i=0;i<30;i++){cx.globalAlpha=.4+.5*Math.abs(Math.sin(ts/800+i));cx.fillRect((i*83)%480,(i*41)%100,1.6,1.6)}cx.globalAlpha=1;
  }else if(a===9){   // 竜宮：黄金の柱と、あわ
    [[330,70],[390,50],[450,62]].forEach(([x,h])=>{cx.fillStyle='rgba(255,210,90,.85)';cx.fillRect(x,134-h,12,h);cx.fillStyle='rgba(255,120,150,.9)';cx.fillRect(x-4,134-h-6,20,6)});
    for(let i=0;i<14;i++){const t=(ts/2600+i*.071)%1;cx.fillStyle='rgba(255,255,255,'+(.5*(1-t))+')';cx.beginPath();cx.arc((i*67)%480+Math.sin(ts/500+i)*4,250-t*120,2+(i%3),0,7);cx.fill()}
  }
}
const fishX=f=>140+(1-f.prog/100)*270;
function draw(ts){
  cx.save();
  if(FX.shake>0)cx.translate(rnd(-1,1)*FX.shake*8,rnd(-1,1)*FX.shake*8);
  const p=clamp((G.min-360)/720,0,1);
  const A=AREAS[G.area];
  const hue=p<.7?A.hue:A.hue-(p-.7)/.3*(A.hue-15),lit=62-p*32+A.lb;
  cx.fillStyle=`hsl(${hue},${A.ss}%,${lit}%)`;cx.fillRect(0,0,480,130);
  cx.fillStyle=`hsl(${p<.7?45:30},90%,${70-p*20}%)`;cx.beginPath();cx.arc(380,Math.min(110,40+p*90),22,0,7);cx.fill();
  const sea=cx.createLinearGradient(0,130,0,250);sea.addColorStop(0,`hsl(${A.sea},${A.ss}%,${34-p*14+A.lb}%)`);sea.addColorStop(1,`hsl(${A.sea+8},${A.ss+5}%,${16-p*6+A.lb*.6}%)`);
  cx.fillStyle=sea;cx.fillRect(0,130,480,120);
  cx.strokeStyle='rgba(255,255,255,.18)';cx.lineWidth=1.5;
  for(let r=0;r<5;r++){cx.beginPath();for(let x=0;x<=480;x+=8){const y=146+r*20+Math.sin(x/38+ts/700+r)*3;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
  areaDeco(G.area,ts);areaDeco2(G.area,ts);
  const deckW=Math.min(478,150+G.crew*32);
  if(G.area===0){cx.fillStyle='#5b4332';cx.fillRect(0,120,deckW,14);for(let x=14;x<deckW-8;x+=86)cx.fillRect(x,134,8,40)}
  else{
    cx.fillStyle=TOPC[G.area];cx.fillRect(0,118,deckW,6);
    cx.fillStyle=HULLC[G.area];cx.beginPath();cx.moveTo(0,124);cx.lineTo(deckW+14,124);cx.lineTo(deckW-8,148);cx.lineTo(0,148);cx.closePath();cx.fill();
    cx.fillStyle=STRIPEC[G.area];cx.fillRect(0,132,deckW,3);
  }
  CREW.forEach(cr=>drawCrew(cr,ts));
  person(cx,46,120,'#ffb454','#c0392b',1.25);
  cx.strokeStyle='#d9c7a8';cx.lineWidth=3;cx.beginPath();cx.moveTo(54,97);cx.lineTo(TIP.x,TIP.y);cx.stroke();
  cx.lineWidth=1;cx.strokeStyle='rgba(255,255,255,.8)';
  const st=S.st,tc=S.tier?TIER[S.tier].c:null;
  if(st==='fight'){
    const f=S.f,L=(58+(S.size-S.sp.min)/(S.sp.max-S.sp.min)*52)*(S.sp.boss?1.3:1),str=f.struggle;
    const fx=fishX(f)+(str?10+Math.sin(ts/90)*5:0),fy=176+Math.sin(ts/300)*4+(str?Math.sin(ts/38)*(S.tier===3?12:8)+Math.sin(ts/97)*4:0);
    const ang=str?Math.sin(ts/55)*.38*f.flip+.15:Math.sin(ts/500)*.06;
    const ml=-f.flip*L/2,mx=fx+ml*Math.cos(ang),my=fy+ml*Math.sin(ang);
    if(str){for(let k=0;k<2;k++){const r=((ts/350+k/2)%1)*30;cx.strokeStyle='rgba(255,255,255,'+(.55*(1-r/30))+')';cx.lineWidth=1.5;cx.beginPath();cx.ellipse(fx,150,r*1.6,r*.4,0,0,7);cx.stroke()}}
    const gb=Math.round(255-f.tens*2.2);cx.strokeStyle=`rgba(255,${gb},${gb},.9)`;cx.lineWidth=1+f.tens/60;
    cx.beginPath();cx.moveTo(TIP.x,TIP.y);cx.quadraticCurveTo((TIP.x+mx)/2,Math.min(TIP.y,my)-10+f.tens*.4,mx,my);cx.stroke();cx.lineWidth=1;
    cx.save();cx.translate(fx,fy);cx.rotate(ang);cx.scale(f.flip,1);
    if(tc)glow(cx,0,0,L*.95,tc,.45+.2*Math.sin(ts/150));
    drawSp(cx,S.sp,0,0,L);cx.restore();
    if(S.sp.boss){cx.fillStyle='#ffd24a';cx.font='900 12px sans-serif';cx.textAlign='center';cx.fillText(S.sp.n,Math.min(430,Math.max(60,fx)),fy-L*.5-22);cx.textAlign='left'}
    if(str){cx.fillStyle='#ff6b5e';cx.font='900 22px sans-serif';cx.textAlign='center';cx.fillText('!!',fx,fy-L*.42-6+Math.sin(ts/60)*2);cx.textAlign='left'}
  }else if(st==='wait'||st==='bite'){
    const bx=300,by=148+(st==='bite'?10+Math.sin(ts/50)*6:Math.sin(ts/500)*2);
    cx.beginPath();cx.moveTo(TIP.x,TIP.y);cx.quadraticCurveTo((TIP.x+bx)/2,TIP.y-6,bx,by);cx.stroke();
    if(st==='bite'&&tc){cx.lineWidth=2;for(let k=0;k<3;k++){const r=((ts/450+k/3)%1)*34;cx.strokeStyle=tc;cx.globalAlpha=1-r/34;cx.beginPath();cx.ellipse(bx,148,r*1.3,r*.45,0,0,7);cx.stroke()}cx.globalAlpha=1;cx.lineWidth=1}
    cx.fillStyle='#ff5a4e';cx.beginPath();cx.arc(bx,by,6,0,7);cx.fill();
    if(st==='bite'){cx.fillStyle=tc||'#ffd24a';cx.font=`900 ${S.tier?52:40}px sans-serif`;cx.fillText(S.tier>=2?'!!':'!',bx-(S.tier>=2?16:8),by-24)}
  }else{
    cx.beginPath();cx.moveTo(TIP.x,TIP.y);cx.lineTo(TIP.x+4,150);cx.stroke();
    if(st==='result'&&S.ok){const y=112+Math.sin(ts/200)*4;if(tc)glow(cx,TIP.x+46,y,56,tc,.5);drawSp(cx,S.sp,TIP.x+46,y,60)}
  }
  PT.forEach(q=>{cx.globalAlpha=Math.min(1,q.life/.6);cx.fillStyle=q.c;
    if(q.s){cx.save();cx.translate(q.x,q.y);cx.rotate(q.life*6);cx.fillRect(-q.r,-q.r,q.r*2,q.r*2);cx.restore()}
    else{cx.beginPath();cx.arc(q.x,q.y,q.r,0,7);cx.fill()}});
  cx.globalAlpha=1;
  if(FX.flash>0){cx.globalAlpha=Math.min(.6,FX.flash);cx.fillStyle=FX.col;cx.fillRect(0,0,480,250);cx.globalAlpha=1}
  cx.restore();
}
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(!veilOpen()){
    if(S.st==='wait'){S.t-=dt;if(S.t<=0){rollFish();S.st='bite';S.t=1.4+.05*G.lv.bait+.04*sx('agi');say(S.tier>=4?'水面が大きく盛り上がった…！ 主だ！！ アワセろ！':S.tier>=2?'ものすごいアタリだ！！ 逃すな、アワセ！':S.tier===1?'アタリ！ いつもと違う引きだ…！ アワセ！':'アタリ！ 今だ、アワセ！');if(S.tier)vibe(S.tier);if(S.tier>=4&&!G.noFx)FX.shake=.4;label()}}
    else if(S.st==='bite'){S.t-=dt;if(S.t<=0){say(S.tier>=4?'逃した…今のは主だったかもしれない！':S.tier?'逃した…今のはレアな魚だったかも！':'エサだけ取られた…');S.ok=false;end(false)}}
    else if(S.st==='fight'){fightStep(dt)}
    else if(S.st==='result'){S.t+=dt}
  }
  if(S.st==='fight'&&S.f.struggle&&!G.noFx){S.f.spl=(S.f.spl||0)-dt;if(S.f.spl<=0){S.f.spl=.06;const x=fishX(S.f);for(let k=0;k<3;k++)PT.push({x:x+rnd(-20,20),y:150,vx:rnd(-50,50),vy:rnd(-170,-90),g:400,life:rnd(.4,.8),c:'#dff3ff',r:rnd(1.5,2.8),s:false})}}
  syncCrew();crewStep(dt);
  for(let i=PT.length-1;i>=0;i--){const q=PT[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;if(q.life<=0||q.y>260)PT.splice(i,1)}
  if(FX.rain>0){FX.rain-=dt;for(let k=0;k<2;k++)PT.push({x:rnd(0,480),y:-5,vx:rnd(-10,10),vy:rnd(60,140),g:30,life:rnd(1.2,2),c:Math.random()<.5?'#ffd24a':'#fff',r:rnd(1.5,3),s:true})}
  FX.flash=Math.max(0,FX.flash-dt*1.2);FX.shake=Math.max(0,FX.shake-dt);
  const f=S.f;
  $('#tens').style.width=(S.st==='fight'?f.tens:0)+'%';
  $('#tens').classList.toggle('hot',S.st==='fight'&&f.tens>75);
  $('#prog').style.width=(S.st==='fight'?f.prog:0)+'%';
  if(!$('#p-fish').hidden)draw(ts);
  if(!$('#p-home').hidden)drawHome(ts);
  requestAnimationFrame(loop);
}
applyUi();syncCrew(true);renderAll();AREAS.forEach((_,a)=>checkComplete(a));document.addEventListener('visibilitychange',()=>{if(document.hidden){save();cloudPush(false);notifyPlan()}else{cloudRecheck();if(window.AppNotify)AppNotify.cancel();if(!veilOpen()&&(S.st==='idle'||S.st==='result')&&G.lastSeen&&Date.now()-G.lastSeen>=15*60000)offlineGain()}});
window.addEventListener('focus',cloudRecheck);label();say('「投げる」を押して釣りを始めよう。');if(G.home){openTab('home');say('夜です。自宅で休もう。')}(async()=>{
  await Promise.race([cloudInit(),new Promise(r=>setTimeout(r,2500))]);
  if(!veilOpen()){
    if(!G.seen){if(Cloud.kind==='app'&&Cloud.status==='signedout'&&!hasProgress())showWelcome();else showHelp(0)}
    else{settleNight();offlineGain()}
  }
})();
requestAnimationFrame(loop);
</script>
