"<div class=\"card\"><div class=\"kv\"><span>レベル</span><b class=\"num\">Lv.{1}</b><span>経験値</span><b class=\"num\">{2} / {3}</b><span>ボーナスポイント（BP）</span><b class=\"num\" style=\"color:var(--accent)\">{4}</b></div>\n    <div class=\"bar\" style=\"margin-top:8px\"><i style=\"background:var(--good);width:{5}%\"></i></div>\n    <p style=\"color:var(--sub);font-size:.8rem;margin:8px 0 0\">魚を釣ると経験値がもらえます。レベルが上がると、各ステータスが<b>ランダムに0〜3</b>上がり、<b>BPが3</b>もらえます。BPは好きなステータスに振り分けられます。</p>{6}</div>\n    <div class=\"list\">{7}</div>\n    <div class=\"row\"><button class=\"ghost\" id=\"stReset\" {8}>BPを振り直す（無料）</button></div>\n    <h2>主への挑戦目安</h2><p style=\"color:var(--sub);font-size:.8rem;margin:0 0 8px\">強い主に、どのステータスがどのくらい必要かを診断します。主に逃げられたときも自動で表示されます。</p>\n    <div class=\"list\">{9}</div>":"<div class=\"card\"><div class=\"kv\"><span>Level</span><b class=\"num\">Lv.{1}</b><span>EXP</span><b class=\"num\">{2} / {3}</b><span>Bonus Points (BP)</span><b class=\"num\" style=\"color:var(--accent)\">{4}</b></div>\n    <div class=\"bar\" style=\"margin-top:8px\"><i style=\"background:var(--good);width:{5}%\"></i></div>\n    <p style=\"color:var(--sub);font-size:.8rem;margin:8px 0 0\">Catch fish to earn EXP. Each level-up raises every stat by <b>0-3 at random</b> and gives you <b>3 BP</b>. You can spend BP on any stat you like.</p>{6}</div>\n    <div class=\"list\">{7}</div>\n    <div class=\"row\"><button class=\"ghost\" id=\"stReset\" {8}>Reset BP (free)</button></div>\n    <h2>Boss Challenge Guide</h2><p style=\"color:var(--sub);font-size:.8rem;margin:0 0 8px\">Shows which stats you need, and how much, to take on a tough Boss. It also appears automatically when a Boss gets away.</p>\n    <div class=\"list\">{9}</div>",

"<h3>直前のデータに戻しますか？</h3>\n    <div class=\"card\" style=\"margin:0 0 10px\"><div class=\"kv\"><span>控え（{1}）</span><b class=\"num\">Lv.{2}・{3}日目・{4}</b><span>いまのデータ</span><b class=\"num\">Lv.{5}・{6}日目・{7}</b></div></div>\n    <p style=\"margin:0 0 10px;color:var(--sub);font-size:.8rem\">いまのデータは、控えとして残ります。もう一度押すと、入れ替わります。</p>\n    <button class=\"big\" id=\"bkGo\">控えに戻す</button><button class=\"ghost\" id=\"bkNo\" style=\"width:100%;margin-top:8px\">やめる</button>":"<h3>Restore your previous data?</h3>\n    <div class=\"card\" style=\"margin:0 0 10px\"><div class=\"kv\"><span>Backup ({1})</span><b class=\"num\">Lv.{2} · Day {3} · {4}</b><span>Current data</span><b class=\"num\">Lv.{5} · Day {6} · {7}</b></div></div>\n    <p style=\"margin:0 0 10px;color:var(--sub);font-size:.8rem\">Your current data will be kept as the backup. Restore again to swap them back.</p>\n    <button class=\"big\" id=\"bkGo\">Restore backup</button><button class=\"ghost\" id=\"bkNo\" style=\"width:100%;margin-top:8px\">Cancel</button>",

"<div class=\"card\"><div id=\"cloudStatus\"></div>\n      <div style=\"color:var(--sub);font-size:.8rem;margin:8px 0\">Googleでログインすると、進み具合が自動でクラウドに保存されます。機種変更のときは、新しい端末で同じGoogleアカウントにログインするだけで、引き継げます。</div>\n      <button class=\"big\" id=\"loginBtn\">Googleでログイン</button></div>{1}":"<div class=\"card\"><div id=\"cloudStatus\"></div>\n      <div style=\"color:var(--sub);font-size:.8rem;margin:8px 0\">Sign in with Google and your progress is saved to the Cloud automatically. When you switch devices, just sign in with the same Google Account on the new one to transfer your data.</div>\n      <button class=\"big\" id=\"loginBtn\">Sign in with Google</button></div>{1}",
"<div class=\"card\"><div id=\"cloudStatus\"></div>\n      <div style=\"color:var(--sub);font-size:.8rem;margin-top:8px\">新しい端末で、同じGoogleアカウントにログインすると、最新のデータが自動で読み込まれます。</div>\n      <div class=\"row\"><button class=\"ghost\" id=\"cloudNow\">今すぐ保存</button><button class=\"ghost\" id=\"cloudLoad\">クラウドから読み込む</button><button class=\"ghost\" id=\"logoutBtn\">ログアウト</button></div></div>\n    {1}\n    <button class=\"ghost\" id=\"delAcct\" style=\"color:var(--bad);border-color:var(--bad)\">アカウントとクラウドのデータを削除</button>":"<div class=\"card\"><div id=\"cloudStatus\"></div>\n      <div style=\"color:var(--sub);font-size:.8rem;margin-top:8px\">Sign in with the same Google Account on a new device and your latest data loads automatically.</div>\n      <div class=\"row\"><button class=\"ghost\" id=\"cloudNow\">Save Now</button><button class=\"ghost\" id=\"cloudLoad\">Load from Cloud</button><button class=\"ghost\" id=\"logoutBtn\">Sign out</button></div></div>\n    {1}\n    <button class=\"ghost\" id=\"delAcct\" style=\"color:var(--bad);border-color:var(--bad)\">Delete Account and Cloud Data</button>",
"<div class=\"card\"><b>引き継ぎコード</b>\n      <div style=\"color:var(--sub);font-size:.8rem;margin:4px 0 8px\">アカウントが違う端末へ移すときは、コードを使います。</div>\n      <button class=\"big\" id=\"codeIssue\">引き継ぎコードを発行する</button>\n      <div class=\"row\"><input id=\"codeIn\" placeholder=\"ABCD-EFGH\" maxlength=\"9\" autocapitalize=\"characters\" autocomplete=\"off\" aria-label=\"引き継ぎコード\" style=\"flex:1;min-width:0;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px\"><button class=\"ghost\" id=\"codeUse\">コードで引き継ぐ</button></div></div>":"<div class=\"card\"><b>Transfer Code</b>\n      <div style=\"color:var(--sub);font-size:.8rem;margin:4px 0 8px\">Use a code to move your data to a device with a different account.</div>\n      <button class=\"big\" id=\"codeIssue\">Get a Transfer Code</button>\n      <div class=\"row\"><input id=\"codeIn\" placeholder=\"ABCD-EFGH\" maxlength=\"9\" autocapitalize=\"characters\" autocomplete=\"off\" aria-label=\"Transfer Code\" style=\"flex:1;min-width:0;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px\"><button class=\"ghost\" id=\"codeUse\">Transfer with Code</button></div></div>",
"<div class=\"card\"><div id=\"cloudStatus\"></div>\n      <div style=\"color:var(--sub);font-size:.8rem;margin-top:8px\">進み具合は、ログイン中のアカウントに自動で保存されます。新しい端末で、同じアカウントでこのゲームを開くと、最新のデータが自動で読み込まれます。両方で進めてしまったときだけ、どちらを使うか聞かれます。</div>\n      <div class=\"row\"><button class=\"ghost\" id=\"cloudNow\">今すぐ保存</button><button class=\"ghost\" id=\"cloudLoad\">クラウドから読み込む</button></div></div>\n    {1}\n    {2}":"<div class=\"card\"><div id=\"cloudStatus\"></div>\n      <div style=\"color:var(--sub);font-size:.8rem;margin-top:8px\">Your progress is saved automatically to the account you're signed in with. Open this game with the same account on a new device and your latest data loads automatically. You'll only be asked which one to use if you've played on both.</div>\n      <div class=\"row\"><button class=\"ghost\" id=\"cloudNow\">Save Now</button><button class=\"ghost\" id=\"cloudLoad\">Load from Cloud</button></div></div>\n    {1}\n    {2}",
"<p><span class=\"k\">自宅・設備</span>タブで<b>加工場</b>を建てると、魚を加工品にできます。</p><ol><li><span class=\"k\">市場</span>タブの魚の下にある「干物にする」「缶詰にする」を押す（加工賃は売値の8%）</li><li>夜を越すと完成（干物1晩・缶詰2晩）。市場タブの「加工品をすべて売る」で売れます</li><li>干物は売値×1.3、缶詰は×1.6。完成した加工品は<b>腐らず</b>、相場や値崩れの影響を受けません</li><li>1晩に加工できる数は、加工場のレベルで増えます</li></ol>":"<p>Build a <b>Processing Plant</b> in the <span class=\"k\">Home & Gear</span> tab to turn fish into processed goods.</p><ol><li>Tap \"Make Dried Fish\" or \"Make Canned Fish\" under a fish in the <span class=\"k\">Market</span> tab (processing fee: 8% of the sale price)</li><li>It's ready after a night passes (Dried fish: 1 night, Canned fish: 2 nights). Sell them with \"Sell All Processed Goods\" in the Market tab</li><li>Dried fish sells for ×1.3 and canned fish for ×1.6. Finished goods <b>never spoil</b> and aren't affected by Market price or Price drops</li><li>The number you can process per night grows with the Processing Plant's level</li></ol>",
"実績":"Achievements",
"<p><span class=\"k\">図鑑</span>タブの下に<b>実績</b>の一覧があります。条件を満たすと自動で解除され、<b>BP・おまかせ釣り券・食事券</b>がもらえます。</p>":"<p>You'll find the list of <b>Achievements</b> below the <span class=\"k\">Catalog</span> tab. Each one unlocks automatically when you meet its conditions, and gives you <b>BP, Auto-Fish Tickets, and Meal Tickets</b>.</p>",
"注文":"Orders",
"<p><span class=\"k\">市場</span>タブに、常連さんからの<b>注文</b>が毎朝届きます（最大3件・期限は2日）。</p><ol><li>「アジ×3匹・25cm以上・鮮度70%以上」のように条件があります</li><li>魚箱に条件に合う魚がそろったら<b>納品</b>。<b>売値の1.3倍〜</b>で買い取ってもらえます（評判が上がると倍率が増える）</li><li>納品・大会の入賞・主の討伐で<b>評判</b>が上がります。評判が高いと、注文の報酬・注文の件数・融資の上限が増えます</li><li>注文に使える魚は、「すべて売る」では売らずに残します</li><li>鮮度は一晩で落ちます。生け簀があると守れます</li></ol>":"<p>Every morning, <b>Orders</b> from your Regulars arrive in the <span class=\"k\">Market</span> tab (up to 3 at a time, each lasts 2 days).</p><ol><li>Each order has requirements, like \"Horse Mackerel ×3, 25cm or longer, Freshness 70%+\"</li><li>When your Cooler has fish that match, <b>Deliver</b> them. You're paid <b>1.3× the sale price or more</b> (the multiplier grows as your Reputation rises)</li><li>Delivering orders, placing in Fishing Tournaments, and defeating Bosses raise your <b>Reputation</b>. High Reputation means better order rewards, more orders, and a higher loan limit</li><li>Fish that can fill an order are kept back when you use \"Sell All\"</li><li>Freshness drops overnight. A Holding Tank protects it</li></ol>",
"保険と故障":"Insurance & Breakdowns",
"<p>朝に、ときどき<b>船が故障</b>します（約20日に1回）。夜に<b>修理費</b>（船の値段の3%）がかかります。</p><p><span class=\"k\">街</span>タブの<b>船の保険</b>に入ると、修理費が無料になります。保険料は毎晩、船の値段の0.2%です。</p>":"<p>Sometimes your <b>boat breaks down</b> in the morning (about once every 20 days). At night, a <b>repair bill</b> (3% of the boat's price) is charged.</p><p>If you sign up for <b>Boat Insurance</b> in the <span class=\"k\">Town</span> tab, repairs are free. The premium is 0.2% of the boat's price every night.</p>",
"銀行と船の維持費":"Bank & Boat Upkeep",
"<p><span class=\"k\">街</span>タブの<b>銀行</b>でお金を借りられます。船や設備を早く買って稼ぎを増やす近道ですが、<b>利息</b>が毎晩かかります（残高の0.8%）。返せるときに返しましょう。借りられる額は、これまでの売上に応じて増えます。</p><p>船には毎晩<b>維持費</b>がかかります（船の値段の0.4%）。</p>":"<p>You can borrow money at the <b>Bank</b> in the <span class=\"k\">Town</span> tab. It's a shortcut to buy boats and gear sooner and earn more, but <b>Interest</b> is charged every night (0.8% of the balance). Repay when you can. How much you can borrow grows with your total Sales so far.</p><p>Your boat also has a nightly <b>Upkeep</b> cost (0.4% of the boat's price).</p>",
"<p>朝、ときどき<b>できごと</b>が起きます：豊漁（水揚げ増）・不漁・荒天（釣りは難しいが売値が上がる）・観光フェア（売値アップ）・大量入荷（売値ダウン）。画面の上に今日のできごとが出ます。</p>":"<p>Sometimes an <b>event</b> happens in the morning: Bumper Catch (bigger Haul) / Poor Catch / Stormy Weather (fishing is harder, but sale prices go up) / Tourist Fair (sale prices up) / Market Glut (sale prices down). Today's event is shown at the top of the screen.</p>",
"従業員を育てる":"Training Your Crew",
"<p><span class=\"k\">自宅・設備</span>タブで従業員を雇えます。1人ずつ名前と役割があります。</p><ol><li><b>釣り師</b>：いっしょに釣りに出て、毎日お金を水揚げする</li><li><b>営業</b>：水揚げはしないが、魚の売値を底上げする（全員で+15%まで）</li><li>役割は、名前の横のボタンで切り替えられる（変更は<b>あしたの朝</b>から）</li><li>働いた日数でレベルが上がる。水揚げも売値ボーナスも増えるが、<b>給料も上がる</b></li><li>一人ひとりに<b>特性</b>があります。気に入らなければ「辞めてもらう」で入れ替えられます</li></ol><p>序盤は釣り師が得、お金がたまってきたら営業を混ぜると売上が伸びます。夜の収支や、市場タブの経営レポートで、人件費の重さを確認しよう。</p>":"<p>You can hire Crew in the <span class=\"k\">Home & Gear</span> tab. Each member has a name and a Role.</p><ol><li><b>Angler</b>: heads out fishing with you and brings in a Haul of money every day</li><li><b>Sales</b>: doesn't bring in a Haul, but boosts fish Sale prices (up to +15% across all Crew)</li><li>You can switch Roles with the button next to their name (changes take effect <b>tomorrow morning</b>)</li><li>They level up with days worked. Hauls and sale bonuses grow, but so does their <b>Wage</b></li><li>Everyone has a <b>Trait</b>. If you don't like it, you can swap them out with \"Let go\"</li></ol><p>Early on, Anglers are the better deal. Once you've saved up some money, adding a few Sales Crew will help your earnings grow. Check how heavy your Crew costs are in the nightly Profit & Loss and the business report in the Market tab.</p>",
"設備を強化する":"Upgrading Your Gear",
"<p><span class=\"k\">自宅・設備</span>タブでお金を使って強化できます。</p><ol><li><b>釣り竿</b>：巻き上げが速くなる</li><li><b>釣り糸</b>：テンションが上がりにくい</li><li><b>エサ</b>：アタリが早く、珍しい魚が寄る</li><li><b>クーラーボックス</b>：魚箱が広がり、鮮度も保てる</li><li><b>漁師を雇う</b>：釣り場でいっしょに釣って稼いでくれる（給料もかかる）</li></ol>":"<p>You can spend money on upgrades in the <span class=\"k\">Home & Gear</span> tab.</p><ol><li><b>Rod</b>: reels in faster</li><li><b>Line</b>: Tension rises more slowly</li><li><b>Bait</b>: faster bites, and rarer fish come to it</li><li><b>Cooler</b>: a bigger Cooler that also keeps fish fresh</li><li><b>Hire an Angler</b>: fishes alongside you at your spot and earns money for you (but costs a Wage)</li></ol>",
"新しい海域へ":"Heading to New Waters",
"<ol><li><span class=\"k\">自宅・設備</span>タブの「船」で次の船を買うと、新しい海域に出られます</li><li>小型ボート（":"<ol><li>Buy the next boat under \"Boat\" in the <span class=\"k\">Home & Gear</span> tab to sail to new waters</li><li>Small Boat (",
"）で沖合、大型漁船（":") for Offshore, Large Fishing Boat (",
"）で深海</li><li>さらにクルーザーでサンゴ礁の島、砕氷船で氷海、ムーンクラフトで幻の海域、そのさき（海底火山・沈没船の海域・極夜のオーロラ海・竜宮の海）にも、新しい船で行けます</li><li>買ったら<span class=\"k\">釣り</span>タブの海域ボタンで行き先を選ぶ</li></ol><p>先の海域ほど、高く売れる大きな魚がいます。</p>":") for the Deep Sea</li><li>Beyond that, new boats take you to the Coral Reef Island (Cruiser), Icy Sea (Icebreaker), Phantom Waters (Moon Craft), and further still (Undersea Volcano, Shipwreck Waters, Polar Aurora Sea, Dragon Palace Sea)</li><li>Once you've bought one, pick your destination with the Waters buttons in the <span class=\"k\">Fishing</span> tab</li></ol><p>The farther out you go, the bigger and higher-priced the fish.</p>",
"レアな魚":"Rare Fish",
"<p>海域ごとに、めったに釣れないレアな魚がいます。<span class=\"tag\" style=\"background:#6cc4ff\">レア</span><span class=\"tag\" style=\"background:#c08cff\">超レア</span><span class=\"tag\" style=\"background:#ffd24a\">伝説</span></p><p>レアな魚がかかると、アタリの時点で気配が違います。釣り上げると派手な演出が出ます。図鑑でまだ釣っていない魚を探しましょう。エサの強化やランクの特典で、珍しい魚が寄りやすくなります。</p>":"<p>Each Waters has rare fish that are hard to catch. <span class=\"tag\" style=\"background:#6cc4ff\">Rare</span><span class=\"tag\" style=\"background:#c08cff\">Super Rare</span><span class=\"tag\" style=\"background:#ffd24a\">Legendary</span></p><p>When a rare fish bites, you can tell something's different right from the bite. Landing one sets off a flashy show. Look in the Catalog for fish you haven't caught yet. Bait upgrades and Rank perks make rarer fish more likely to show up.</p>",
"エリアコンプと主":"Waters Complete & Bosses",
"<p>海域にいる魚を<b>全種類</b>釣ると<b>コンプボーナス</b>がもらえます（祝い金・BP・その海域の魚の売値+5%）。</p><p>コンプすると、その海域に低確率で<b>主</b>が現れます。主はとても強く、先の海域の主ほど手強くなります。アタリの気配が違うので、準備を整えて挑もう。初めて釣り上げると、討伐ボーナスがもらえます。主は売値も経験値も桁違いです。</p><p>主に逃げられると、<b>どのステータスがどのくらい必要か</b>の目安が表示されます（ステータスタブからも診断できます）。</p>":"<p>Catch <b>every species</b> in a Waters to get the <b>Complete Bonus</b> (Bonus money, BP, and +5% Sale price for fish from that Waters).</p><p>Once it's complete, a <b>Boss</b> may appear in that Waters, with a low chance. Bosses are very strong, and the farther the Waters, the tougher the Boss. The bite feels different, so get ready before you take it on. You get a Boss defeated bonus the first time you land one. Bosses are worth far more in sale price and EXP.</p><p>If a Boss gets away, you'll see a guide to <b>which Stats you need and how much</b> (you can also check from the Stats tab).</p>",
"オスとメス":"Males & Females",
"<p>釣れた魚には<b>オス（♂）とメス（♀）</b>がいます。メスは<b>売値+5%</b>。注文に「メス指定」「オス指定」が付くこともあります。</p><p><span class=\"k\">図鑑</span>で、同じ種のオスとメスを両方釣ると<b>ペア</b>成立（祝い金）。養殖いかだに<b>オスとメス</b>を入れておくと、一晩で<b>稚魚</b>が生まれることがあります。</p>":"<p>Fish you catch can be <b>Male (♂) or Female (♀)</b>. Females have a <b>+5% Sale price</b>. Orders sometimes ask for a female or a male specifically.</p><p>In the <span class=\"k\">Catalog</span>, catching both a male and a female of the same species makes a <b>Pair</b> (Bonus money). If you put a <b>male and a female</b> in your Fish Farm, <b>fry</b> may be born overnight.</p>",
"色違いの魚":"Variant Fish",
"<p>ごくまれに、いつもと<b>色が違う魚</b>が釣れます。魚ごとに決まった別の色で、<b>売値が4倍</b>、経験値も2倍です（運が高いと出やすい）。</p><p>アタリのときの表示や、釣り上げたときの演出が変わります。<span class=\"k\">図鑑</span>に、色違いを釣った種類が記録されます。</p>":"<p>Very rarely, you'll catch a fish in a <b>different color</b> than usual. Each fish has its own special color, and it has a <b>4× Sale price</b> and 2× EXP (higher Luck makes them more likely).</p><p>The bite message and the catch animation are different. The <span class=\"k\">Catalog</span> records which species you've caught a Variant of.</p>",
"レベルとステータス":"Levels & Stats",
"<p>魚を釣ると<b>経験値</b>がもらえ、たまると<b>レベル</b>が上がります（ランクとは別です）。</p><ol><li>レベルが上がると、8つのステータスがランダムに上がる（0〜3ずつ）</li><li>同時に<b>BP</b>が3もらえる</li><li><span class=\"k\">ステータス</span>タブで、BPを好きなステータスに振り分ける</li></ol><p><b>力</b>は巻き上げ、<b>体力</b>はテンション、<b>素早さ</b>はアタリ、<b>器用さ</b>は寄せ戻され、<b>運</b>はレア魚に効きます。</p><p>さらに、<b>集中力</b>は魚の暴れる時間を短くし、<b>商才</b>は売値と給料に、<b>統率力</b>は従業員の水揚げと成長に効きます（8つのステータス）。</p>":"<p>Catching fish earns <b>EXP</b>, and when it builds up your <b>Lv.</b> goes up (separate from Rank).</p><ol><li>When you level up, your 8 Stats go up at random (0 to 3 each)</li><li>You also get <b>3 BP</b></li><li>In the <span class=\"k\">Stats</span> tab, put your BP into any Stat you like</li></ol><p><b>Strength</b> affects reeling, <b>Stamina</b> affects Tension, <b>Agility</b> affects bites, <b>Dexterity</b> affects Reel Progress loss, and <b>Luck</b> affects rare fish.</p><p>On top of that, <b>Focus</b> shortens how long a fish thrashes, <b>Business Sense</b> affects Sale price and Wage, and <b>Leadership</b> affects your Crew's Haul and growth (8 Stats in all).</p>",
"自宅と施設":"Home & Facilities",
"<p>1日が終わると<b>自宅</b>に帰ります。<span class=\"k\">自宅・設備</span>タブでは、道具・船・漁師・施設が並んでいる様子が見られます。施設や設備もここで買えます。</p><ol><li><b>自宅</b>：大きくすると雇える漁師が増える</li><li><b>生け簀</b>：売れ残りの魚を鮮度そのまま保管</li><li><b>魚拓棚</b>：釣った魚を飾り、経験値ボーナス</li></ol><p>眠ると朝になり、次の日の釣りが始まります。</p>":"<p>When the day ends, you head back <b>home</b>. In the <span class=\"k\">Home & Gear</span> tab you can see your tools, boat, anglers, and facilities all lined up. You can buy facilities and gear here too.</p><ol><li><b>Home</b>: upgrade it to hire more anglers</li><li><b>Holding Tank</b>: keeps unsold fish at the same Freshness</li><li><b>Trophy Shelf</b>: display your catches for an EXP bonus</li></ol><p>Go to sleep and it's morning, and the next day of fishing begins.</p>",
"忙しい人のための機能":"Features for Busy Players",
"<ol><li><span class=\"k\">街</span>タブの<b>デイリーボーナス</b>で、おまかせ釣り券と食事券が毎日もらえる</li><li><b>おまかせ釣り</b>：券1枚で、5回ぶんの釣りを自動で進める（釣れるかどうかは自分のステータスで決まる）</li><li><b>外食</b>：食堂で食事すると、経験値アップなどの効果が次の12回の釣りの間続く。図鑑に載った魚の種類が増えるほど、<b>メニューが増えて</b>豪華になる</li><li><b>留守中の水揚げ</b>：漁師がいると、アプリを閉じている間もお金を稼いでくれる（最大8時間ぶん）</li><li>設定で<b>自動売却</b>をONにすると、魚箱がいっぱいのときに自動で売る</li></ol>":"<ol><li>The <b>Daily Bonus</b> in the <span class=\"k\">Town</span> tab gives you Auto-Fish Tickets and Meal Tickets every day</li><li><b>Auto Fishing</b>: 1 ticket automatically plays through 5 casts' worth of fishing (whether you land a fish depends on your own Stats)</li><li><b>Dining out</b>: eat a Meal at the diner and its effect, like an EXP boost, lasts for your next 12 fishing attempts. The more species you've added to the Catalog, the more the <b>menu grows</b> and the fancier it gets</li><li><b>Offline Haul</b>: if you have anglers, they keep earning money even while the app is closed (up to 8 hours' worth)</li><li>Turn on <b>Auto-sell</b> in Settings to sell automatically when your Cooler is full</li></ol>",
"1日とランク":"Your Day & Rank",
"<p>釣り1回ごとに40分進み、18時になると1日が終わります。夜は給料を払って自宅に帰り、施設を整えて眠ると朝になります。相場も毎日変わります。</p><p>売上が増えるとランクが上がり、<b>祝い金と特典</b>（売値アップ、魚箱拡大など）がもらえます。画面上部のランクをタップすると一覧が見られます。それでは、いってらっしゃい！</p>":"<p>Each cast moves the clock forward 40 minutes, and the day ends at 18:00. At night you pay Wages, head home, set up your facilities, and go to sleep, and the next morning begins. Market prices change every day too.</p><p>As your Sales grow, your Rank goes up and you get a <b>Bonus and perks</b> (higher Sale price, bigger Cooler, and more). Tap the Rank at the top of the screen to see the full list. Have a great day out there!</p>",

"<div class=\"help\"><h3>のれん分けする？</h3><p>これまでの財産を手放して、{1}周目を始めます。<b>のれん {2}</b> がもらえます（基本12＋売上＋早さボーナス{3}）。</p><p><b>のこるもの</b>：図鑑・実績・主の記録・レベルとステータス・BP・券・ペットと模様替え・のれんの強化</p><p><b>消えるもの</b>：お金・船・設備・従業員・養殖・研究・支店・借入・魚箱・ランク</p><p style=\"color:var(--sub);font-size:.82rem\">周回するたび、魚の引きが少し強くなります。はじめる前の状態は、設定の「控え」から戻せます。</p><div class=\"row\"><button class=\"ghost\" id=\"nrNo\">やめる</button><button class=\"big\" id=\"nrYes\" style=\"flex:1;width:auto\">のれん分けする</button></div></div>":"<div class=\"help\"><h3>Spin off?</h3><p>You'll give up your assets and start Lap {1}. You'll get <b>Goodwill {2}</b> (base 12 + sales + speed bonus {3}).</p><p><b>You keep:</b> Catalog, Achievements, Boss records, Lv and Stats, BP, Tickets, Pets and Home Decor, Goodwill upgrades</p><p><b>You lose:</b> Money, Boat, Gear, Crew, Fish Farm, Research, Branches, Loans, Cooler, Rank</p><p style=\"color:var(--sub);font-size:.82rem\">Fish fight back a little harder with every lap. You can restore your pre-Spin-off state from 'Backup' in Settings.</p><div class=\"row\"><button class=\"ghost\" id=\"nrNo\">Cancel</button><button class=\"big\" id=\"nrYes\" style=\"flex:1;width:auto\">Spin off</button></div></div>",

"    <h2>銀行</h2><div class=\"card\"><div class=\"kv\"><span>借入残高</span><b class=\"num {1}\">{2}</b><span>あと借りられる額</span><b class=\"num\">{3}</b><span>利息（毎晩・残高の{4}%）</span><b class=\"num\">{5}</b></div>\n      <div class=\"row\" style=\"margin-top:8px;flex-wrap:wrap\">{6}</div>\n      <div class=\"row\" style=\"margin-top:6px;flex-wrap:wrap\"><button class=\"chip\" data-repay=\"half\" {7}>半分返す</button><button class=\"chip\" data-repay=\"all\" {8}>全額返す</button></div>\n      <div style=\"color:var(--sub);font-size:.78rem;margin-top:6px\">船や設備を早く買うための資金に。利息は夜の収支で引かれます（払えない分は借入に上乗せ）。借りられる額は、これまでの売上に応じて増えます。</div></div>":"    <h2>Bank</h2><div class=\"card\"><div class=\"kv\"><span>Loan balance</span><b class=\"num {1}\">{2}</b><span>Available to borrow</span><b class=\"num\">{3}</b><span>Interest (nightly, {4}% of balance)</span><b class=\"num\">{5}</b></div>\n      <div class=\"row\" style=\"margin-top:8px;flex-wrap:wrap\">{6}</div>\n      <div class=\"row\" style=\"margin-top:6px;flex-wrap:wrap\"><button class=\"chip\" data-repay=\"half\" {7}>Repay Half</button><button class=\"chip\" data-repay=\"all\" {8}>Repay All</button></div>\n      <div style=\"color:var(--sub);font-size:.78rem;margin-top:6px\">Funds to buy boats and gear sooner. Interest is deducted in your nightly Profit & Loss (anything you can't pay is added to your loan). The amount you can borrow grows with your total Sales so far.</div></div>",
"{1}<h2>デイリーボーナス</h2><div class=\"card\"><div class=\"kv\"><span>連続ログイン</span><b class=\"num\">{2}</b></div>\n    <button class=\"big\" id=\"daily\" {3}>{4}</button>\n    <div style=\"color:var(--sub);font-size:.78rem;margin-top:6px\">毎日アプリを開くだけで、券がもらえます。連続で受け取るほど、券が増えます。</div></div>\n    {5}<h2>外食（海辺の食堂）</h2><p style=\"color:var(--sub);font-size:.82rem;margin:0 0 8px\">外で食事を済ませると、効果が次の{6}回の釣りの間続きます。{7}</p><div class=\"list\">{8}</div>\n    <h2>切符売り場</h2><div class=\"list\">\n      <div class=\"item\"><div class=\"t\">おまかせ釣り券 <span class=\"num\" style=\"color:var(--accent)\">所持{9}枚</span></div><button class=\"buy\" data-buytk=\"auto:1\" {10}>{11}</button><div class=\"s\">1枚で5回ぶんの釣りを自動で進めます。<br><button class=\"chip\" data-buytk=\"auto:5\" {12} style=\"margin-top:6px\">5枚まとめて {13}</button></div></div>\n      <div class=\"item\"><div class=\"t\">食事券 <span class=\"num\" style=\"color:var(--accent)\">所持{14}枚</span></div><button class=\"buy\" data-buytk=\"meal:1\" {15}>{16}</button><div class=\"s\">食堂でお金の代わりに使えます。</div></div></div>\n{17}\n{18}\n{19}\n{20}\n{21}\n{22}\n{23}\n{24}\n    <h2>おまかせ釣り</h2><p style=\"color:var(--sub);font-size:.82rem;margin:0 0 8px\">券を使うと、釣りを自動で進めます。釣れるかどうかは、自分のステータスと装備で決まります。主は出ません。時間は普通に進みます。</p>\n    <div class=\"row\" style=\"margin-top:0\"><button class=\"big\" id=\"townAuto1\" style=\"flex:1;width:auto\" {25}>5回おまかせ（券1枚）</button><button class=\"ghost\" id=\"townAutoAll\" {26}>残りぜんぶ</button></div>":"{1}<h2>Daily Bonus</h2><div class=\"card\"><div class=\"kv\"><span>Login streak</span><b class=\"num\">{2}</b></div>\n    <button class=\"big\" id=\"daily\" {3}>{4}</button>\n    <div style=\"color:var(--sub);font-size:.78rem;margin-top:6px\">Just open the app each day to get Tickets. The longer your streak, the more Tickets you get.</div></div>\n    {5}<h2>Eating Out (Seaside Diner)</h2><p style=\"color:var(--sub);font-size:.82rem;margin:0 0 8px\">Have a Meal out and its effect lasts for your next {6} casts. {7}</p><div class=\"list\">{8}</div>\n    <h2>Ticket Booth</h2><div class=\"list\">\n      <div class=\"item\"><div class=\"t\">Auto-Fish Ticket <span class=\"num\" style=\"color:var(--accent)\">Owned: ×{9}</span></div><button class=\"buy\" data-buytk=\"auto:1\" {10}>{11}</button><div class=\"s\">1 Ticket auto-plays 5 casts of fishing.<br><button class=\"chip\" data-buytk=\"auto:5\" {12} style=\"margin-top:6px\">Buy 5 for {13}</button></div></div>\n      <div class=\"item\"><div class=\"t\">Meal Ticket <span class=\"num\" style=\"color:var(--accent)\">Owned: ×{14}</span></div><button class=\"buy\" data-buytk=\"meal:1\" {15}>{16}</button><div class=\"s\">Use it at the diner instead of money.</div></div></div>\n{17}\n{18}\n{19}\n{20}\n{21}\n{22}\n{23}\n{24}\n    <h2>Auto Fishing</h2><p style=\"color:var(--sub);font-size:.82rem;margin:0 0 8px\">Use a Ticket to run your fishing automatically. What you catch depends on your Stats and gear. Bosses won't appear. Time passes as normal.</p>\n    <div class=\"row\" style=\"margin-top:0\"><button class=\"big\" id=\"townAuto1\" style=\"flex:1;width:auto\" {25}>Auto-Fish ×5 (1 Ticket)</button><button class=\"ghost\" id=\"townAutoAll\" {26}>All Remaining</button></div>",

"<h2>文字の大きさ</h2><div class=\"row\" style=\"margin-top:0\">{1}</div><p class=\"hint\">選ぶと、画面全体の文字が大きくなります。</p>\n    <h2>表示と音</h2><div class=\"list\">{2}</div>\n    <h2>難易度</h2><div class=\"row\" style=\"margin-top:0\">{3}</div><p class=\"hint\">釣りのときのテンションの上がりやすさが変わります。（かんたん：×0.8／ふつう：×1／むずかしい：×1.3）</p>\n    <h2>遊び方</h2><button class=\"ghost\" id=\"setHelp\">遊び方をもう一度見る</button>\n    <h2>これまでの記録</h2><div class=\"card\"><div class=\"kv\"><span>プレイ日数</span><b class=\"num\">{4}日</b><span>釣った魚</span><b class=\"num\">{5}匹</b><span>累計売上</span><b class=\"num\">{6}</b><span>図鑑</span><b class=\"num\">{7}/{8}</b><span>レベル</span><b class=\"num\">Lv.{9}</b></div></div>\n    <h2>データの引き継ぎ（機種変更）</h2>{10}\n    <details style=\"margin-top:6px\"><summary style=\"cursor:pointer;color:var(--sub)\">その他の方法（文字列で書き出し・読み込み）</summary>\n      <textarea id=\"exp\" readonly aria-label=\"書き出したデータ\" style=\"margin-top:8px\"></textarea><div class=\"row\"><button class=\"ghost\" id=\"expCopy\">データを書き出してコピー</button></div>\n      <textarea id=\"imp\" placeholder=\"ここに書き出したデータを貼り付け\" aria-label=\"読み込むデータ\" style=\"margin-top:12px\"></textarea><div class=\"row\"><button class=\"ghost\" id=\"impGo\">読み込む</button></div></details>\n    <h2>データ</h2><button class=\"ghost\" id=\"reset\">最初からやり直す</button>":"<h2>Text Size</h2><div class=\"row\" style=\"margin-top:0\">{1}</div><p class=\"hint\">Pick one to make all the text on screen bigger.</p>\n    <h2>Display & Sound</h2><div class=\"list\">{2}</div>\n    <h2>Difficulty</h2><div class=\"row\" style=\"margin-top:0\">{3}</div><p class=\"hint\">Changes how fast Tension builds while fishing. (Easy: ×0.8 / Normal: ×1 / Hard: ×1.3)</p>\n    <h2>How to Play</h2><button class=\"ghost\" id=\"setHelp\">View How to Play again</button>\n    <h2>Your Records</h2><div class=\"card\"><div class=\"kv\"><span>Days played</span><b class=\"num\">{4}</b><span>Fish caught</span><b class=\"num\">{5}</b><span>Total sales</span><b class=\"num\">{6}</b><span>Catalog</span><b class=\"num\">{7}/{8}</b><span>Level</span><b class=\"num\">Lv.{9}</b></div></div>\n    <h2>Data Transfer (Switching Phones)</h2>{10}\n    <details style=\"margin-top:6px\"><summary style=\"cursor:pointer;color:var(--sub)\">Other ways (export / import as text)</summary>\n      <textarea id=\"exp\" readonly aria-label=\"Exported data\" style=\"margin-top:8px\"></textarea><div class=\"row\"><button class=\"ghost\" id=\"expCopy\">Export & copy data</button></div>\n      <textarea id=\"imp\" placeholder=\"Paste your exported data here\" aria-label=\"Data to import\" style=\"margin-top:12px\"></textarea><div class=\"row\"><button class=\"ghost\" id=\"impGo\">Import</button></div></details>\n    <h2>Data</h2><button class=\"ghost\" id=\"reset\">Start over</button>",

"それでも低確率で、また姿を見せる…":"It can still show up now and then, though it's rare...",

"<b>{1}を制覇！</b> 低確率で<b>主</b>が現れます。とても強いので、準備を整えて挑もう。":"<b>{1} conquered!</b> A <b>Boss</b> may now appear, though rarely. It's very tough, so get ready before you take it on.",
"{1}の図鑑 <b class=\"num\">{2}/{3}</b>。全種類釣るとコンプボーナス（祝い金・BP・売値+5%）。さらに<b>主</b>が現れます。":"{1} Catalog <b class=\"num\">{2}/{3}</b>. Catch every species for the Catalog Complete reward (Bonus, BP, +5% Sale price). A <b>Boss</b> will also appear.",
"<b>{1}が買えます！</b> 「自宅・設備」タブの「船」で買うと{2}に出られます。":"<b>You can buy {1}!</b> Buy it under \"Boat\" in the Home & Gear tab to head out to {2}.",

"ようこそ！":"Welcome!",
"<p>魚を釣って、売って、船と仲間を増やす釣り船経営ゲームです。</p><p>目標は、売上を増やして最高ランク「漁業王」になること。まずは釣りから始めましょう。</p>":"<p>Catch fish, sell them, and grow your fishing business with bigger boats and a Crew.</p><p>Your goal is to boost your Sales and reach the top Rank, \"Fishing King\". Start by fishing!</p>",
"釣り方":"How to Fish",
"<ol><li><span class=\"k\">投げる</span>を押して浮きを待つ</li><li>浮きが沈んで「！」が出たら、すぐ<span class=\"k\">アワセ！</span></li><li>ヒットしたら<span class=\"k\">巻く</span>ボタンを押し続けて寄せる</li><li>魚が暴れている間は<b>指を離す</b>。落ち着いたらまた巻く</li></ol><p>テンションが満タンになると糸が切れ、寄せ具合が満タンになると釣れます。パソコンならスペースキーでも操作できます。</p>":"<ol><li>Tap <span class=\"k\">Cast</span> and wait for the float</li><li>When the float sinks and \"!\" appears, hit <span class=\"k\">Hook it!</span> right away</li><li>Once hooked, hold the <span class=\"k\">Reel</span> button to pull the fish in</li><li>While the fish thrashes, <b>let go</b>. Reel again when it calms down</li></ol><p>If Tension maxes out, the line snaps. If Reel Progress maxes out, you land the fish. On a PC you can use the Space key too.</p>",
"魚を売る":"Selling Fish",
"<p>釣った魚は魚箱に入ります（容量があります）。<span class=\"k\">市場</span>タブで売ってお金にしましょう。</p><p>値段は、大きさ（★の数）・鮮度・今日の相場で決まります。大きい魚ほど高く売れ、経験値も多くもらえます。売れ残りは夜のたびに鮮度が落ちるので、早めに売るのがおすすめです。</p><p>同じ魚を続けて売ると<b>値崩れ</b>します（翌朝には半分もどる）。直売所を強化すると、1日に数匹だけ高く売れる<b>直売所の枠</b>が使えます。「すべて売る」は、高い魚から順に自動で有利な出荷先へ回します。</p>":"<p>Fish you catch go into your Cooler (it has limited capacity). Sell them in the <span class=\"k\">Market</span> tab to turn them into cash.</p><p>The price depends on size (number of ★), Freshness, and today's Market price. Bigger fish sell for more and give more EXP. Unsold fish lose Freshness every night, so it's best to sell early.</p><p>Selling the same fish over and over causes a <b>Price drop</b> (half of it recovers the next morning). Upgrade your Fish Stand to unlock <b>Fish Stand slots</b>, which sell a few fish a day at a higher price. \"Sell All\" automatically sends fish to the best Shipping destination, highest-priced first.</p>",
"経営レポート":"Business Report",
"<p><span class=\"k\">市場</span>タブの<b>経営レポート</b>で、今日の収支・直近7日の収入と経費・稼ぎ頭の魚を確認できます。夜の終了画面にも、その日の収支が出ます。</p>":"<p>The <b>Business Report</b> in the <span class=\"k\">Market</span> tab shows today's Profit & Loss, your Sales and Expenses for the last 7 days, and your top-earning fish. The end-of-night screen also shows that day's Profit & Loss.</p>",
"ライバル漁師":"Rival Anglers",
"<p><span class=\"k\">街</span>タブに、ライバル漁師5人との<b>週間売上</b>ランキングがあります。1週間の収入（売上・水揚げ・賞金・納品）が多いほど上位です。</p><p>7日ごとの夜に発表され、<b>3位まで</b>にBPと評判、<b>1位</b>はおまかせ釣り券もらえます。</p>":"<p>The <span class=\"k\">Town</span> tab has a <b>weekly Sales</b> ranking against 5 Rival anglers. The more you earn in a week (sales, Haul, prize money, Deliveries), the higher you rank.</p><p>It's announced on the night of every 7th day. The <b>top 3</b> get BP and Reputation, and <b>1st place</b> also gets an Auto-Fish Ticket.</p>",
"釣り大会":"Fishing Tournament",
"<p>7日ごとに<b>釣り大会</b>が開かれます。<span class=\"k\">街</span>タブから、その日の朝に参加できます（参加費あり）。</p><ol><li>参加した日に、<b>自分で釣った魚</b>のうち、いちばん高い1匹の値段で競います（おまかせ釣り・従業員・主は対象外）</li><li>夜にライバル5人とのランキングが発表され、<b>3位まで賞金</b>、1位はおまかせ釣り券ももらえます</li><li>旬の魚や、大物を狙うと有利です</li></ol>":"<p>A <b>Fishing Tournament</b> is held every 7 days. You can enter from the <span class=\"k\">Town</span> tab on the morning of the event (entry fee applies).</p><ol><li>On the day you enter, you compete on the price of your single most valuable fish <b>that you caught yourself</b> (Auto Fishing, Crew, and Bosses don't count)</li><li>At night, the ranking against 5 Rival anglers is announced. The <b>top 3 win prize money</b>, and 1st place also gets an Auto-Fish Ticket</li><li>In-season fish and Big catches give you an edge</li></ol>",
"ミッション":"Missions",
"<p><span class=\"k\">街</span>タブに、毎朝<b>3つのミッション</b>が出ます（魚を釣る・売る・レア魚・注文の納品など）。達成するたびに、おまかせ釣り券・食事券・BPがもらえます。3つ全部達成すると、さらにボーナスです。</p>":"<p>Every morning, <b>3 Missions</b> appear in the <span class=\"k\">Town</span> tab (catching fish, selling fish, rare fish, delivering Orders, and more). Each one you complete earns Auto-Fish Tickets, Meal Tickets, or BP. Complete all 3 for an extra bonus.</p>",
"相棒（ペット）":"Companion (Pet)",
"<p><span class=\"k\">街</span>タブの<b>相棒（ペット）</b>を仲間にすると、連れている1匹の効果がもらえます（ネコ：魚が逃げにくい／ウミネコ：経験値+5%／ラッコ：売値+3%／ウミガメ：珍しい魚が寄りやすい）。</p>":"<p>Befriend a <b>Companion (Pet)</b> in the <span class=\"k\">Town</span> tab, and the one you bring along gives you a perk (Cat: fish are less likely to escape / Seagull: +5% EXP / Sea Otter: +3% Sale price / Sea Turtle: rare fish are drawn in more easily).</p>",
"模様替え":"Redecorate",
"<p><span class=\"k\">自宅・設備</span>タブの<b>模様替え</b>で、自宅の風景に飾りを足せます（見た目だけ）。</p>":"<p>With <b>Redecorate</b> in the <span class=\"k\">Home & Gear</span> tab, you can add decorations to your home scenery (looks only).</p>",
"<p>釣りの合間に、ときどき<b>漂流物や宝箱</b>が流れ着きます（約25回に1回）。お金・おまかせ釣り券・食事券・BPのどれかがもらえ、たまに大当たりも。</p>":"<p>Every so often while you fish, <b>Flotsam or a Treasure chest</b> washes ashore (about once every 25 casts). You'll get cash, an Auto-Fish Ticket, a Meal Ticket, or BP, with the occasional jackpot.</p>",
"エサ・ルアー":"Bait & Lures",
"<p>魚には<b>好物のエサ</b>があります（図鑑や注文に表示）。<span class=\"k\">街</span>タブの<b>釣具店</b>で10個入りを買い、「使う」にすると、1投ごとに1個使って、好物の魚が2.5倍よく釣れます。</p><p>注文や釣り大会で狙う魚が決まっているときに便利です。</p>":"<p>Each fish has a <b>favorite Bait</b> (shown in the Catalog and on Orders). Buy a pack of 10 at the <b>Tackle Shop</b> in the <span class=\"k\">Town</span> tab and set it to \"Use\". It uses 1 per cast, and favorite fish bite 2.5x as often.</p><p>Handy when an Order or Tournament calls for a specific fish.</p>",
"<p>12日ごとに<b>季節</b>が変わります（春→夏→秋→冬）。画面の上に、今の季節と今日の天気が出ます。</p><ol><li>その季節が<b>旬</b>の魚は、よく釣れて、売値も+15%。市場タブの相場に「旬」と出ます</li><li>毎日2時間の<b>満潮</b>があり、その間はアタリが早く、珍しい魚が寄りやすくなります（時間帯は日によって変わります）</li><li>天気は毎朝変わります。<b>くもり</b>はアタリが早い。<b>雨</b>は珍しい魚が寄りやすいが、糸が切れやすい</li></ol><p>旬の魚を狙って釣り、旬のうちに売ったり、加工したりすると得です。</p>":"<p>The <b>Season</b> changes every 12 days (Spring → Summer → Autumn → Winter). The current Season and today's Weather show at the top of the screen.</p><ol><li>Fish that are <b>in season</b> bite more often and sell for +15%. They're marked \"In season\" in the Market prices in the Market tab</li><li>Every day has a 2-hour <b>High tide</b>, when bites come faster and rare fish are drawn in more easily (the time varies by day)</li><li>Weather changes every morning. <b>Cloudy</b> means faster bites. <b>Rain</b> draws in rare fish more easily, but the line snaps more easily</li></ol><p>Aim for in-season fish, and sell or process them while they're in season for extra profit.</p>",
"支店":"Branches",
"<p><span class=\"k\">街</span>タブの<b>支店</b>で、海域ごとに支店を出せます（各4段階）。その海域の魚が<b>産地ブランド</b>として、売値+6%／Lv で売れます。毎晩の維持費が少し増えます。</p>":"<p>In the <span class=\"k\">Town</span> tab, you can open a <b>Branch</b> in each Waters (4 levels each). Fish from those Waters sell as a <b>regional brand</b> for +6% Sale price per Lv. Your nightly Upkeep goes up a little.</p>",
"研究開発":"Research & Development",
"<p><span class=\"k\">街</span>タブの<b>研究所</b>で、お金を投じて恒久的な強化ができます（各5段階）。</p><ul><li>冷凍技術：売れ残りの鮮度が落ちにくい</li><li>省エネ船：船の維持費が減る</li><li>流通網：魚の売値アップ</li><li>漁具改良：巻き上げが速く、テンションが上がりにくい</li><li>人材育成：従業員が早くレベルアップ</li><li>加工技術：加工賃が減り、加工品が高く売れる</li></ul>":"<p>In the <span class=\"k\">Town</span> tab, the <b>Lab</b> lets you invest money in permanent upgrades (5 levels each).</p><ul><li>Freezing Tech: unsold fish lose Freshness more slowly</li><li>Eco Boat: lower Boat Upkeep</li><li>Distribution Network: higher fish Sale price</li><li>Gear Upgrades: faster reeling, and Tension rises more slowly</li><li>Crew Training: Crew level up faster</li><li>Processing Tech: lower processing fees, and processed goods sell for more</li></ul>",
"養殖":"Fish Farming",

// 英語表示のとき、画面に出た魚などの名前（保存データのIDになっている日本語）を英語に置き換える
if(LANG==='en'){
  const ks=Object.keys(NAMES).sort((a,b)=>b.length-a.length),re=ks.length?new RegExp(ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'):null;
  const JPX=/[ぁ-んァ-ヶ一-龠、。（）・：！？　～]/,FWM={'、':', ','。':'. ','（':' (','）':')','・':' · ','：': ': ','！':'!','？':'?','　':' ','～':'~'};
  // 名前の置き換えと、全角の記号（、。（）・：！？）の英語の記号への置き換え
  const fix=v=>{if(!JPX.test(v))return v;let w=re?v.replace(re,m=>NAMES[m]):v;w=w.replace(/[、。（）・：！？　～]/g,m=>FWM[m]);return w.replace(/ {2,}/g,' ').replace(/ ([,.!?:)])/g,'$1').replace(/\( /g,'(')};
  const AT=['alt','title','aria-label'];
  const walkN=n=>{
    if(n.nodeType===3){const v=n.nodeValue,w=fix(v);if(w!==v)n.nodeValue=w}
    else if(n.nodeType===1){if(n.tagName==='SCRIPT'||n.tagName==='STYLE')return;AT.forEach(a=>{const v=n.getAttribute(a);if(v){const w=fix(v);if(w!==v)n.setAttribute(a,w)}});n.childNodes.forEach(walkN)}
  };
  if(re)document.addEventListener('DOMContentLoaded',()=>{
    walkN(document.body);
    const proc=ms=>ms.forEach(m=>{if(m.type==='childList')m.addedNodes.forEach(walkN);else walkN(m.target)});
    const ob=new MutationObserver(proc);
    ob.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:AT});
    window.i18nFlush=()=>proc(ob.takeRecords());   // テスト用：保留中の置き換えを、いますぐ行う
  });
}
function T(k,a){

}

// p が小さいほど優先。「すぐできること」を先に、そのあとに「少し先の目標」を、最大3つ出す
function goalList(){
  const g=[],add=(p,ic,t,tab,pct)=>g.push({p,ic,t,tab,pct});
  if(G.home)add(0,'🌙',T("夜です。自宅で休んで、朝を迎えよう"),'home');
  const b=G.boat<BOATS.length?BOATS[G.boat]:null;
  if(b&&G.money>=b.c)add(1,'⛵',T("「{1}」を買えます！（{2}に出られる）",[b.n,AREAS[G.boat+1].name]),'home');
  if(dailyReady())add(1,'🎁',T("デイリーボーナスを受け取れます"),'town');
  if(feat('tour')&&isTourDay()&&!G.home&&!tourIn())add(1,'🏆',T("今日は釣り大会！ 参加は街タブから"),'town');
  if(feat('orders')){const n=G.ord.filter(o=>G.fish.filter(f=>ordMatch(o,f)).length>=o.q).length;if(n)add(1,'📦',T("注文を{1}件、納品できます（売値の{2}倍）",[n,ordMul().toFixed(1)]),'sell')}
  if(!G.home&&G.fish.length>=cap()-1&&!G.autoSell)add(1,'🐟',T("魚箱がいっぱいです（{1}/{2}）。市場で売ろう",[G.fish.length,cap()]),'sell');
  if(G.bp>0)add(2,'💪',T("BPが{1}あります。ステータスに振り分けよう",[G.bp]),'stat');
  if(feat('missions')){ensureMissions();const left=G.msn.items.filter(m=>!m.done).length;if(left)add(3,'✅',T("今日のミッション あと{1}つ",[left]),'town')}
  if(b&&G.money<b.c)add(4,'⛵',T("次の船「{1}」まで あと{2}",[b.n,yen(b.c-G.money)]),'home',G.money/b.c*100);
  const l=areaSp(G.area),rem=l.filter(s=>!G.dex[s.n]).length;
  if(rem>0&&rem<=4)add(4,'📖',T("{1}のコンプまで あと{2}種",[AREAS[G.area].name,rem]),'dex',(l.length-rem)/l.length*100);
  if(norenReady())add(3,'🏮',T("のれん分けができます（街タブ）。のれんで永続の強化！"),'town');
  if(G.comp[G.area]&&!G.bossGot[G.area])add(4,'🐉',T("{1}が、釣りの最中にまれに現れます",[bossOf(G.area).n]),null);
  if(G.crew<crewMax()){const c=hireCost(1);if(G.money>=c)add(5,'🧑',T("従業員を雇えます（水揚げが増えます）"),'home')}
  const nf=FEATS.find(f=>!feat(f.k));if(nf)add(6,'🔓',`${nf.n}：${nf.h}`,null);
  const ri=rankIdx(),nr=RANKS[ri+1];if(nr)add(7,'🎖️',T("次のランク「{1}」まで あと{2}",[nr[1],yen(nr[0]-G.earned)]),null,(G.earned-RANKS[ri][0])/(nr[0]-RANKS[ri][0])*100);
  return g.sort((a,b)=>a.p-b.p).slice(0,3);
}

function dcAdd(k,n){if(!G.dc)G.dc={};G.dc[k]=(G.dc[k]||0)+n}
function newMissions(){
  const pool=[()=>{const t=[6,10,14][Math.floor(Math.random()*3)];return{k:'catch',n:T("魚を{1}匹釣る",[t]),t}},
    ()=>{const t=Math.round(tourBase()*[10,18,26][Math.floor(Math.random()*3)]/10)*10;return{k:'sold',n:T("魚を合計{1}分、売る",[yen(t)]),t}},
    ()=>({k:'rare',n:T("珍しい魚（レア以上）を1匹釣る"),t:1})];
  if(feat('orders'))pool.push(()=>({k:'ord',n:T("注文を1件納品する"),t:1}));
  const items=[],pick=pool.slice();
  for(let i=0;i<3&&pick.length;i++){const m=pick.splice(Math.floor(Math.random()*pick.length),1)[0]();m.r=[{auto:1},{meal:1},{auto:1}][i];m.done=0;items.push(m)}
  return items;
}
function ensureMissions(){if(G.msn.day!==G.day){G.msn={day:G.day,items:newMissions(),bonus:0};G.dc={}}}
function checkMsn(){
  if(!feat('missions'))return;ensureMissions();
  const got=[];G.msn.items.forEach(m=>{if(!m.done&&dcN(m.k)>=m.t){m.done=1;G.msnDone++;G.bp+=m.r.bp||0;G.tk.auto+=m.r.auto||0;G.tk.meal+=m.r.meal||0;got.push(m)}});
  if(G.msn.items.length&&G.msn.items.every(m=>m.done)&&!G.msn.bonus){G.msn.bonus=1;G.bp+=1;G.tk.auto+=1;toast(T("🎉 今日のミッションを全部達成！ BP+1・おまかせ釣り券×1"));sfx(3);save()}
  else if(got.length){toast(T("ミッション達成：{1}（{2}）",[got.map(m=>m.n).join('、'),achRw(got[0].r)]));sfx(2);save()}
}

}

/* ---------- price ---------- */
const sizeRatio=(sp,sz)=>clamp((sz-sp.min)/(sp.max-sp.min),0,1);
const sizeMul=(sp,sz)=>{const r=sizeRatio(sp,sz);return .7+.8*r+(r>=.9?.2:0)};
function price(fi,sat){
  const sp=SP.find(s=>s.n===fi.n);
  const big=sizeMul(sp,fi.size),sv=sat===undefined?(G.sat[fi.n]||0):sat;
  return Math.round(fi.size*sp.p*G.mult[fi.n]*(1-sv)*(fi.fresh/100)*(fi.v?VAR_PRICE:1)*(fi.g===1?FEMALE_PRICE:1)*(inSeason(sp)?SEA_PRICE:1)*(1+.06*brLv(sp.a))*(1+.05*Math.min(8,G.lv.mkt)+.025*Math.max(0,G.lv.mkt-8)+perks().sell/100+salesBonus()+.03*techLv('dist')+Math.min(.3,.003*sx('biz'))+(G.comp[sp.a]?.05:0)+mealFx('sell')+evSell()+(petFx().sell||0))*big);
}
// 経営：需給（同じ魚を売るほど値崩れ）と、出荷先（卸売市場／直売所）、収支の記録
const SAT_STEP=.03,SAT_MAX=.4,STALL_MUL=1.12;
const stallCap=()=>G.lv.mkt>0?3+2*G.lv.mkt:0;
const stallLeft=()=>Math.max(0,stallCap()-G.stall);
function led(k,n){if(n)G.led[k]=(G.led[k]||0)+n}
// 売ったときの内訳を、実際に売らずに試算する。高い魚から順に、直売所の枠→卸売市場へ回す
function quote(idx){
  const sat=Object.assign({},G.sat);let left=stallLeft(),sum=0,stall=0;const rows=[];
  idx.map(i=>({i,f:G.fish[i]})).sort((a,b)=>price(b.f)-price(a.f)).forEach(({i,f})=>{
    const sv=sat[f.n]||0,st=left>0,p=Math.round(price(f,sv)*(st?STALL_MUL:1));
    if(st){left--;stall++}
    sat[f.n]=Math.min(SAT_MAX,sv+SAT_STEP*(st?.5:1));sum+=p;rows.push({i,n:f.n,p,st});
  });
  return{sum,sat,stall,rows};
}

/* ---------- fishing core ---------- */
function pickSpecies(area=G.area,bk=null){
  const list=SP.filter(s=>s.a===area&&!s.boss);
  const bt=G.lv.bait+perks().rare+mealFx('rare')+wxRare()+tideRare()+(petFx().rare||0)+.4*sx('luk');
  const ws=list.map(s=>s.w*(s.w<=12?1+.25*bt:1)*(inSeason(s)?SEA_WEIGHT:1)*(bk&&baitOf(s).k===bk?BAIT_MUL:1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}
  return list[0];
}
function say(t){$('#msg').textContent=t}
function press(){
  if(veilOpen())return;
  if(G.home){toast(T("夜です。自宅で休んで朝を迎えよう"));openTab('home');return}
  switch(S.st){
    case'idle':
      if(G.fish.length>=cap()){if(G.autoSell&&G.fish.length){sell(G.fish.map((_,i)=>i));toast(T("魚箱がいっぱいなので自動で売りました"))}else{say(T("魚箱がいっぱい。市場で売ろう。"));return}}
      S.bk=null;if(G.baitSel&&G.bt[G.baitSel]>0){G.bt[G.baitSel]--;S.bk=G.baitSel;if(!G.bt[G.baitSel])toast(T("{1}を使い切りました（街の釣具店で買えます）",[BAITS.find(b=>b.k===G.baitSel).n]))}
      S.st='wait';S.t=rnd(1.2,3.5)/(1+.2*G.lv.bait+.03*sx('agi'))*wxWait()*tideWait();say(T("浮きを見守ろう…"));break;
    case'wait':
      S.st='idle';say(T("早すぎた。仕掛けを引き上げた。"));break;
    case'bite':hook();break;
    case'fight':S.holding=true;break;
    case'result':if(S.t>.6)next();break;
  }
  label();
}
function release(){S.holding=false}
const bossChance=()=>Math.min(.08,.03*(1+.04*sx('luk')+.1*perks().rare));
function rollFish(){
  const bs=bossOf(G.area);
  const sp=(bs&&G.comp[G.area]&&Math.random()<bossChance())?bs:pickSpecies(G.area,S.bk);
  S.sp=sp;S.size=Math.round(sp.min+(sp.max-sp.min)*Math.pow(Math.random(),Math.max(1.1,1.8-.015*sx('luk'))));S.tier=tier(sp);
  S.v=!sp.boss&&Math.random()<variantChance()?1:0;S.dsp=S.v?vSp(sp):sp;S.g=rndG();
  S.leg=sp.boss&&legOk(sp.a)&&Math.random()<.5?1:0;
}
const newFight=(sp,size)=>({pw:sp.s*(.8+.4*(size-sp.min)/(sp.max-sp.min))*(1+.2*sp.a)*lapDiff(),prog:sp.boss?25:35,tens:0,struggle:false,flip:1,timer:rnd(.6,1.2)});
function hook(){
  const sp=S.sp;

// 釣りの計算本体。ゲームの進行と、診断用の試算の両方から使う。o で装備・ステータスを仮に変えられる。
function fightEnv(o){o=o||{};return{rod:o.rod??G.lv.rod,line:o.line??G.lv.line,pk:perkWithMeal(),eas:G.catches<10?.5:G.catches<30?.75:1,str:o.str??sx('str'),vit:o.vit??sx('vit'),dex:o.dex??sx('dex'),foc:o.foc??sx('foc'),diff:DIFF[G.diff]*evDiff()*wxDiff()*(petFx().diff||1)}}

function stepFight(f,holding,dt,sp,E){
  const pe=f.pw<=3?f.pw:3+(f.pw-3)*.6,bs=sp.boss?sp.a:0,eas=E.eas,pk=E.pk;
  f.timer-=dt;f.flip+=((f.struggle?-1:1)-f.flip)*Math.min(1,dt*9);
  if(f.timer<=0){f.struggle=!f.struggle;f.timer=f.struggle?rnd(.6,1.4)*(1+.08*bs)*(1-Math.min(.35,.012*(E.foc||0))):rnd(.8,1.8)*(sp.boss?Math.max(.4,1-.08*bs):1)}
  if(holding){
    f.prog+=16*(1+.3*E.rod+pk.reel/100)*(1+.04*E.str)*(eas<1?1.25:1)/(.5+.5*pe)*(f.struggle?.3:1)*dt;
    f.tens+=(f.struggle?60:20)*(.6+.4*pe)*eas*(1-pk.tens/100)*(1-Math.min(.6,.025*E.vit))*E.diff/(1+.25*E.line)*dt;
  }else{

function fightStep(dt){

  else if(r===1){landed()}

// 「平均的な操作（反応が少し遅く、ときどきミスする）」で何割釣れるかを試算する
function botFight(f,sp,E){
  const hist=[];let t=0,lapse=0,res=0;
  while(!res&&t<90){
    hist.push(f.struggle);const seen=hist.length>27?hist[hist.length-28]:false;
    let hold=!seen&&f.tens<58;
    if(lapse>0){lapse--;hold=!hold}else if(Math.random()<.012)lapse=14;
    res=stepFight(f,hold,1/60,sp,E);t+=1/60;
  }
  return res;
}

    const size=Math.round(sp.min+(sp.max-sp.min)*Math.pow(Math.random(),Math.max(1.1,1.8-.015*sx('luk'))));
    if(botFight(newFight(sp,size),sp,E)===1)ok++;
  }
  return ok/n;
}

/* ---------- fish art ---------- */
function drawFish(c,x,y,L,d){
  const [body,belly,shape,pat,pc,ex]=d,rx=L/2,ry=L/2*{a:.26,b:.34,r:.5,f:.55,l:.13,t:.3}[shape];
  c.save();c.translate(x,y);
  c.fillStyle=body;
  c.beginPath();c.moveTo(rx*.8,0);c.lineTo(rx*1.3,-ry*1.2-1);c.lineTo(rx*1.1,0);c.lineTo(rx*1.3,ry*1.2+1);c.closePath();c.fill();
  if(ex==='ribbon'){c.fillStyle=pc;c.fillRect(-rx*.7,-ry*2.6,rx*1.7,ry*1.8)}
  else{c.beginPath();c.moveTo(-rx*.25,-ry*.85);c.quadraticCurveTo(rx*.1,-ry*1.8,rx*.5,-ry*.8);c.closePath();c.fill()}
  if(ex==='bill'){c.beginPath();c.moveTo(-rx*.85,-ry*.2);c.lineTo(-rx*1.55,0);c.lineTo(-rx*.85,ry*.2);c.closePath();c.fill()}
  const g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,body);g.addColorStop(.55,body);g.addColorStop(1,belly);
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);c.fill();
  c.save();c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);c.clip();c.fillStyle=c.strokeStyle=pc||body;
  if(pat==='s')for(let i=-1;i<=3;i++)c.fillRect(rx*(-.25+i*.22),-ry,rx*.08,ry*2);
  else if(pat==='h')c.fillRect(-rx,-ry*.12,rx*2,Math.max(1.5,ry*.2));
  else if(pat==='w'){c.lineWidth=Math.max(1,ry*.14);for(let i=0;i<6;i++){c.beginPath();c.moveTo(-rx*.4+i*rx*.18,-ry);c.lineTo(-rx*.32+i*rx*.18,-ry*.2);c.lineTo(-rx*.4+i*rx*.18,ry*.1);c.stroke()}}
  else if(pat==='p')for(let i=0;i<10;i++){c.beginPath();c.arc(Math.sin(i*2.3)*rx*.65,Math.cos(i*3.1)*ry*.6,Math.max(1,ry*.11),0,7);c.fill()}
  c.restore();
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(-rx*.1,ry*.25,rx*.18,ry*.14,.5,0,7);c.fill();
  const er=Math.max(2,ry*(ex==='bigeye'?.36:.22));
  c.fillStyle='#fff';c.beginPath();c.arc(-rx*.6,-ry*.15,er,0,7);c.fill();
  c.fillStyle='#111';c.beginPath();c.arc(-rx*.62,-ry*.15,er*.55,0,7);c.fill();
  c.restore();
}

const Cloud={kind:'claude',user:null,db:null,uid:null,dev:null,status:'checking',err:'',lastPush:0,dirty:false,busy:false,timer:0,remote:null};

function devId(){try{let d=localStorage.getItem('umikaze-dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem('umikaze-dev',d)}return d}catch(e){return 'nodev'}}

const fmtTime=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};

  async remove(){if(useApp())return AppCloud.remove();await Cloud.db.doc(`data/users/${Cloud.uid}/save`).delete()},
  async getShared(k){const s=await Cloud.db.doc('transfer/'+k).get();return s.exists?s.data():null},
  async putShared(k,d){await Cloud.db.doc('transfer/'+k).set(d)},

// 同期の目印：進み具合が変わると変わる文字列。「前回の同期から、この端末が変わったか」を調べるのに使う
const sig=o=>[o.earned,o.catches,o.day,o.min,o.level,o.exp,o.money].join('|');
const docHas=d=>!!d&&((d.day||1)>1||(d.lv||1)>1||(d.earned||0)>0);
// クラウドのデータ a と、この端末のデータ b の、進み具合を比べる（a が進んでいれば正、遅れていれば負）
function cmpProg(a,b){
  if(a.earned!==undefined&&a.earned!==b.earned)return a.earned>b.earned?1:-1;
  const al=a.lv||1,bl=b.level||1;if(al!==bl)return al>bl?1:-1;
  const ad=a.day||1,bd=b.day||1;if(ad!==bd)return ad>bd?1:-1;
  return 0;
}
// 上書きされるデータを、1つだけ端末の中に控える（何も進んでいないデータは控えない）
const BKEY='umikaze-fishery-backup';
const hasProgressOf=o=>(o.catches||0)>0||(o.day||1)>1||(o.earned||0)>0;
function makeBackup(o,from,reason){
  try{if(!o||!hasProgressOf(o))return;localStorage.setItem(BKEY,JSON.stringify({at:Date.now(),from,reason,json:JSON.stringify(o),lv:o.level,day:o.day,money:o.money}))}catch(e){}
}
function getBackup(){try{return JSON.parse(localStorage.getItem(BKEY))}catch(e){return null}}
async function cloudPush(force){
  if(!Cloud.db||Cloud.busy)return false;
  if(!force&&!Cloud.dirty)return true;
  Cloud.busy=true;let ok=false,redo=false;
  try{
    // 自動の保存では、書き込む前に「他の端末が先に進めていないか」を確かめる（上書きで進み具合を失わないため）
    if(!force){
      const d=await Remote.get();
      if(d&&docHas(d)&&d.savedAt!==G.syncAt&&d.sig!==sig(G)&&!(d.dev===Cloud.dev&&!G.syncAt))redo=true;
    }
    if(!redo){
      const s=sig(G),at=Date.now();
      await Remote.put({json:JSON.stringify(G),savedAt:at,dev:Cloud.dev,v:1,lv:G.level,day:G.day,money:G.money,earned:G.earned,sig:s});
      G.syncAt=at;G.syncSig=s;try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}
      Cloud.dirty=false;Cloud.lastPush=at;Cloud.status='ready';Cloud.err='';ok=true;
    }
  }catch(e){Cloud.status='error';Cloud.err=(e&&e.code)||''}
  Cloud.busy=false;renderCloudCard();
  if(redo){try{await cloudDecide()}catch(e){}}
  return ok;
}
// ゲームを保存するたびに呼ばれる。15秒に1回までまとめて送る
function cloudDirty(){
  try{
    if(!Cloud.db||!hasProgress()||G.syncSig===sig(G))return;
    Cloud.dirty=true;
    if(!Cloud.timer)Cloud.timer=setTimeout(()=>{Cloud.timer=0;cloudPush(false)},15000);
  }catch(e){}
}

// クラウドと端末を比べて、読み込む・保存する・聞く、のどれかを行う（起動時・ログイン直後・画面に戻ったとき）
// 戻り値: 'none'(クラウドにデータなし) 'synced'(同じ) 'loaded'(読み込んだ) 'pushed'(保存した) 'asked'(確認を出した) 'error'
async function cloudDecide(){
  const d=await Remote.get();
  Cloud.status='ready';
  if(!docHas(d)){if(hasProgress()){await cloudPush(true);return 'pushed'}return 'none'}
  Cloud.lastPush=d.savedAt;
  const mine=sig(G);
  if(!G.syncAt&&d.dev===Cloud.dev)G.syncAt=d.savedAt;   // 前の版で、この端末が保存したもの
  if(d.sig===mine){G.syncAt=d.savedAt;G.syncSig=mine;return 'synced'}
  if(!hasProgress())return autoLoad(d)?'loaded':'error';  // 新しい端末：確認なしで読み込む
  const changed=d.savedAt!==G.syncAt,dirty=G.syncSig!==mine,c=cmpProg(d,G);
  if(!changed){if(dirty){await cloudPush(true);return 'pushed'}return 'synced'}
  if(!dirty&&c>=0)return autoLoad(d)?'loaded':'error';  // この端末は変えていない＋クラウドが進んでいる：確認なしで読み込む
  if(dirty&&c<0){await cloudPush(true);return 'pushed'}  // この端末のほうが進んでいる：保存する
  askRestore(d,'conflict');return 'asked';                // 進みが逆転している・両方が進んでいる：聞く
}

function newCode(){const a=new Uint32Array(8);crypto.getRandomValues(a);let c='';a.forEach(v=>c+=CODE_CH[v%CODE_CH.length]);return c.slice(0,4)+'-'+c.slice(4)}

  $('#p-set').innerHTML=T("<h2>文字の大きさ</h2><div class=\"row\" style=\"margin-top:0\">{1}</div><p class=\"hint\">選ぶと、画面全体の文字が大きくなります。</p>\n    <h2>表示と音</h2><div class=\"list\">{2}</div>\n    <h2>難易度</h2><div class=\"row\" style=\"margin-top:0\">{3}</div><p class=\"hint\">釣りのときのテンションの上がりやすさが変わります。（かんたん：×0.8／ふつう：×1／むずかしい：×1.3）</p>\n    <h2>遊び方</h2><button class=\"ghost\" id=\"setHelp\">遊び方をもう一度見る</button>\n    <h2>これまでの記録</h2><div class=\"card\"><div class=\"kv\"><span>プレイ日数</span><b class=\"num\">{4}日</b><span>釣った魚</span><b class=\"num\">{5}匹</b><span>累計売上</span><b class=\"num\">{6}</b><span>図鑑</span><b class=\"num\">{7}/{8}</b><span>レベル</span><b class=\"num\">Lv.{9}</b></div></div>\n    <h2>データの引き継ぎ（機種変更）</h2>{10}\n    <details style=\"margin-top:6px\"><summary style=\"cursor:pointer;color:var(--sub)\">その他の方法（文字列で書き出し・読み込み）</summary>\n      <textarea id=\"exp\" readonly aria-label=\"書き出したデータ\" style=\"margin-top:8px\"></textarea><div class=\"row\"><button class=\"ghost\" id=\"expCopy\">データを書き出してコピー</button></div>\n      <textarea id=\"imp\" placeholder=\"ここに書き出したデータを貼り付け\" aria-label=\"読み込むデータ\" style=\"margin-top:12px\"></textarea><div class=\"row\"><button class=\"ghost\" id=\"impGo\">読み込む</button></div></details>\n    <h2>データ</h2><button class=\"ghost\" id=\"reset\">最初からやり直す</button>",[fz,tg,df,G.day,G.catches,yen(G.earned),got,NORM.length,G.level,cloudSection()]);
  const q=$('#p-set');
  q.insertAdjacentHTML('afterbegin',`<h2>言語 / Language</h2><div class="row" style="margin-top:0"><button class="chip" data-lang="ja" aria-pressed="${LANG==='ja'}">日本語</button><button class="chip" data-lang="en" aria-pressed="${LANG==='en'}">English</button></div>`);
  q.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  q.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const k=b.dataset.tg;G[k]=G[k]?0:1;applyUi();save();renderSet();if(k==='mute'&&!G.mute)sfx(0)});
  q.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{G.fs=+b.dataset.fs;applyUi();save();renderSet()});
  renderCloudCard();
  bindCloud();
  q.querySelectorAll('[data-df]').forEach(b=>b.onclick=()=>{G.diff=+b.dataset.df;save();renderSet()});
  $('#setHelp').onclick=()=>{if(S.st==='idle'||S.st==='result')showHelp(0);else toast(T("釣りの合間に開いてね"))};
  $('#expCopy').onclick=()=>{const t=JSON.stringify(G),ta=$('#exp');ta.value=t;ta.select();
    try{navigator.clipboard.writeText(t).then(()=>toast(T("コピーしました")),()=>toast(T("選択しました。コピーしてください")))}catch(e){toast(T("選択しました。コピーしてください"))}};
  $('#impGo').onclick=()=>{let o=null;try{o=migrate(JSON.parse($('#imp').value.trim()))}catch(e){}
    if(!o){toast(T("読み込めませんでした。データを確かめてください"));return}
    applySave(o,T("文字列を読み込む前"));cloudPush(true);toast(T("読み込みました"))};
  $('#reset').onclick=function(){if(this.dataset.arm){makeBackup(G,'local',T("最初からやり直す前"));G=fresh();S.st='idle';CREW.length=0;applyUi();save();label();say('');renderAll();openTab('fish');toast(T("最初からやり直します"));if(Cloud.db)Remote.remove().then(()=>{Cloud.dirty=false;Cloud.lastPush=0;renderCloudCard()},()=>{});if(!G.seen)showHelp(0)}else{this.dataset.arm=1;this.textContent=T("本当に消す？もう一度押すと確定")}};
}

function hint(){
  const el=$('#hint'),a=G.area,l=areaSp(a),f=l.filter(s=>G.dex[s.n]).length;
  let t=G.comp[a]?(G.bossGot[a]?T("<b>{1}は制覇済み。</b>主は倒した。{2}",[AREAS[a].name,legOk(a)?T("<b>伝説の主</b>が、まれに姿を見せる…"):T("それでも低確率で、また姿を見せる…")]):T("<b>{1}を制覇！</b> 低確率で<b>主</b>が現れます。とても強いので、準備を整えて挑もう。",[AREAS[a].name]))
    :T("{1}の図鑑 <b class=\"num\">{2}/{3}</b>。全種類釣るとコンプボーナス（祝い金・BP・売値+5%）。さらに<b>主</b>が現れます。",[AREAS[a].name,f,l.length]);
  if(G.boat<BOATS.length){
    const b=BOATS[G.boat],n=AREAS[G.boat+1].name;
    t+=`<br>${G.money>=b.c?T("<b>{1}が買えます！</b> 「自宅・設備」タブの「船」で買うと{2}に出られます。",[b.n,n]):T("{1}へは「自宅・設備」タブの「船」で{2}（{3}）を買うと行けます。あと<b class=\"num\">{4}</b>。",[n,b.n,yen(b.c),yen(b.c-G.money)])}`;
  }
  el.innerHTML=t;el.hidden=false;
}
const HELP=[
 {t:T("ようこそ！"),b:T("<p>魚を釣って、売って、船と仲間を増やす釣り船経営ゲームです。</p><p>目標は、売上を増やして最高ランク「漁業王」になること。まずは釣りから始めましょう。</p>")},
 {t:T("釣り方"),b:T("<ol><li><span class=\"k\">投げる</span>を押して浮きを待つ</li><li>浮きが沈んで「！」が出たら、すぐ<span class=\"k\">アワセ！</span></li><li>ヒットしたら<span class=\"k\">巻く</span>ボタンを押し続けて寄せる</li><li>魚が暴れている間は<b>指を離す</b>。落ち着いたらまた巻く</li></ol><p>テンションが満タンになると糸が切れ、寄せ具合が満タンになると釣れます。パソコンならスペースキーでも操作できます。</p>")},
 {t:T("魚を売る"),b:T("<p>釣った魚は魚箱に入ります（容量があります）。<span class=\"k\">市場</span>タブで売ってお金にしましょう。</p><p>値段は、大きさ（★の数）・鮮度・今日の相場で決まります。大きい魚ほど高く売れ、経験値も多くもらえます。売れ残りは夜のたびに鮮度が落ちるので、早めに売るのがおすすめです。</p><p>同じ魚を続けて売ると<b>値崩れ</b>します（翌朝には半分もどる）。直売所を強化すると、1日に数匹だけ高く売れる<b>直売所の枠</b>が使えます。「すべて売る」は、高い魚から順に自動で有利な出荷先へ回します。</p>")},
 {t:T("経営レポート"),k:'report',b:T("<p><span class=\"k\">市場</span>タブの<b>経営レポート</b>で、今日の収支・直近7日の収入と経費・稼ぎ頭の魚を確認できます。夜の終了画面にも、その日の収支が出ます。</p>")},
 {t:T("ライバル漁師"),k:'tour',b:T("<p><span class=\"k\">街</span>タブに、ライバル漁師5人との<b>週間売上</b>ランキングがあります。1週間の収入（売上・水揚げ・賞金・納品）が多いほど上位です。</p><p>7日ごとの夜に発表され、<b>3位まで</b>にBPと評判、<b>1位</b>はおまかせ釣り券もらえます。</p>")},
 {t:T("釣り大会"),k:'tour',b:T("<p>7日ごとに<b>釣り大会</b>が開かれます。<span class=\"k\">街</span>タブから、その日の朝に参加できます（参加費あり）。</p><ol><li>参加した日に、<b>自分で釣った魚</b>のうち、いちばん高い1匹の値段で競います（おまかせ釣り・従業員・主は対象外）</li><li>夜にライバル5人とのランキングが発表され、<b>3位まで賞金</b>、1位はおまかせ釣り券ももらえます</li><li>旬の魚や、大物を狙うと有利です</li></ol>")},
 {t:T("ミッション"),k:'missions',b:T("<p><span class=\"k\">街</span>タブに、毎朝<b>3つのミッション</b>が出ます（魚を釣る・売る・レア魚・注文の納品など）。達成するたびに、おまかせ釣り券・食事券・BPがもらえます。3つ全部達成すると、さらにボーナスです。</p>")},
 {t:T("相棒（ペット）"),k:'pet',b:T("<p><span class=\"k\">街</span>タブの<b>相棒（ペット）</b>を仲間にすると、連れている1匹の効果がもらえます（ネコ：魚が逃げにくい／ウミネコ：経験値+5%／ラッコ：売値+3%／ウミガメ：珍しい魚が寄りやすい）。</p>")},
 {t:T("模様替え"),k:'deco',b:T("<p><span class=\"k\">自宅・設備</span>タブの<b>模様替え</b>で、自宅の風景に飾りを足せます（見た目だけ）。</p>")},
 {t:T("漂流物・宝箱"),k:'treasure',b:T("<p>釣りの合間に、ときどき<b>漂流物や宝箱</b>が流れ着きます（約25回に1回）。お金・おまかせ釣り券・食事券・BPのどれかがもらえ、たまに大当たりも。</p>")},
 {t:T("エサ・ルアー"),k:'bait',b:T("<p>魚には<b>好物のエサ</b>があります（図鑑や注文に表示）。<span class=\"k\">街</span>タブの<b>釣具店</b>で10個入りを買い、「使う」にすると、1投ごとに1個使って、好物の魚が2.5倍よく釣れます。</p><p>注文や釣り大会で狙う魚が決まっているときに便利です。</p>")},
 {t:T("季節と天気"),k:'season',b:T("<p>12日ごとに<b>季節</b>が変わります（春→夏→秋→冬）。画面の上に、今の季節と今日の天気が出ます。</p><ol><li>その季節が<b>旬</b>の魚は、よく釣れて、売値も+15%。市場タブの相場に「旬」と出ます</li><li>毎日2時間の<b>満潮</b>があり、その間はアタリが早く、珍しい魚が寄りやすくなります（時間帯は日によって変わります）</li><li>天気は毎朝変わります。<b>くもり</b>はアタリが早い。<b>雨</b>は珍しい魚が寄りやすいが、糸が切れやすい</li></ol><p>旬の魚を狙って釣り、旬のうちに売ったり、加工したりすると得です。</p>")},
 {t:T("支店"),k:'branch',b:T("<p><span class=\"k\">街</span>タブの<b>支店</b>で、海域ごとに支店を出せます（各4段階）。その海域の魚が<b>産地ブランド</b>として、売値+6%／Lv で売れます。毎晩の維持費が少し増えます。</p>")},
 {t:T("研究開発"),k:'tech',b:T("<p><span class=\"k\">街</span>タブの<b>研究所</b>で、お金を投じて恒久的な強化ができます（各5段階）。</p><ul><li>冷凍技術：売れ残りの鮮度が落ちにくい</li><li>省エネ船：船の維持費が減る</li><li>流通網：魚の売値アップ</li><li>漁具改良：巻き上げが速く、テンションが上がりにくい</li><li>人材育成：従業員が早くレベルアップ</li><li>加工技術：加工賃が減り、加工品が高く売れる</li></ul>")},
 {t:T("養殖"),k:'farm',b:T("<p><span class=\"k\">自宅・設備</span>タブで<b>養殖いかだ</b>を建てると、魚を預けて育てられます。</p><ol><li><span class=\"k\">市場</span>タブの魚の下の「養殖いかだで育てる」で預ける（主は不可）</li><li>毎日少しずつ大きくなる（最大サイズまで）。飼料代は毎晩、魚の値段の3%</li><li>「引き上げる」で魚箱にもどせます。大きくなった魚は高く売れ、注文のサイズ条件も満たせます</li></ol>")},
 {t:T("のれん分けと伝説の主"),k:'noren',b:T("<p>ランク「漁業王」になると、<span class=\"k\">街</span>タブで<b>のれん分け</b>ができます。</p><ol><li>財産（お金・船・設備・従業員・ランクなど）を手放して、最初からやり直します</li><li>代わりに<b>のれん</b>をもらい、売値・経験値・はじめの資金・魚箱・色違いの運を<b>永続</b>で強化できます</li><li>図鑑・実績・主の記録・レベルとステータスは、のこります</li><li>周回のたびに、魚の引きが少し強くなります</li></ol><p>主を倒した海域には、さらに強い<b>伝説の主</b>がまれに現れます。海域ごとに1周に1体、倒すと大きなボーナスとのれん+4です。</p>")},
 {t:T("加工場"),k:'plant',b:T("<p><span class=\"k\">自宅・設備</span>タブで<b>加工場</b>を建てると、魚を加工品にできます。</p><ol><li><span class=\"k\">市場</span>タブの魚の下にある「干物にする」「缶詰にする」を押す（加工賃は売値の8%）</li><li>夜を越すと完成（干物1晩・缶詰2晩）。市場タブの「加工品をすべて売る」で売れます</li><li>干物は売値×1.3、缶詰は×1.6。完成した加工品は<b>腐らず</b>、相場や値崩れの影響を受けません</li><li>1晩に加工できる数は、加工場のレベルで増えます</li></ol>")},
 {t:T("実績"),k:'ach',b:T("<p><span class=\"k\">図鑑</span>タブの下に<b>実績</b>の一覧があります。条件を満たすと自動で解除され、<b>BP・おまかせ釣り券・食事券</b>がもらえます。</p>")},
 {t:T("注文"),k:'orders',b:T("<p><span class=\"k\">市場</span>タブに、常連さんからの<b>注文</b>が毎朝届きます（最大3件・期限は2日）。</p><ol><li>「アジ×3匹・25cm以上・鮮度70%以上」のように条件があります</li><li>魚箱に条件に合う魚がそろったら<b>納品</b>。<b>売値の1.3倍〜</b>で買い取ってもらえます（評判が上がると倍率が増える）</li><li>納品・大会の入賞・主の討伐で<b>評判</b>が上がります。評判が高いと、注文の報酬・注文の件数・融資の上限が増えます</li><li>注文に使える魚は、「すべて売る」では売らずに残します</li><li>鮮度は一晩で落ちます。生け簀があると守れます</li></ol>")},
 {t:T("保険と故障"),k:'bank',b:T("<p>朝に、ときどき<b>船が故障</b>します（約20日に1回）。夜に<b>修理費</b>（船の値段の3%）がかかります。</p><p><span class=\"k\">街</span>タブの<b>船の保険</b>に入ると、修理費が無料になります。保険料は毎晩、船の値段の0.2%です。</p>")},
 {t:T("銀行と船の維持費"),k:'bank',b:T("<p><span class=\"k\">街</span>タブの<b>銀行</b>でお金を借りられます。船や設備を早く買って稼ぎを増やす近道ですが、<b>利息</b>が毎晩かかります（残高の0.8%）。返せるときに返しましょう。借りられる額は、これまでの売上に応じて増えます。</p><p>船には毎晩<b>維持費</b>がかかります（船の値段の0.4%）。</p>")},
 {t:T("毎朝のできごと"),k:'events',b:T("<p>朝、ときどき<b>できごと</b>が起きます：豊漁（水揚げ増）・不漁・荒天（釣りは難しいが売値が上がる）・観光フェア（売値アップ）・大量入荷（売値ダウン）。画面の上に今日のできごとが出ます。</p>")},
 {t:T("従業員を育てる"),k:'roles',b:T("<p><span class=\"k\">自宅・設備</span>タブで従業員を雇えます。1人ずつ名前と役割があります。</p><ol><li><b>釣り師</b>：いっしょに釣りに出て、毎日お金を水揚げする</li><li><b>営業</b>：水揚げはしないが、魚の売値を底上げする（全員で+15%まで）</li><li>役割は、名前の横のボタンで切り替えられる（変更は<b>あしたの朝</b>から）</li><li>働いた日数でレベルが上がる。水揚げも売値ボーナスも増えるが、<b>給料も上がる</b></li><li>一人ひとりに<b>特性</b>があります。気に入らなければ「辞めてもらう」で入れ替えられます</li></ol><p>序盤は釣り師が得、お金がたまってきたら営業を混ぜると売上が伸びます。夜の収支や、市場タブの経営レポートで、人件費の重さを確認しよう。</p>")},
 {t:T("設備を強化する"),b:T("<p><span class=\"k\">自宅・設備</span>タブでお金を使って強化できます。</p><ol><li><b>釣り竿</b>：巻き上げが速くなる</li><li><b>釣り糸</b>：テンションが上がりにくい</li><li><b>エサ</b>：アタリが早く、珍しい魚が寄る</li><li><b>クーラーボックス</b>：魚箱が広がり、鮮度も保てる</li><li><b>漁師を雇う</b>：釣り場でいっしょに釣って稼いでくれる（給料もかかる）</li></ol>")},
 {t:T("新しい海域へ"),b:T("<ol><li><span class=\"k\">自宅・設備</span>タブの「船」で次の船を買うと、新しい海域に出られます</li><li>小型ボート（")+yen(BOATS[0].c)+T("）で沖合、大型漁船（")+yen(BOATS[1].c)+T("）で深海</li><li>さらにクルーザーでサンゴ礁の島、砕氷船で氷海、ムーンクラフトで幻の海域、そのさき（海底火山・沈没船の海域・極夜のオーロラ海・竜宮の海）にも、新しい船で行けます</li><li>買ったら<span class=\"k\">釣り</span>タブの海域ボタンで行き先を選ぶ</li></ol><p>先の海域ほど、高く売れる大きな魚がいます。</p>")},
 {t:T("レアな魚"),b:T("<p>海域ごとに、めったに釣れないレアな魚がいます。<span class=\"tag\" style=\"background:#6cc4ff\">レア</span><span class=\"tag\" style=\"background:#c08cff\">超レア</span><span class=\"tag\" style=\"background:#ffd24a\">伝説</span></p><p>レアな魚がかかると、アタリの時点で気配が違います。釣り上げると派手な演出が出ます。図鑑でまだ釣っていない魚を探しましょう。エサの強化やランクの特典で、珍しい魚が寄りやすくなります。</p>")},
 {t:T("エリアコンプと主"),b:T("<p>海域にいる魚を<b>全種類</b>釣ると<b>コンプボーナス</b>がもらえます（祝い金・BP・その海域の魚の売値+5%）。</p><p>コンプすると、その海域に低確率で<b>主</b>が現れます。主はとても強く、先の海域の主ほど手強くなります。アタリの気配が違うので、準備を整えて挑もう。初めて釣り上げると、討伐ボーナスがもらえます。主は売値も経験値も桁違いです。</p><p>主に逃げられると、<b>どのステータスがどのくらい必要か</b>の目安が表示されます（ステータスタブからも診断できます）。</p>")},
 {t:T("オスとメス"),b:T("<p>釣れた魚には<b>オス（♂）とメス（♀）</b>がいます。メスは<b>売値+5%</b>。注文に「メス指定」「オス指定」が付くこともあります。</p><p><span class=\"k\">図鑑</span>で、同じ種のオスとメスを両方釣ると<b>ペア</b>成立（祝い金）。養殖いかだに<b>オスとメス</b>を入れておくと、一晩で<b>稚魚</b>が生まれることがあります。</p>")},
 {t:T("色違いの魚"),b:T("<p>ごくまれに、いつもと<b>色が違う魚</b>が釣れます。魚ごとに決まった別の色で、<b>売値が4倍</b>、経験値も2倍です（運が高いと出やすい）。</p><p>アタリのときの表示や、釣り上げたときの演出が変わります。<span class=\"k\">図鑑</span>に、色違いを釣った種類が記録されます。</p>")},
 {t:T("レベルとステータス"),b:T("<p>魚を釣ると<b>経験値</b>がもらえ、たまると<b>レベル</b>が上がります（ランクとは別です）。</p><ol><li>レベルが上がると、8つのステータスがランダムに上がる（0〜3ずつ）</li><li>同時に<b>BP</b>が3もらえる</li><li><span class=\"k\">ステータス</span>タブで、BPを好きなステータスに振り分ける</li></ol><p><b>力</b>は巻き上げ、<b>体力</b>はテンション、<b>素早さ</b>はアタリ、<b>器用さ</b>は寄せ戻され、<b>運</b>はレア魚に効きます。</p><p>さらに、<b>集中力</b>は魚の暴れる時間を短くし、<b>商才</b>は売値と給料に、<b>統率力</b>は従業員の水揚げと成長に効きます（8つのステータス）。</p>")},
 {t:T("自宅と施設"),b:T("<p>1日が終わると<b>自宅</b>に帰ります。<span class=\"k\">自宅・設備</span>タブでは、道具・船・漁師・施設が並んでいる様子が見られます。施設や設備もここで買えます。</p><ol><li><b>自宅</b>：大きくすると雇える漁師が増える</li><li><b>生け簀</b>：売れ残りの魚を鮮度そのまま保管</li><li><b>魚拓棚</b>：釣った魚を飾り、経験値ボーナス</li></ol><p>眠ると朝になり、次の日の釣りが始まります。</p>")},
 {t:T("忙しい人のための機能"),b:T("<ol><li><span class=\"k\">街</span>タブの<b>デイリーボーナス</b>で、おまかせ釣り券と食事券が毎日もらえる</li><li><b>おまかせ釣り</b>：券1枚で、5回ぶんの釣りを自動で進める（釣れるかどうかは自分のステータスで決まる）</li><li><b>外食</b>：食堂で食事すると、経験値アップなどの効果が次の12回の釣りの間続く。図鑑に載った魚の種類が増えるほど、<b>メニューが増えて</b>豪華になる</li><li><b>留守中の水揚げ</b>：漁師がいると、アプリを閉じている間もお金を稼いでくれる（最大8時間ぶん）</li><li>設定で<b>自動売却</b>をONにすると、魚箱がいっぱいのときに自動で売る</li></ol>")},
 {t:T("1日とランク"),b:T("<p>釣り1回ごとに40分進み、18時になると1日が終わります。夜は給料を払って自宅に帰り、施設を整えて眠ると朝になります。相場も毎日変わります。</p><p>売上が増えるとランクが上がり、<b>祝い金と特典</b>（売値アップ、魚箱拡大など）がもらえます。画面上部のランクをタップすると一覧が見られます。それでは、いってらっしゃい！</p>")}];
function showHelp(i=0){
  const L=HELP.filter(x=>!x.k||feat(x.k)),h=L[i]||L[0],last=i>=L.length-1;
  $('#box').innerHTML=T("<div class=\"help\"><h3>{1}</h3>{2}<div class=\"row\"><button class=\"ghost\" id=\"hp\" {3}>戻る</button><button class=\"big\" id=\"hn\" style=\"flex:1;width:auto\">{4}</button>{5}</div><p class=\"dots\">{6} / {7}</p></div>",[h.t,h.b,i?'':'disabled',last?T("はじめる"):T("次へ"),last?'':T("<button class=\"ghost\" id=\"hs\">スキップ</button>"),i+1,L.length]);
  $('#veil').hidden=false;
  $('#hp').onclick=()=>showHelp(i-1);
  const finish=skipped=>{G.seen=1;save();$('#veil').hidden=true;openTab(G.home?'home':'fish');say(T("「投げる」を押して釣りを始めよう。"));if(skipped)toast(T("遊び方は、右上の「遊び方」か、設定タブで、いつでも見られます"))};
  $('#hn').onclick=()=>{if(!last){showHelp(i+1);return}finish(false)};
  const hs=$('#hs');if(hs)hs.onclick=()=>finish(true);
}

function person(c,x,y,col,hat,s){

  c.fillStyle='#2b3a4a';c.fillRect(-3.5,-9,3,9);c.fillRect(.5,-9,3,9);
  c.fillStyle=col;c.fillRect(-5,-24,10,15);
  c.fillStyle='#f1c9a0';c.beginPath();c.arc(0,-29,5,0,7);c.fill();
  c.fillStyle=hat;c.fillRect(-6.5,-33,13,2.5);c.beginPath();c.arc(0,-33,5,Math.PI,0);c.fill();
  c.restore();
}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,col);g.addColorStop(1,col+'00');c.save();c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore()}
function drawCrew(cr,ts){
  const x=crewX(cr.i),e=cr.ev&&cr.ev.delay<=0?cr.ev:null;
  cx.save();cx.globalAlpha=cr.pop;cx.translate(0,-(1-cr.pop)*24);
  person(cx,x,120,COLS[cr.i%10],HATS[cr.i%5],.8);
  const rx=x+24,ry=86,bx=x+30;let by=148+Math.sin(ts/600+cr.i*1.7)*2;
  if(e&&e.t<.5)by+=5;
  cx.strokeStyle='#d9c7a8';cx.lineWidth=2;cx.beginPath();cx.moveTo(x+4,104);cx.lineTo(rx,ry);cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1;cx.beginPath();cx.moveTo(rx,ry);cx.lineTo(bx,by);cx.stroke();
  if(!e||e.t<.3){cx.fillStyle=cr.i%2?'#ff5a4e':'#ffd24a';cx.beginPath();cx.arc(bx,by,3.2,0,7);cx.fill()}
  if(e&&e.t>=.3&&e.t<1.3){const u=(e.t-.3)/1,fx=bx+(x+8-bx)*u,fy=by+(ry-by)*u-Math.sin(u*Math.PI)*22;drawSp(cx,e.sp,fx,fy,24)}
  if(e&&e.t>=1.2){cx.globalAlpha=cr.pop*clamp(1-(e.t-1.2)/1.2,0,1);cx.fillStyle='#ffd24a';cx.font='900 13px sans-serif';cx.textAlign='center';cx.fillText('+'+yen(e.val),x+6,78-(e.t-1.2)*14)}
  cx.restore();
}
const HULLC=['','#3a6f8f','#2b4a63','#2d8f8a','#a33a3a','#5a3f9a','#7a2a1a','#4a4a3a','#2a4a7a','#b04a6a'],TOPC=['','#c9d3d9','#e4e9ec','#f4f4f4','#e8e8ee','#d9c8ff','#ffd0b0','#d8d0b8','#d0e4ff','#fff0c8'],STRIPEC=['','#d9503f','#d9503f','#ffd24a','#ffffff','#ffd0ff','#ff5a2a','#c8a04a','#6ab0ff','#ffd24a'];
function areaDeco(a,ts){
  if(a===2){cx.fillStyle='rgba(0,10,30,.25)';cx.fillRect(0,130,480,120)}
  else if(a===3){
    cx.fillStyle='#2d6a4f';cx.beginPath();cx.ellipse(410,134,70,12,0,Math.PI,0);cx.fill();
    [[392,100,1],[432,106,-1]].forEach(([x,y,d])=>{cx.strokeStyle='#5a4028';cx.lineWidth=3;cx.beginPath();cx.moveTo(x,130);cx.quadraticCurveTo(x+4*d,y+16,x+2*d,y);cx.stroke();
      cx.fillStyle='#3fae6a';for(let k=0;k<5;k++){cx.beginPath();cx.ellipse(x+2*d,y,15,3.5,-1.3+k*.65,0,7);cx.fill()}});
  }else if(a===4){
    [[300,50,34],[390,72,48],[452,40,24]].forEach(([x,w,hh],i)=>{const dx=Math.sin(ts/4000+i)*3;
      cx.fillStyle='rgba(230,243,252,.95)';cx.beginPath();cx.moveTo(x+dx,134);cx.lineTo(x+dx+w*.35,134-hh);cx.lineTo(x+dx+w*.6,134-hh*.55);cx.lineTo(x+dx+w*.78,134-hh*.8);cx.lineTo(x+dx+w,134);cx.closePath();cx.fill();
      cx.fillStyle='rgba(190,220,240,.3)';cx.beginPath();cx.moveTo(x+dx,134);cx.lineTo(x+dx+w,134);cx.lineTo(x+dx+w*.5,134+hh*.5);cx.closePath();cx.fill()});
  }else if(a===5){

    for(let i=0;i<16;i++){const x=(i*71+ts/40)%480,y=50+(i*37)%70+Math.sin(ts/700+i)*6;cx.fillStyle=`hsla(${260+i*10},80%,78%,${.35+.3*Math.sin(ts/400+i)})`;cx.beginPath();cx.arc(x,y,2+(i%3),0,7);cx.fill()}
  }
}
function areaDeco2(a,ts){

    cx.fillStyle='#2a1a16';cx.beginPath();cx.moveTo(300,134);cx.lineTo(380,60);cx.lineTo(410,60);cx.lineTo(480,134);cx.closePath();cx.fill();

  }else if(a===7){   // 沈没船：海面から突き出た船体とマスト

    cx.strokeStyle='#4a3a2a';cx.lineWidth=3;cx.beginPath();cx.moveTo(372,116);cx.lineTo(366,60);cx.moveTo(366,70);cx.lineTo(400,100);cx.stroke();
    cx.fillStyle='rgba(220,220,230,.35)';cx.beginPath();cx.moveTo(366,70);cx.lineTo(392,92);cx.lineTo(366,96);cx.fill();
  }else if(a===8){   // 極夜：オーロラと星

    cx.fillStyle='#fff';for(let i=0;i<30;i++){cx.globalAlpha=.4+.5*Math.abs(Math.sin(ts/800+i));cx.fillRect((i*83)%480,(i*41)%100,1.6,1.6)}cx.globalAlpha=1;

    for(let i=0;i<14;i++){const t=(ts/2600+i*.071)%1;cx.fillStyle='rgba(255,255,255,'+(.5*(1-t))+')';cx.beginPath();cx.arc((i*67)%480+Math.sin(ts/500+i)*4,250-t*120,2+(i%3),0,7);cx.fill()}
  }

  const p=clamp((G.min-360)/720,0,1);

  cx.fillStyle=`hsl(${p<.7?45:30},90%,${70-p*20}%)`;cx.beginPath();cx.arc(380,Math.min(110,40+p*90),22,0,7);cx.fill();
  const sea=cx.createLinearGradient(0,130,0,250);sea.addColorStop(0,`hsl(${A.sea},${A.ss}%,${34-p*14+A.lb}%)`);sea.addColorStop(1,`hsl(${A.sea+8},${A.ss+5}%,${16-p*6+A.lb*.6}%)`);
  cx.fillStyle=sea;cx.fillRect(0,130,480,120);

    cx.fillStyle=STRIPEC[G.area];cx.fillRect(0,132,deckW,3);

  }else{

let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(!veilOpen()){
    if(S.st==='wait'){S.t-=dt;if(S.t<=0){rollFish();S.st='bite';S.t=1.4+.05*G.lv.bait+.04*sx('agi');say(S.tier>=4?T("水面が大きく盛り上がった…！ 主だ！！ アワセろ！"):S.v?T("アタリ！ いつもと色が違う…！？ アワセ！"):S.tier>=2?T("ものすごいアタリだ！！ 逃すな、アワセ！"):S.tier===1?T("アタリ！ いつもと違う引きだ…！ アワセ！"):T("アタリ！ 今だ、アワセ！"));if(S.tier)vibe(S.tier);if(S.tier>=4&&!G.noFx)FX.shake=.4;label()}}
    else if(S.st==='bite'){S.t-=dt;if(S.t<=0){say(S.tier>=4?T("逃した…今のは主だったかもしれない！"):S.tier?T("逃した…今のはレアな魚だったかも！"):T("エサだけ取られた…"));S.ok=false;end(false)}}
    else if(S.st==='fight'){fightStep(dt)}
    else if(S.st==='result'){S.t+=dt}
  }
  if(S.st==='fight'&&S.f.struggle&&!G.noFx){S.f.spl=(S.f.spl||0)-dt;if(S.f.spl<=0){S.f.spl=.06;const x=fishX(S.f);for(let k=0;k<3;k++)PT.push({x:x+rnd(-20,20),y:150,vx:rnd(-50,50),vy:rnd(-170,-90),g:400,life:rnd(.4,.8),c:'#dff3ff',r:rnd(1.5,2.8),s:false})}}
  syncCrew();crewStep(dt);
  for(let i=PT.length-1;i>=0;i--){const q=PT[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;if(q.life<=0||q.y>260)PT.splice(i,1)}
  if(FX.rain>0){FX.rain-=dt;for(let k=0;k<2;k++)PT.push({x:rnd(0,480),y:-5,vx:rnd(-10,10),vy:rnd(60,140),g:30,life:rnd(1.2,2),c:Math.random()<.5?'#ffd24a':'#fff',r:rnd(1.5,3),s:true})}
  FX.flash=Math.max(0,FX.flash-dt*1.2);FX.shake=Math.max(0,FX.shake-dt);
  const f=S.f;
  $('#tens').style.width=(S.st==='fight'?f.tens:0)+'%';
  $('#tens').classList.toggle('hot',S.st==='fight'&&f.tens>75);
  $('#prog').style.width=(S.st==='fight'?f.prog:0)+'%';
  if(!$('#p-fish').hidden)draw(ts);
  if(!$('#p-home').hidden)drawHome(ts);
  requestAnimationFrame(loop);
}
applyUi();syncCrew(true);renderAll();AREAS.forEach((_,a)=>checkComplete(a));document.addEventListener('visibilitychange',()=>{if(document.hidden){save();cloudPush(false);notifyPlan()}else{cloudRecheck();if(window.AppNotify)AppNotify.cancel();if(!veilOpen()&&(S.st==='idle'||S.st==='result')&&G.lastSeen&&Date.now()-G.lastSeen>=15*60000)offlineGain()}});
window.addEventListener('focus',cloudRecheck);label();say(T("「投げる」を押して釣りを始めよう。"));if(G.home){openTab('home');say(T("夜です。自宅で休もう。"))}(async()=>{
  await Promise.race([cloudInit(),new Promise(r=>setTimeout(r,2500))]);
  if(!veilOpen()){
    if(!G.seen){if(Cloud.kind==='app'&&Cloud.status==='signedout'&&!hasProgress())showWelcome();else showHelp(0)}
    else{settleNight();offlineGain()}
  }
})();
requestAnimationFrame(loop);
</script>
