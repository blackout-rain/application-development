<title>海風フィッシャリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=DM+Mono:wght@500&display=swap">
<style>
/* layout: one phone-width column. HUD on top, tabbed panels (釣り / 市場 / 設備 / 図鑑) below. Dusk-harbor palette, dark by commitment. */
:root{
  --bg:#0a1c2b;--panel:#112f46;--panel2:#183f5c;--line:#2a5776;
  --fg:#eaf3f1;--sub:#8db2c3;--accent:#ffb454;--good:#5fdc9c;--bad:#ff6b5e;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-weight:500;font-size:15px;line-height:1.5;
  max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
#help{padding:4px 12px;font-size:.85rem}
h1{font-size:1.25rem;font-weight:900;margin:0;letter-spacing:.04em}
.hud{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:.9rem}
.hud b{color:var(--fg)}
#money{color:var(--accent);font-size:1.1rem}
.rank{width:100%;display:flex;gap:10px;align-items:center;color:var(--sub);font-size:.8rem}
.bar{flex:1;height:8px;background:var(--panel);border-radius:6px;overflow:hidden;min-width:0}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
nav button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 0;font-weight:700}
nav button[aria-selected=true]{background:var(--accent);color:#2b1a00;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas{display:block;width:100%;height:auto;border-radius:12px;background:#14506f}
#msg{min-height:3em;margin:10px 0;font-weight:700}
.meters{display:grid;gap:8px;margin-bottom:10px}
.meter{display:grid;grid-template-columns:4.5rem 1fr;gap:10px;align-items:center;font-size:.8rem;color:var(--sub)}
.meter .bar{height:14px}
#tens{background:var(--good);transition:background .1s}
#tens.hot{background:var(--bad)}
#prog{background:var(--accent)}
#act{width:100%;padding:18px;border-radius:14px;border:0;background:var(--accent);color:#2b1a00;font-weight:900;font-size:1.25rem;touch-action:none;user-select:none;-webkit-user-select:none}
#act:active,#act.down{filter:brightness(.9);transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--sub)}
h2{font-size:1rem;margin:18px 0 8px;font-weight:900}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border-radius:10px;padding:10px 12px}
.item .t{font-weight:700;min-width:0}.item .s{color:var(--sub);font-size:.8rem;min-width:0}
.buy{background:var(--accent);color:#2b1a00;border:0;border-radius:8px;padding:8px 12px;font-weight:900;grid-row:span 2;font-family:var(--mono)}
.buy:disabled{background:var(--line);color:var(--sub);cursor:default}
.up{color:var(--good)}.down{color:var(--bad)}
.big{background:var(--accent);color:#2b1a00;border:0;border-radius:10px;padding:10px 14px;font-weight:900;width:100%}
.big:disabled{background:var(--line);color:var(--sub)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.dex .item{grid-template-columns:auto 1fr;text-align:left}
.dex .off{filter:grayscale(1) brightness(.5)}
#veil{position:fixed;inset:0;background:rgba(5,14,22,.82);display:grid;place-items:center;padding:16px;z-index:5}
#veil[hidden]{display:none}
#veil .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
#veil h3{margin:0 0 10px;font-size:1.2rem}
.ln{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
img.ic{width:48px;height:27px;object-fit:contain;vertical-align:middle;margin-right:6px}
.dex img.ic{width:56px;height:32px;margin:0;grid-row:span 2}
.dex .off{filter:brightness(0) opacity(.35)}
.hint{background:var(--panel);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:12px 0 0;font-size:.85rem;color:var(--sub)}
.hint b{color:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#2b1a00;font-weight:900;padding:12px 18px;border-radius:12px;z-index:9;max-width:min(92vw,420px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast[hidden]{display:none}
.help p{margin:0 0 10px}
.help ol{margin:0 0 10px;padding-left:1.3em}
.help li{margin-bottom:4px}
.help .k{background:var(--panel2);border-radius:6px;padding:1px 7px;font-weight:900;white-space:nowrap}
.dots{color:var(--sub);text-align:center;margin:10px 0 0;font-size:.8rem}
.rank .nx{font-size:.78rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>海風フィッシャリー</h1><button class="ghost" id="help">遊び方</button>
  <div class="hud"><span><b id="day" class="num">1</b>日目</span><span id="clock" class="num">6:00</span><span id="money" class="num">¥500</span></div>
  <div class="rank"><span id="rank">見習い漁師</span><div class="bar"><i id="goal"></i></div><span class="nx" id="goalv"></span></div>
</header>

<nav role="tablist">
  <button role="tab" data-tab="fish" aria-selected="true">釣り</button>
  <button role="tab" data-tab="sell" aria-selected="false">市場</button>
  <button role="tab" data-tab="shop" aria-selected="false">設備</button>
  <button role="tab" data-tab="dex" aria-selected="false">図鑑</button>
</nav>

<section id="p-fish">
  <canvas id="cv" width="480" height="250"></canvas>
  <div id="msg" aria-live="polite"></div>
  <div class="meters">
    <div class="meter"><span>テンション</span><div class="bar"><i id="tens"></i></div></div>
    <div class="meter"><span>寄せ具合</span><div class="bar"><i id="prog"></i></div></div>
  </div>
  <button id="act">投げる</button>
  <div class="row" id="areas"></div>
  <p class="hint" id="hint"></p>
  <div class="row"><span class="chip">魚箱 <b id="cap" class="num"></b></span><button class="ghost" id="home">今日は帰港する</button></div>
</section>

<section id="p-sell" hidden></section>
<section id="p-shop" hidden></section>
<section id="p-dex" hidden></section>

<div id="toast" hidden></div>
<div id="veil" hidden><div class="box" id="box"></div></div>

<script>
/* ---------- data ---------- */
const AREAS=[
  {name:'港の堤防',base:250,wage:100},
  {name:'沖合',base:700,wage:200},
  {name:'深海',base:1800,wage:400}];
// n:名前 e:絵文字 d:[体色,腹色,体型,模様,模様色,特徴] a:海域 w:出やすさ min/max:cm p:1cmあたりの値段 s:引きの強さ
const SP=[
  {n:'イワシ',d:['#4b78a8','#dfe9f0','a','h','#2f4f78'],a:0,w:40,min:10,max:20,p:5,s:.5},
  {n:'アジ',d:['#6f8f6a','#f0e6c8','a','h','#d9b84a'],a:0,w:40,min:15,max:30,p:8,s:.7},
  {n:'キス',d:['#d9c19a','#fbf3e2','a','',''],a:0,w:25,min:15,max:28,p:12,s:.8},
  {n:'サヨリ',d:['#9fb8c8','#eef4f7','l','h','#5e7f95'],a:0,w:18,min:20,max:40,p:9,s:.6},
  {n:'メバル',d:['#8a4b3a','#e8b9a0','r','s','#5a2d22','bigeye'],a:0,w:15,min:15,max:25,p:18,s:.9},
  {n:'カサゴ',d:['#d4553c','#f0a58a','r','p','#8c2f20'],a:0,w:12,min:15,max:30,p:20,s:1.0},
  {n:'カレイ',d:['#8d7458','#d9c9ae','f','p','#5a4630'],a:0,w:10,min:20,max:45,p:16,s:1.1},
  {n:'カニ',e:'🦀',a:0,w:10,min:8,max:20,p:22,s:.8},
  {n:'クロダイ',d:['#4d5560','#c9ced4','r','h','#2f353d'],a:0,w:6,min:25,max:50,p:14,s:1.5},
  {n:'サバ',d:['#3d7a8c','#e6eef0','b','w','#1f3f4d'],a:1,w:35,min:25,max:45,p:10,s:1.0},
  {n:'カツオ',d:['#2f5b8f','#d5dde6','t','h','#1b2f4d'],a:1,w:20,min:40,max:70,p:14,s:1.6},
  {n:'サワラ',d:['#8fa3b3','#e9eef2','a','p','#556a7a'],a:1,w:14,min:45,max:90,p:15,s:1.5},
  {n:'イカ',e:'🦑',a:1,w:25,min:20,max:40,p:18,s:1.1},
  {n:'タコ',e:'🐙',a:1,w:15,min:25,max:60,p:16,s:1.3},
  {n:'タイ',d:['#e0637a','#f7d3d9','r','p','#6bb7d9'],a:1,w:12,min:30,max:70,p:25,s:1.8},
  {n:'ヒラメ',d:['#a99068','#ece3cf','f','p','#6d5a3a'],a:1,w:8,min:40,max:80,p:28,s:1.7},
  {n:'ブリ',d:['#556d63','#e9ede5','b','h','#e0b94a'],a:1,w:10,min:50,max:90,p:22,s:2.2},
  {n:'イセエビ',e:'🦞',a:1,w:6,min:20,max:40,p:45,s:1.4},
  {n:'キンメダイ',d:['#d8322e','#f1b2a8','r','','','bigeye'],a:2,w:25,min:30,max:55,p:50,s:1.8},
  {n:'アンコウ',d:['#6b4a3c','#a98672','f','p','#3a261e'],a:2,w:12,min:40,max:90,p:40,s:2.0},
  {n:'サメ',e:'🦈',a:2,w:8,min:100,max:250,p:18,s:2.7},
  {n:'マグロ',d:['#243e6b','#cfd6e0','t','h','#d7b13a'],a:2,w:8,min:100,max:250,p:28,s:2.8},
  {n:'カジキ',d:['#2c5c8f','#dde6ee','t','h','#122a4a','bill'],a:2,w:4,min:150,max:300,p:30,s:3.0},
  {n:'シーラカンス',d:['#34465c','#6f86a0','r','p','#b9d3e8'],a:2,w:3,min:100,max:180,p:60,s:2.4},
  {n:'リュウグウノツカイ',d:['#c9d4dc','#eef2f5','l','h','#d94a3a','ribbon'],a:2,w:2,min:200,max:350,p:15,s:2.5}];
const UP=[
  {k:'rod',n:'釣り竿',d:'巻き上げが速くなる',c:[600,1500,4000,10000,25000]},
  {k:'line',n:'釣り糸',d:'テンションが上がりにくい',c:[400,1200,3500,9000,22000]},
  {k:'bait',n:'エサ',d:'アタリが早く、珍しい魚が寄る',c:[300,1000,3000,8000,20000]},
  {k:'cool',n:'クーラーボックス',d:'魚箱+5、鮮度が落ちにくい',c:[500,1500,4000,10000,24000]},
  {k:'mkt',n:'市場コネ',d:'売値+5%',c:[1000,3000,8000,20000,50000]}];
const BOATS=[{n:'小型ボート',c:3000,d:'沖合に出られる'},{n:'大型漁船',c:25000,d:'深海に出られる'}];
const RANKS=[[0,'見習い漁師'],[300,'釣り初心者'],[1000,'駆け出し漁師'],[3000,'港の人気者'],[8000,'一人前の漁師'],[20000,'ベテラン漁師'],[50000,'船長'],[120000,'船団長'],[300000,'網元'],[600000,'海の名士'],[1000000,'漁業王']];
const GOAL=1000000, ATTEMPT_MIN=40, DAY_END=1080, MAX_CREW=10;

/* ---------- state ---------- */
const KEY='umikaze-fishery-v1';
const $=s=>document.querySelector(s);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fresh(){const mult={};SP.forEach(s=>mult[s.n]=1);
  return{v:1,seen:0,catches:0,day:1,min:360,money:500,earned:0,lv:{rod:0,line:0,bait:0,cool:0,mkt:0},boat:0,crew:0,area:0,fish:[],dex:{},mult,prev:{...mult}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){s.mult=s.mult||{};s.prev=s.prev||{};SP.forEach(x=>{if(!(x.n in s.mult))s.mult[x.n]=1;if(!(x.n in s.prev))s.prev[x.n]=s.mult[x.n]});s.catches=s.catches||0;return s}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
let G=load()||fresh();
const cap=()=>8+5*G.lv.cool;
const S={st:'idle',t:0,sp:null,size:0,f:null,holding:false,ok:false};

/* ---------- rank ---------- */
const rankIdx=()=>RANKS.filter(r=>G.earned>=r[0]).length-1;
function earn(n){const b=rankIdx();G.earned+=n;const a=rankIdx();if(a>b)toast(`ランクアップ！「${RANKS[a][1]}」`)}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4000)}

/* ---------- price ---------- */
function price(fi){
  const sp=SP.find(s=>s.n===fi.n);
  const big=fi.size>=sp.max*.9?1.5:1;
  return Math.round(fi.size*sp.p*G.mult[fi.n]*(fi.fresh/100)*(1+.05*G.lv.mkt)*big);
}

/* ---------- fishing core ---------- */
function pickSpecies(){
  const list=SP.filter(s=>s.a===G.area);
  const ws=list.map(s=>s.w*(s.w<=12?1+.25*G.lv.bait:1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}
  return list[0];
}
function say(t){$('#msg').textContent=t}
function press(){
  if(veilOpen())return;
  switch(S.st){
    case'idle':
      if(G.fish.length>=cap()){say('魚箱がいっぱい。市場で売ろう。');return}
      S.st='wait';S.t=rnd(1.2,3.5)/(1+.2*G.lv.bait);say('浮きを見守ろう…');break;
    case'wait':
      S.st='idle';say('早すぎた。仕掛けを引き上げた。');break;
    case'bite':hook();break;
    case'fight':S.holding=true;break;
    case'result':if(S.t>.6)next();break;
  }
  label();
}
function release(){S.holding=false}
function hook(){
  const sp=pickSpecies();
  const size=Math.round(sp.min+(sp.max-sp.min)*Math.pow(Math.random(),1.8));
  const ratio=(size-sp.min)/(sp.max-sp.min);
  S.sp=sp;S.size=size;
  S.f={pw:sp.s*(.8+.4*ratio),prog:35,tens:0,struggle:false,timer:rnd(.6,1.2)};
  S.st='fight';S.holding=false;say('ヒット！ 巻いて寄せよう。暴れたら離してテンションを逃がす。');
}
function fightStep(dt){
  const f=S.f,rod=G.lv.rod,line=G.lv.line;const eas=G.catches<10?.5:G.catches<30?.75:1;
  f.timer-=dt;
  if(f.timer<=0){f.struggle=!f.struggle;f.timer=f.struggle?rnd(.6,1.4):rnd(.8,1.8)}
  if(S.holding){
    f.prog+=16*(1+.3*rod)*(eas<1?1.25:1)/(.5+.5*f.pw)*(f.struggle?.3:1)*dt;
    f.tens+=(f.struggle?60:20)*(.6+.4*f.pw)*eas/(1+.25*line)*dt;
  }else{
    f.tens-=45*dt;
    f.prog-=(f.struggle?10*f.pw*eas:2*eas)*dt;
  }
  f.tens=clamp(f.tens,0,100);f.prog=Math.min(f.prog,100);
  if(f.tens>=100){S.ok=false;say('糸が切れた…！');end(false)}
  else if(f.prog<=0){S.ok=false;say(`${S.sp.n}に逃げられた…`);end(false)}
  else if(f.prog>=100){landed()}
  else if(f.struggle)say(S.holding?'暴れてる！ 離して！':'暴れてる…耐えろ');
  else say(S.holding?'今だ、巻け！':'落ち着いた。巻こう！');
}
function landed(){
  const sp=S.sp;
  G.fish.push({n:sp.n,size:S.size,fresh:100});G.catches++;
  const d=G.dex[sp.n]||(G.dex[sp.n]={c:0,best:0});
  const rec=S.size>d.best;d.c++;d.best=Math.max(d.best,S.size);
  const big=S.size>=sp.max*.9;
  say(`${sp.n} ${S.size}cm を釣った！${big?'大物！':''}${rec?' 自己記録！':''}（${yen(price(G.fish[G.fish.length-1]))}）`);
  S.ok=true;end(true);
}
function end(){
  S.holding=false;G.min+=ATTEMPT_MIN;S.st='result';S.t=0;save();hud();renderAll();label();
}
function next(){
  if(G.min>=DAY_END){dayEnd();return}
  S.st='idle';say('');label();
}
function label(){
  const b=$('#act');
  b.textContent={idle:'投げる',wait:'待つ…（早く引くと戻る）',bite:'アワセ！',fight:'巻く（押し続ける）',result:'つぎへ'}[S.st];
  b.classList.toggle('down',S.st==='fight'&&S.holding);
}

/* ---------- day cycle ---------- */
function veilOpen(){return !$('#veil').hidden}
function dayEnd(){
  const area=AREAS[G.boat];
  const haul=G.crew?Math.round(G.crew*area.base*rnd(.7,1.3)):0;
  const wage=G.crew*area.wage;
  const rot=[];
  const decay=Math.max(8,30-5*G.lv.cool);
  G.fish.forEach(f=>f.fresh-=decay);
  const spoiled=G.fish.filter(f=>f.fresh<=0).length;
  G.fish=G.fish.filter(f=>f.fresh>0);
  G.money+=haul;earn(haul);
  const pay=Math.min(wage,G.money);G.money-=pay;
  SP.forEach(s=>{G.prev[s.n]=G.mult[s.n];G.mult[s.n]=clamp(G.mult[s.n]+rnd(-.15,.15)+(1-G.mult[s.n])*.2,.6,1.6)});
  const hot=SP.slice().sort((a,b)=>(G.mult[b.n]/G.prev[b.n])-(G.mult[a.n]/G.prev[a.n]))[0];
  $('#box').innerHTML=`<h3>${G.day}日目 終了</h3>
    <div class="ln"><span>従業員の水揚げ（${G.crew}人）</span><b class="num up">+${yen(haul)}</b></div>
    <div class="ln"><span>給料</span><b class="num down">-${yen(pay)}</b></div>
    <div class="ln"><span>傷んで捨てた魚</span><b class="num">${spoiled}匹</b></div>
    <div class="ln"><span>明日の注目</span><b>${hot.n}が値上がり</b></div>
    <p style="color:var(--sub);font-size:.85rem">売れ残りの魚は一晩ごとに鮮度が落ち、値段も下がります。</p>
    <button class="big" id="nextday">${G.day+1}日目の朝へ</button>`;
  $('#veil').hidden=false;
  $('#nextday').onclick=()=>{G.day++;G.min=360;S.st='idle';$('#veil').hidden=true;say('');save();hud();renderAll();label()};
}

/* ---------- fish art ---------- */
function drawFish(c,x,y,L,d){
  const [body,belly,shape,pat,pc,ex]=d,rx=L/2,ry=L/2*{a:.26,b:.34,r:.5,f:.55,l:.13,t:.3}[shape];
  c.save();c.translate(x,y);
  c.fillStyle=body;
  c.beginPath();c.moveTo(rx*.8,0);c.lineTo(rx*1.3,-ry*1.2-1);c.lineTo(rx*1.1,0);c.lineTo(rx*1.3,ry*1.2+1);c.closePath();c.fill();
  if(ex==='ribbon'){c.fillStyle=pc;c.fillRect(-rx*.7,-ry*2.6,rx*1.7,ry*1.8)}
  else{c.beginPath();c.moveTo(-rx*.25,-ry*.85);c.quadraticCurveTo(rx*.1,-ry*1.8,rx*.5,-ry*.8);c.closePath();c.fill()}
  if(ex==='bill'){c.beginPath();c.moveTo(-rx*.85,-ry*.2);c.lineTo(-rx*1.55,0);c.lineTo(-rx*.85,ry*.2);c.closePath();c.fill()}
  const g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,body);g.addColorStop(.55,body);g.addColorStop(1,belly);
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);c.fill();
  c.save();c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);c.clip();c.fillStyle=c.strokeStyle=pc||body;
  if(pat==='s')for(let i=-1;i<=3;i++)c.fillRect(rx*(-.25+i*.22),-ry,rx*.08,ry*2);
  else if(pat==='h')c.fillRect(-rx,-ry*.12,rx*2,Math.max(1.5,ry*.2));
  else if(pat==='w'){c.lineWidth=Math.max(1,ry*.14);for(let i=0;i<6;i++){c.beginPath();c.moveTo(-rx*.4+i*rx*.18,-ry);c.lineTo(-rx*.32+i*rx*.18,-ry*.2);c.lineTo(-rx*.4+i*rx*.18,ry*.1);c.stroke()}}
  else if(pat==='p')for(let i=0;i<10;i++){c.beginPath();c.arc(Math.sin(i*2.3)*rx*.65,Math.cos(i*3.1)*ry*.6,Math.max(1,ry*.11),0,7);c.fill()}
  c.restore();
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(-rx*.1,ry*.25,rx*.18,ry*.14,.5,0,7);c.fill();
  const er=Math.max(2,ry*(ex==='bigeye'?.36:.22));
  c.fillStyle='#fff';c.beginPath();c.arc(-rx*.6,-ry*.15,er,0,7);c.fill();
  c.fillStyle='#111';c.beginPath();c.arc(-rx*.62,-ry*.15,er*.55,0,7);c.fill();
  c.restore();
}
function drawSp(c,sp,x,y,L){
  if(sp.d){drawFish(c,x,y,L,sp.d);return}
  c.save();c.font=`${L*.85}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(sp.e,x,y);c.restore();
}
const ICONS={};
function icon(sp){
  if(ICONS[sp.n])return ICONS[sp.n];
  const k=document.createElement('canvas');k.width=96;k.height=54;
  drawSp(k.getContext('2d'),sp,sp.d?46:48,28,sp.d?58:46);
  return ICONS[sp.n]=k.toDataURL();
}
const ico=(sp,cls='')=>`<img class="ic ${cls}" src="${icon(sp)}" alt="">`;

/* ---------- ui ---------- */
function hud(){
  $('#day').textContent=G.day;
  $('#clock').textContent=`${Math.floor(G.min/60)}:${String(G.min%60).padStart(2,'0')}`;
  $('#money').textContent=yen(G.money);
  const ri=rankIdx(),nx=RANKS[ri+1];
  $('#rank').textContent=RANKS[ri][1];
  $('#goal').style.width=(nx?(G.earned-RANKS[ri][0])/(nx[0]-RANKS[ri][0])*100:100)+'%';
  $('#goalv').textContent=nx?`次は「${nx[1]}」あと${yen(nx[0]-G.earned)}`:'最高ランク！';
  document.querySelector('[data-tab=sell]').textContent=G.fish.length?`市場(${G.fish.length})`:'市場';
  hint();
  $('#cap').textContent=`${G.fish.length}/${cap()}`;
}
function renderAreas(){
  $('#areas').innerHTML=AREAS.map((a,i)=>`<button class="chip" data-area="${i}" aria-pressed="${G.area===i}">${i>G.boat?'🔒 ':''}${a.name}</button>`).join('');
  $('#areas').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.area;if(i>G.boat){openTab('shop');toast('「船」を買うと出られます');return}if(S.st!=='idle'){toast('釣りの合間に切り替えてね');return}G.area=i;save();renderAreas()});
}
function renderSell(){
  const sorted=G.fish.map((f,i)=>({f,i,p:price(f)})).sort((a,b)=>b.p-a.p);
  const total=sorted.reduce((a,x)=>a+x.p,0);
  const items=sorted.map(({f,i,p})=>{
    const sp=SP.find(s=>s.n===f.n);
    return `<div class="item"><div class="t">${ico(sp)}${f.n} <span class="num">${f.size}cm</span>${f.size>=sp.max*.9?' ★':''}</div>
      <button class="buy" data-i="${i}">${yen(p)}</button><div class="s">鮮度 <span class="num">${f.fresh}%</span></div></div>`}).join('');
  const market=SP.filter(s=>s.a<=G.boat).map(s=>{
    const m=G.mult[s.n],d=m-G.prev[s.n];
    return `<div class="ln"><span>${ico(s)}${s.n}</span><span class="num">×${m.toFixed(2)} <span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'}</span></span></div>`}).join('');
  $('#p-sell').innerHTML=`<h2>魚箱（${G.fish.length}/${cap()}）</h2>
    <button class="big" id="sellall" ${G.fish.length?'':'disabled'}>すべて売る ${yen(total)}</button>
    <div class="list" style="margin-top:10px">${items||'<p style="color:var(--sub)">魚箱は空です。釣りに出よう。</p>'}</div>
    <h2>今日の相場</h2><div>${market}</div>`;
  $('#p-sell').querySelectorAll('.buy').forEach(b=>b.onclick=()=>sell([+b.dataset.i]));
  const sa=$('#sellall');if(sa)sa.onclick=()=>sell(G.fish.map((_,i)=>i));
}
function sell(idx){
  let sum=0;idx.forEach(i=>sum+=price(G.fish[i]));
  G.fish=G.fish.filter((_,i)=>!idx.includes(i));
  G.money+=sum;earn(sum);save();hud();renderAll();
}
function renderShop(){
  const ups=UP.map(u=>{
    const lv=G.lv[u.k],max=lv>=u.c.length,c=u.c[lv];
    return `<div class="item"><div class="t">${u.n} <span class="num">Lv${lv}${max?' MAX':''}</span></div>
      <button class="buy" data-up="${u.k}" ${max||G.money<c?'disabled':''}>${max?'—':yen(c)}</button><div class="s">${u.d}</div></div>`}).join('');
  const b=BOATS[G.boat];
  const boat=b?`<div class="item"><div class="t">${b.n}</div><button class="buy" data-boat="1" ${G.money<b.c?'disabled':''}>${yen(b.c)}</button><div class="s">${b.d}</div></div>`
    :`<div class="item"><div class="t">大型漁船 保有中</div><div class="s">すべての海域に出られる</div></div>`;
  const cc=Math.round(1500*Math.pow(1.6,G.crew)/100)*100,w=AREAS[G.boat].wage,h=AREAS[G.boat].base;
  const crew=`<div class="item"><div class="t">漁師を雇う <span class="num">${G.crew}/${MAX_CREW}人</span></div>
    <button class="buy" data-crew="1" ${G.crew>=MAX_CREW||G.money<cc?'disabled':''}>${G.crew>=MAX_CREW?'—':yen(cc)}</button>
    <div class="s">1人あたり 水揚げ約${yen(h)}/日、給料${yen(w)}/日</div></div>`;
  $('#p-shop').innerHTML=`<h2>道具</h2><div class="list">${ups}</div><h2>船</h2><div class="list">${boat}</div><h2>人</h2><div class="list">${crew}</div>
    <h2>データ</h2><button class="ghost" id="reset">最初からやり直す</button>`;
  const sh=$('#p-shop');
  sh.querySelectorAll('[data-up]').forEach(e=>e.onclick=()=>{const u=UP.find(x=>x.k===e.dataset.up);const c=u.c[G.lv[u.k]];if(G.money>=c){G.money-=c;G.lv[u.k]++;save();hud();renderAll()}});
  sh.querySelectorAll('[data-boat]').forEach(e=>e.onclick=()=>{if(G.money>=b.c){G.money-=b.c;G.boat++;G.area=G.boat;save();hud();renderAll();toast(`${AREAS[G.boat].name}に出られます！釣りタブへ`);}});
  sh.querySelectorAll('[data-crew]').forEach(e=>e.onclick=()=>{if(G.money>=cc&&G.crew<MAX_CREW){G.money-=cc;G.crew++;save();hud();renderAll()}});
  $('#reset').onclick=function(){if(this.dataset.arm){G=fresh();S.st='idle';save();hud();renderAll();label();say('')}else{this.dataset.arm=1;this.textContent='本当に消す？もう一度押すと確定'}};
}
function renderDex(){
  const got=SP.filter(s=>G.dex[s.n]).length;
  $('#p-dex').innerHTML=`<h2>図鑑 <span class="num">${got}/${SP.length}</span></h2><div class="dex">`+SP.map(s=>{
    const d=G.dex[s.n];
    return `<div class="item"><img class="ic ${d?'':'off'}" src="${icon(s)}" alt=""><div class="t">${d?s.n:'？？？'}</div><div class="s">${d?`最大 <span class="num">${d.best}cm</span> ×${d.c}`:AREAS[s.a].name}</div></div>`}).join('')+'</div>';
}
function renderAll(){renderAreas();renderSell();renderShop();renderDex();hud()}
function openTab(k){
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===k));
  ['fish','sell','shop','dex'].forEach(t=>$('#p-'+t).hidden=t!==k);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
function hint(){
  const el=$('#hint');
  if(G.boat>=BOATS.length){el.hidden=true;return}
  const b=BOATS[G.boat],a=AREAS[G.boat+1].name;
  el.hidden=false;
  el.innerHTML=G.money>=b.c?`<b>${b.n}が買えます！</b> 「設備」タブの「船」で買うと${a}に出られます。`
    :`${a}へは、「設備」タブの「船」で${b.n}（${yen(b.c)}）を買うと行けます。あと<b class="num">${yen(b.c-G.money)}</b>。`;
}
const HELP=[
 {t:'ようこそ！',b:'<p>魚を釣って、売って、船と仲間を増やす釣り船経営ゲームです。</p><p>目標は、売上を増やして最高ランク「漁業王」になること。まずは釣りから始めましょう。</p>'},
 {t:'釣り方',b:'<ol><li><span class="k">投げる</span>を押して浮きを待つ</li><li>浮きが沈んで「！」が出たら、すぐ<span class="k">アワセ！</span></li><li>ヒットしたら<span class="k">巻く</span>ボタンを押し続けて寄せる</li><li>魚が暴れている間は<b>指を離す</b>。落ち着いたらまた巻く</li></ol><p>テンションが満タンになると糸が切れ、寄せ具合が満タンになると釣れます。パソコンならスペースキーでも操作できます。</p>'},
 {t:'魚を売る',b:'<p>釣った魚は魚箱に入ります（容量があります）。<span class="k">市場</span>タブで売ってお金にしましょう。</p><p>値段は、大きさ・鮮度・今日の相場で決まります。売れ残りは夜のたびに鮮度が落ちるので、早めに売るのがおすすめです。</p>'},
 {t:'設備を強化する',b:'<p><span class="k">設備</span>タブでお金を使って強化できます。</p><ol><li><b>釣り竿</b>：巻き上げが速くなる</li><li><b>釣り糸</b>：テンションが上がりにくい</li><li><b>エサ</b>：アタリが早く、珍しい魚が寄る</li><li><b>クーラーボックス</b>：魚箱が広がり、鮮度も保てる</li><li><b>漁師を雇う</b>：毎晩、水揚げが入る（給料もかかる）</li></ol>'},
 {t:'沖合・深海へ行くには',b:'<ol><li><span class="k">設備</span>タブの「船」で<b>小型ボート（¥3,000）</b>を買うと<b>沖合</b>へ</li><li>さらに<b>大型漁船（¥25,000）</b>を買うと<b>深海</b>へ</li><li>買ったら<span class="k">釣り</span>タブの海域ボタンで行き先を選ぶ</li></ol><p>沖合や深海には、高く売れる大きな魚がいます。釣りタブには、あといくら必要かも表示されます。</p>'},
 {t:'1日とランク',b:'<p>釣り1回ごとに40分進み、18時になると1日が終わります。夜に給料の支払いと水揚げがあり、相場も変わります。</p><p>売上が増えるとランクが上がります。画面上部のバーで、次のランクまでの距離が分かります。それでは、いってらっしゃい！</p>'}];
function showHelp(i=0){
  const h=HELP[i],last=i===HELP.length-1;
  $('#box').innerHTML=`<div class="help"><h3>${h.t}</h3>${h.b}<div class="row"><button class="ghost" id="hp" ${i?'':'disabled'}>戻る</button><button class="big" id="hn" style="flex:1;width:auto">${last?'はじめる':'次へ'}</button></div><p class="dots">${i+1} / ${HELP.length}</p></div>`;
  $('#veil').hidden=false;
  $('#hp').onclick=()=>showHelp(i-1);
  $('#hn').onclick=()=>{if(!last){showHelp(i+1);return}G.seen=1;save();$('#veil').hidden=true;openTab('fish');say('「投げる」を押して釣りを始めよう。')};
}
$('#help').onclick=()=>{if(S.st==='idle'||S.st==='result')showHelp(0);else toast('釣りの合間に開いてね')};
const act=$('#act');
act.addEventListener('pointerdown',e=>{e.preventDefault();press()});
['pointerup','pointerleave','pointercancel'].forEach(ev=>act.addEventListener(ev,()=>{release();label()}));
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.tagName!=='BUTTON'){e.preventDefault();press()}});
addEventListener('keyup',e=>{if(e.code==='Space'){release();label()}});
$('#home').onclick=()=>{if(S.st==='idle'||S.st==='result'){G.min=DAY_END;S.st='result';S.t=1;dayEnd()}};

/* ---------- scene ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');
function draw(ts){
  const p=clamp((G.min-360)/720,0,1);
  const hue=p<.7?200:200-(p-.7)/.3*185,lit=62-p*32;
  cx.fillStyle=`hsl(${hue},55%,${lit}%)`;cx.fillRect(0,0,480,130);
  cx.fillStyle=`hsl(${p<.7?45:30},90%,${70-p*20}%)`;cx.beginPath();cx.arc(380,Math.min(110,40+p*90),22,0,7);cx.fill();
  const sea=cx.createLinearGradient(0,130,0,250);sea.addColorStop(0,`hsl(200,60%,${34-p*14}%)`);sea.addColorStop(1,`hsl(210,65%,${16-p*6}%)`);
  cx.fillStyle=sea;cx.fillRect(0,130,480,120);
  cx.strokeStyle='rgba(255,255,255,.18)';cx.lineWidth=1.5;
  for(let r=0;r<5;r++){cx.beginPath();for(let x=0;x<=480;x+=8){const y=146+r*20+Math.sin(x/38+ts/700+r)*3;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
  cx.fillStyle='#5b4332';
  if(G.area===0){cx.fillRect(0,120,130,14);cx.fillRect(14,134,8,40);cx.fillRect(100,134,8,40)}
  else{cx.font='64px serif';cx.textBaseline='alphabetic';cx.fillText(G.area===1?'🚤':'🚢',2,140)}
  const tip={x:118,y:84};
  cx.strokeStyle='#d9c7a8';cx.lineWidth=3;cx.beginPath();cx.moveTo(62,128);cx.lineTo(tip.x,tip.y);cx.stroke();
  cx.lineWidth=1;cx.strokeStyle='rgba(255,255,255,.8)';
  const st=S.st;
  if(st==='fight'){
    const f=S.f,dist=(1-f.prog/100),fx=140+dist*270,jit=f.struggle?Math.sin(ts/40)*5:0,fy=176+Math.sin(ts/300)*4+jit;
    const L=58+(S.size-S.sp.min)/(S.sp.max-S.sp.min)*52,mx=fx-L/2;
    cx.beginPath();cx.moveTo(tip.x,tip.y);cx.quadraticCurveTo((tip.x+mx)/2,Math.min(tip.y,fy)-10+f.tens*.4,mx,fy);cx.stroke();
    drawSp(cx,S.sp,fx,fy,L);
  }else if(st==='wait'||st==='bite'){
    const bx=300,by=148+(st==='bite'?10+Math.sin(ts/50)*6:Math.sin(ts/500)*2);
    cx.beginPath();cx.moveTo(tip.x,tip.y);cx.quadraticCurveTo((tip.x+bx)/2,tip.y-6,bx,by);cx.stroke();
    cx.fillStyle='#ff5a4e';cx.beginPath();cx.arc(bx,by,6,0,7);cx.fill();
    if(st==='bite'){cx.fillStyle='#ffd24a';cx.font='900 40px sans-serif';cx.fillText('!',bx-8,by-24)}
  }else{
    cx.beginPath();cx.moveTo(tip.x,tip.y);cx.lineTo(tip.x+4,150);cx.stroke();
    if(st==='result'&&S.ok){drawSp(cx,S.sp,tip.x+46,112+Math.sin(ts/200)*4,60)}
  }
}
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(!veilOpen()){
    if(S.st==='wait'){S.t-=dt;if(S.t<=0){S.st='bite';S.t=1.4+.05*G.lv.bait;say('アタリ！ 今だ、アワセ！');label()}}
    else if(S.st==='bite'){S.t-=dt;if(S.t<=0){say('エサだけ取られた…');S.ok=false;end(false)}}
    else if(S.st==='fight'){fightStep(dt)}
    else if(S.st==='result'){S.t+=dt}
  }
  const f=S.f;
  $('#tens').style.width=(S.st==='fight'?f.tens:0)+'%';
  $('#tens').classList.toggle('hot',S.st==='fight'&&f.tens>75);
  $('#prog').style.width=(S.st==='fight'?f.prog:0)+'%';
  draw(ts);requestAnimationFrame(loop);
}
renderAll();label();say('「投げる」を押して釣りを始めよう。');if(!G.seen)showHelp(0);requestAnimationFrame(loop);
</script>
