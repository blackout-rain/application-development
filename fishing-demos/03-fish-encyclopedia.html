<!doctype html><title>魚図鑑</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;background:#0b2a43;color:#e8f4ff;margin:0;padding:16px;max-width:520px;margin:auto}h1{font-size:20px}button{background:#1e90ff;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:16px;cursor:pointer}input,select{padding:8px;font-size:16px;border-radius:6px;border:0}.card{background:#123c5c;border-radius:10px;padding:12px;margin:8px 0}a{color:#7cc4ff}canvas{background:#0e4d7a;border-radius:10px;max-width:100%}</style>
<h1>📖 魚図鑑コレクション</h1><p>タップで「釣った！」を記録。コンプリートを目指そう</p>
<div id="g" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div><p id="p"></p>
<script>const F=[['アジ','🐟'],['サバ','🐟'],['イワシ','🐟'],['キス','🐠'],['クロダイ','🐡'],['スズキ','🐟'],['タコ','🐙'],['イカ','🦑'],['カサゴ','🐠']];
let got=new Set(JSON.parse(localStorage.getItem('dex')||'[]'));
function R(){g.innerHTML='';F.forEach(([n,e])=>{const c=document.createElement('div');c.className='card';c.style.cssText='text-align:center;cursor:pointer;'+(got.has(n)?'':'filter:grayscale(1) brightness(.4)');c.innerHTML='<div style="font-size:32px">'+(got.has(n)?e:'❓')+'</div>'+(got.has(n)?n:'???');c.onclick=()=>{got.add(n);localStorage.setItem('dex',JSON.stringify([...got]));R()};g.append(c)});p.textContent='達成率 '+got.size+'/'+F.length}R()</script>
